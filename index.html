function submitApp(e){e.preventDefault();if(!document.getElementById('basis').files[0]&&!document.getElementById('demoBasis').checked)return toast('请上传付款依据或选择演示账单');if(document.getElementById('advance').value==='是'&&!document.getElementById('cancel').value)return toast('请填写最晚取消时间');let id='FK-'+Date.now();db.apps.push({id,trip:getTrip(document.getElementById('trip').value).id,tripUid:getTrip(document.getElementById('trip').value).uid,note:document.getElementById('note').value,amount:+document.getElementById('amount').value,vendor:document.getElementById('vendor').value,basis:document.getElementById('basis').files[0]?.name||'演示账单.png',costId:document.getElementById('costItem').value,costName:document.getElementById('costItem').selectedOptions[0].text,stage:0,history:['操作提交申请'],advance:document.getElementById('advance').value,cancel:document.getElementById('cancel').value});let a=db.apps.at(-1);a.check=checkPayment(a);a.history.push('付款辅助检查（规则）：'+a.check.messages.join('；'));db.todos.unshift(id+' 待主管审核（模拟通知）');log('提交付款 '+id);selected=id;go('审批与付款')}
function approve(id,risk){let a=db.apps.find(x=>x.id===id);if(!activeRole.startsWith(['主管','财务','总经理'][a.stage])||a.special)return;if(a.stage===0&&checkPayment(a).risk){if(!document.getElementById('riskack')?.checked)return toast('请先确认成本风险');if(!document.getElementById('opinion').value.trim())return toast('请填写主管风险确认意见');a.history.push('主管确认成本风险：'+document.getElementById('opinion').value.trim());}a.history.push(activeRole+' 同意：'+(document.getElementById('opinion').value||'无补充意见'));a.stage++;db.todos.unshift(id+' '+(a.stage===3?'审批通过，财务待付款':'进入'+statuses[a.stage]));log(activeRole+'通过 '+id);render()}
function reject(id,status){let a=db.apps.find(x=>x.id===id),op=document.getElementById('opinion').value.trim();if(!op)return toast('请填写原因');a.special=status;a.history.push(activeRole+' '+status+'：'+op);log(id+' '+status);render()}

function pay(e,id){e.preventDefault();let a=db.apps.find(x=>x.id===id);if(a.stage!==3||a.special||!activeRole.startsWith('财务'))return;if(a.amount>db.balance)return toast('模拟付款账户余额不足');a.account=document.getElementById('account').value;let file=document.getElementById('slip').files[0];if(!file&&!document.getElementById('mockslip').checked)return toast('请上传水单或选择演示水单');a.slip=file?file.name:'演示付款水单.png';a.paydate=document.getElementById('paydate').value;a.stage=4;db.balance=Math.round((db.balance-a.amount)*100)/100;a.history.push('财务付款完成，生成模拟流水 LS-'+Date.now());db.todos.unshift(id+' 付款完成，通知江婧婕；待追回发票 ¥'+money(a.amount));log(id+' 付款完成 ¥'+money(a.amount));render()}
</script><script data-module="diagnostics.js">const DIAGNOSTIC_KEY='xingjie-diagnostics-v1';
let diagnosticMemory=[];
function readDiagnostics(){try{return JSON.parse(localStorage.getItem(DIAGNOSTIC_KEY))||diagnosticMemory}catch{return diagnosticMemory}}
function diagnostic(action,result,stage,detail=''){
 const entry={time:new Date().toISOString(),action,result,stage,detail,role:typeof activeRole==='string'?activeRole:'',reference:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)};
 diagnosticMemory=[entry,...readDiagnostics()].slice(0,200);
 try{localStorage.setItem(DIAGNOSTIC_KEY,JSON.stringify(diagnosticMemory))}catch{}
}
function diagnosticRows(){return readDiagnostics().map(x=>`<div class="log"><small>${esc(x.time)} · ${esc(x.reference)}</small><p>${esc(x.action)} · ${esc(x.result)} · ${esc(x.stage)}</p><p>${esc(x.detail)}</p></div>`).join('')||'<p class="muted">暂无诊断记录</p>'}

</script><script data-module="trips.js">const TRIP_CATEGORIES = {
  DZ:'定制团', RJ:'定制入境团', DL:'代理团', DF:'单订房', DC:'单订交通',
  JP:'单机票', QZ:'单签证', BX:'单保险', COTA:'国内平台订单', OVERSEAS:'海外平台订单'
};
const TRIP_PLATFORMS = {XC:'携程', FZ:'飞猪', RB:'小红书'};
const TRIP_PRODUCTS = {HH:'花火大会', DL:'代理团', BCY:'包车定制', QZ:'签证', MP:'门票', QT:'其他单项'};
const TRIP_DEPARTMENTS = ['总经办','综合定制部','电商部','业务部','土耳其项目部'];
const TRIP_PROJECTS = ['新疆车队','新疆项目','赤兔项目','OTA车','广告推广','新媒体','海外地接社'];
const TRIP_PEOPLE = ['江婧婕','示例操作员','示例销售员'];
const tripField = id => document.getElementById(id);
const tripOptions = entries => '<option value="">请选择</option>'+entries.map(([key,label]) =>
  `<option value="${esc(key)}">${esc(label)}</option>`).join('');
const canCreateTrip = () => /^(操作|销售|主管|总经理|财务) \/ /.test(activeRole);
const tripReference = trip => trip?.uid || trip?.id;
const sameTrip = (a,b) => (a.tripUid && b.tripUid) ? a.tripUid === b.tripUid : a.trip === b.trip;
function destinationOptions(scope) {
  return scope === 'domestic' ? PROVINCES.map(x=>[x.name,x.name]) :
    scope === 'overseas' ? COUNTRIES.map(x=>[x.code,x.name_zh]) : [];
}
function chosenDestination() {
  const value = tripField('dest').value;
  if (tripField('destScope').value === 'domestic') {
    const p = PROVINCES.find(x=>x.name===value);
    if(p?.name==='海南'&&tripField('destCity')){const city=v35HainanCities().find(r=>r.id===tripField('destCity').value);return city?{key:'domestic:海南:'+city.city,code:city.code,name:'海南·'+city.city}:null;}
    return p && {key:'domestic:'+p.name, code:p.code, name:p.name};
  }
  const c = COUNTRIES.find(x=>x.code===value);
  return c && {key:'overseas:'+c.code, code:c.code, name:c.name_zh};
}
function updateDestinations() {
  const scope = tripField('destScope').value;
  const options = destinationOptions(scope);
  tripField('dest').innerHTML = tripOptions(options);
  if(tripField('destCity')){tripField('destCityLabel').hidden=true;tripField('destCity').disabled=true;tripField('destCity').required=false;}

  tripField('destNotice').textContent = scope && !options.length?'目的地字典不可用，请联系配置人员。':'';

function updateTripCategory() {
  const category = tripField('tripCategory').value;
  const overseas=category==='OVERSEAS';

  for (const [id,visible] of [['foreignSource',category==='RJ'||(category==='OVERSEAS'&&tripField('tripProduct').value==='RJT')],['tripPlatform',['COTA','OVERSEAS'].includes(category)],['tripProduct',['COTA','OVERSEAS'].includes(category)]]) {
    const field = tripField(id);
    field.closest('label').hidden = !visible;
    field.disabled = !visible;
    field.required = visible;
    if (!visible) field.value='';
  }
  updateTripPreview();
}
function tripBaseCode(category,destCode,date,platform,product) {
  if (!Object.hasOwn(TRIP_CATEGORIES,category) || !destCode || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  if (category==='OVERSEAS' && (!Object.hasOwn(OVERSEAS_PLATFORMS,platform)||!Object.hasOwn(OVERSEAS_PRODUCTS,product))) return '';
  if (category==='COTA' && (!Object.hasOwn(TRIP_PLATFORMS,platform)||!Object.hasOwn(TRIP_PRODUCTS,product))) return '';
  const components = category==='OVERSEAS'?[platform,product,destCode]:category==='COTA'?[category,platform,product]:[category,destCode];
  return [...components,date.replaceAll('-','')].join('-');
}
function nextTripCode(base,trips) {
  const used = new Set(trips.map(t=>t.id));
  if (!used.has(base)) return base;
  let index=1;
  while (used.has(base+'-'+String(index).padStart(2,'0'))) index++;
  return base+'-'+String(index).padStart(2,'0');
}
function currentTripBase() {
  return tripBaseCode(tripField('tripCategory').value,chosenDestination()?.code,tripField('date').value,tripField('tripPlatform').value,tripField('tripProduct').value);
}
function updateTripPreview() {
  const base=currentTripBase();
  tripField('tripPreview').textContent=base?nextTripCode(base,db.trips):'填完编号所需字段后显示';
}

async function tripAttachment(mode, action) {
  const dbHandle=await new Promise((resolve,reject)=>{
    let expired=false;
    const timer=setTimeout(()=>{expired=true;reject(new Error('成本附件存储连接超时，请关闭其他原型页面后重试'));},10000);
    const request=indexedDB.open('xingjie-trip-files',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('files');

async function downloadTripAttachment(uid) {

let tripSaving=false;
async function createTrip(event) {
  event.preventDefault();
  if(tripSaving)return;
  if(!canCreateTrip())return tripFeedback('当前角色无建团权限','权限校验');
  const invalid=[...document.getElementById('tripForm').elements].filter(el=>el.willValidate&&!el.validity.valid);
  if(invalid.length){
    const names=invalid.map(el=>el.getAttribute('aria-label')||el.closest('label')?.firstChild?.textContent?.trim()||el.id||'表单字段');
    tripFeedback('请补齐或修正：'+names.join('、'),'字段校验');
    const field=invalid[0];
    const visible=field.tagName==='SELECT'?field.previousElementSibling?.querySelector('input'):field;
    visible?.scrollIntoView({block:'center',behavior:'smooth'});visible?.focus();return;
  }
  diagnostic('建团保存','开始','校验');
  if (!costDraft.file || !costDraft.confirmed || !costDraft.items.length) return tripFeedback('请先上传、核对并确认成本明细','成本校验');
  const date=tripField('date').value;
  const destination=chosenDestination(), base=currentTripBase();
  if (!base) return tripFeedback('请补齐团号所需字段','团号校验');
  const category=tripField('tripCategory').value;
  const owner=tripField('tripOwner').value;
  const record={
    uid:typeof crypto.randomUUID==='function'?crypto.randomUUID():'trip-'+Date.now()+'-'+Math.random().toString(36).slice(2), dep:owner.slice(owner.indexOf(':')+1), owner, category,
    dest:destination.name, destinationId:destination.key, destinationScope:tripField('destScope').value,
    destinationCode:destination.code, departureDate:date,
    sales:tripField('tripSales').value, operatorA:tripField('tripOperatorA').value, operatorB:tripField('tripOperatorB').value,
    budget:costTotal(), file:costDraft.filename, costConfirmed:true, costVersion:1,
    costItems:structuredClone(costDraft.items), costSheet:costDraft.sheet, costConfirmedAt:new Date().toISOString()
  };
  record.createdBy=activeRole;record.createdAt=costTime();
  if (category==='RJ'||(category==='OVERSEAS'&&tripField('tripProduct').value==='RJT')) record.foreignSource=tripField('foreignSource').value;
  record.name=tripField('tripName')?.value.trim()||record.dest;
  record.archiveKind='single';
  if (['COTA','OVERSEAS'].includes(category)) {
    record.platform=tripField('tripPlatform').value;
    record.product=tripField('tripProduct').value;
  }
  const attachment=costDraft.file;
  const button=tripField('tripSave');
  tripSaving=true;
  button.disabled=true;
  button.textContent='保存中…';
  let storedFile=false;
  try {
    tripFeedback('正在保存成本附件，请稍候…','保存附件',false);
    diagnostic('建团保存','进行中','保存附件');
    await tripAttachment('readwrite',store=>store.put(attachment,record.uid));
    storedFile=true;
    const commit=()=>{
      const latest=JSON.parse(localStorage.getItem(KEY)) || db;
      record.id=nextTripCode(base,latest.trips);
      const updated={...latest,trips:[...latest.trips,record],
        logs:[{t:'建立团档案 '+record.id,time:new Date().toLocaleString('zh-CN')},...latest.logs]};
      localStorage.setItem(KEY,JSON.stringify(updated));
      db=updated;
    };
    if (navigator.locks) await navigator.locks.request(KEY+'-business-write',{signal:AbortSignal.timeout(10000)},commit);
    else commit();
  } catch (error) {
    diagnostic('建团保存','失败','本地保存',error.name+': '+error.message);
    if (storedFile) await tripAttachment('readwrite',store=>store.delete(record.uid)).catch(()=>{});
    tripFeedback('保存失败：'+error.message+'。填写内容已保留，可在「待办与记录」导出诊断日志。','本地保存',false);
    return;
  } finally {
    tripSaving=false;
    button.disabled=false;
    button.textContent='保存并生成团号';
  }
  costDraft=emptyCostDraft();
  render();
  if (page==='团档案') showTripCosts(record.id);
  diagnostic('建团保存','成功','完成',record.id);
  tripFeedback('建团成功 · 团号：'+record.id+' · 成本合计 ¥'+money(record.budget),'完成',false);
  document.getElementById('tripFeedback')?.scrollIntoView({block:'center',behavior:'smooth'});
}

function selectCostSheet(index){costDraft.sheetIndex=+index;let sheet=costDraft.sheets[index];costDraft.sheet=sheet?.name||'';costDraft.rows=sheet?.rows||[];costDraft.items=[];costDraft.confirmed=false;costDraft.header=Math.max(0,costDraft.rows.findIndex(r=>r.cells.some(v=>/项目|明细|服务内容/.test(v))&&r.cells.some(v=>/合计|总额|金额|价格|total/i.test(v))));const section = groundCostSection(costDraft.rows);

function groundCostSection(rows) {
  const start = rows.findIndex(r => /^附\s*1\s*[:：]\s*地接明[细細]/.test(String(r.cells[1] || '').trim()));
  if (start < 0) return null;
  const totalIndex = rows.findIndex((r, i) => i > start && /^行程[費费]用[總总][額额]/.test(String(r.cells[1] || '').trim()));
  const nextSection=rows.findIndex((r,i)=>i>start&&/^附\s*[2-9]/.test(String(r.cells[1]||'').trim()));
  const end=totalIndex>=0?totalIndex:nextSection>=0?nextSection:rows.length;
  const header = rows.findIndex((r, i) => i > start && i < end && /[項项]目/.test(r.cells[1]) && /[價价]格|金[額额]/.test(r.cells[6]));
  return header < 0 ? null : {header, end, total: totalIndex>=0?parseAmount(rows[totalIndex].cells[6]):undefined};
}
function setupMapping(){
if (costDraft.ground) {

  costDraft.mapping = {category:1, name:2, amount:6};
  return;
}
let cells=costDraft.rows[costDraft.header]?.cells||[],find=re=>cells.findIndex(v=>re.test(v));costDraft.mapping={category:find(/分类|类别|project/i),name:find(/明细|服务内容|项目名称|费用名称/),amount:find(/采购金额|成本金额|成本合计|total|金额|合计|总价/i)};if(costDraft.mapping.name<0){let idx=find(/项目/);costDraft.mapping.name=idx>=0?idx:0}if(costDraft.mapping.category===costDraft.mapping.name)costDraft.mapping.name++;costDraft.mapping.unit=find(/单价/);costDraft.mapping.qty=find(/数量|间\/位/);costDraft.mapping.times=find(/夜\/次|天数|day\/time/i)}

function parseAmount(v){if(typeof v==='number')return v;let t=String(v??'').trim().replace(/[,，￥¥\s]/g,'').replace(/元$/,'');return /^-?\d+(\.\d+)?$/.test(t)?Number(t):NaN}

function paymentValidate(d,data){
 const errors=[],required=(k,label)=>{if(!String(d[k]??'').trim())errors.push('请填写'+label);};
 if(!PAYMENT_TYPES.includes(d.type))errors.push('请选择有效付款类型');
 for(const [k,l] of [['company','公司主体'],['owner','部门／项目'],['fee','费用类别'],['note','用途'],['due','期望付款日期']])required(k,l);
 if(!OWNER_ENTRIES.some(([k])=>k===d.owner))errors.push('请选择有效部门／项目');
 if(!Number.isFinite(+d.amount)||+d.amount<=0)errors.push('付款金额须大于0');
 if(!['CNY','USD','EUR','JPY','HKD'].includes(d.currency))errors.push('请选择有效币种');
 if(d.currency!=='CNY'&&(!Number.isFinite(+d.rate)||+d.rate<=0))errors.push('请填写有效折算汇率');
 if(!d.demoBasis&&!d.basisName)errors.push('请上传付款依据或使用演示依据');
 const fee=d.fee.split('|').at(-1),transfer=d.type==='资金往来'&&fee==='内部资金调拨';
 if(!transfer)for(const [k,l] of [['payee','收款对象'],['channel','收款渠道'],['recipient','收款信息']])required(k,l);
 if(d.type==='业务付款'){
  if(!PAYMENT_BUSINESSES[d.business])errors.push('请选择业务类别');
  const t=costTrip(data,d.tripRef);if(!t)errors.push('请关联业务档案');
  else{
   if(!payArchiveMatches(t,d))errors.push('关联档案与当前业务类别、平台或月份不一致');
   if(!costReviewer(t))errors.push('该归属的业务审核主管尚未配置，请联系配置人员；系统不会猜测审批人');
   if(['DZ','RJ'].includes(d.business)&&fee!=='客户退款'&&!t.costConfirmed)errors.push('定制业务须先完整建档并确认首次成本单');
  }
  if(['COTA','OVERSEAS'].includes(d.business)){const platforms=d.business==='OVERSEAS'?OVERSEAS_PLATFORMS:TRIP_PLATFORMS,products=d.business==='OVERSEAS'?OVERSEAS_PRODUCTS:TRIP_PRODUCTS;if(!platforms[d.platform]||!products[d.product])errors.push('请选择有效平台与业务项目');required('orderNo','平台订单号');}
  if(d.business==='OVERSEAS'&&!/^\d{4}-(0[1-9]|1[0-2])$/.test(d.month))errors.push('请由操作人员填写有效所属月份');
  if(!BUSINESS_FEES.includes(fee))errors.push('请选择有效业务费用类别');
  if(fee==='客户退款'){
   required('originalRef','原收款编号');required('refundReason','退款原因');
   if(!Number.isFinite(+d.originalAmount)||+d.originalAmount<=0)errors.push('请填写原收款金额');
   const used=data.apps.filter(a=>a.schema===3&&a.paymentType==='业务付款'&&a.fee==='客户退款'&&!a.special&&a.tripUid===t?.uid&&a.originalRef===d.originalRef&&a.creatorDraftId!==d.draftId).reduce((sum,a)=>sum+(a.amountCNY??a.amount),0);
   if(used+(+d.amount)*(d.currency==='CNY'?1:+d.rate)>+d.originalAmount)errors.push('本次及历史有效退款超过填报的原收款金额，请核对');
  }
  if(d.advance==='是'&&fee!=='客户退款')required('cancel','最晚取消时间');
 }else{
  required('period','所属月份／期间');
  if(d.type==='管销付款'){const [g,c]=d.fee.split('|');if(!PAYMENT_GROUPS[g]?.includes(c))errors.push('请选择有效费用类别');}
  if(d.type==='资金往来'){
   if(!TRANSFER_FEES.includes(fee))errors.push('请选择有效往来类别');
   if(transfer){required('sourceAccount','转出账户');required('targetAccount','转入账户');if(d.sourceAccount===d.targetAccount)errors.push('转入与转出账户不能相同');}
   if(fee==='归还借款本金')required('originalRef','原借款依据');
   if(['借出款','平台保证金','押金及其他保证金'].includes(fee)){required('returnDate','预计收回日期');required('returnTerms','归还／退还条件');}
  }
  if(d.type==='员工薪酬'){
   if(!paymentCanSensitive())errors.push('当前角色无薪酬提报权限，请使用财务角色');
   if(!PAYROLL_FEES.includes(fee))errors.push('请选择有效薪酬项目');
   required('staff','员工或薪酬批次');required('payrollDepartment','核算归属');
   if(['社会保险费','住房公积金'].includes(fee)){
    if(d.unitShare===''||d.personalShare===''||!Number.isFinite(+d.unitShare)||!Number.isFinite(+d.personalShare)||+d.unitShare<0||+d.personalShare<0||payCents(+d.unitShare + +d.personalShare)!==payCents(d.amount))errors.push('单位承担＋个人代扣须等于本次缴纳金额');
   }
   if(fee==='业务提成'){required('originalRef','提成核算档案号');if(!data.trips.some(t=>t.id===d.originalRef||t.uid===d.originalRef))errors.push('提成须关联已有业务或月度档案');}
  }
  if(d.type==='税费缴纳'&&!TAX_FEES.includes(fee))errors.push('请选择有效税种');
 }
 return errors;
}
async function savePaymentDraft(){

 try{
  if(paymentBasis){const key='payment:'+paymentDraft.draftId;await tripAttachment('readwrite',s=>s.put(paymentBasis,key));paymentDraft.attachmentKey=key;}
  const draft=costClone(paymentDraft);draft.creator=activeRole;draft.updatedAt=costTime();
  await costMutate(data=>{payMigrate(data);const old=data.paymentDrafts.find(x=>x.draftId===draft.draftId);if(old&&old.creator!==activeRole)throw Error('无草稿权限');data.paymentDrafts=data.paymentDrafts.filter(x=>x.draftId!==draft.draftId);data.paymentDrafts.push(draft);costAudit(data,'保存付款草稿 '+draft.draftId);});toast('草稿已保存');render();
 }catch(e){toast('保存失败：'+e.message);}finally{paymentBusy=false;}

const priorCostCheck=checkPayment;
checkPayment=function(a,data=db){
 if(a.schema!==3)return priorCostCheck(a,data);
 if(paymentIsBusiness(a)&&a.fee!=='客户退款')return priorCostCheck({...a,amount:a.amountCNY??a.amount},data);
 const messages=a.fee==='客户退款'?['客户退款按原收款和历史退款核对，不作为新增团采购成本。','原收款依据及退款金额须财务复核。']:a.paymentType==='员工薪酬'?['薪酬按项目、人员及所属期核对；实际支付不重复确认人工费用。']:a.paymentType==='税费缴纳'?['按税种、纳税主体及所属期缴纳；缴纳不自动增加当期费用。']:a.paymentType==='资金往来'?['按往来性质核对；本金、保证金及内部调拨不作为新增经营费用。']:['非团费用按部门、用途及所属期间核对，不要求团号。'];
 return {risk:false,messages,version:null,source:'分类规则',time:new Date().toISOString(),engine:'付款分类核对'};
};
// Currency snapshots and non-procurement payments never occupy procurement cost lines.
costLineUsage=function(data,ref,lineId,excludeId){return data.apps.filter(a=>a.id!==excludeId&&!a.special&&(a.tripUid===ref||a.trip===ref||tripReference(costTrip(data,a.tripUid||a.trip))===ref)&&a.costId===lineId&&(a.schema!==3||(a.paymentType==='业务付款'&&a.fee!=='客户退款'))).reduce((s,a)=>s+payCents(a.amountCNY??a.amount),0)/100;};
const priorSubmit=submitApp;
submitApp=async function(event){
 if(!payRead('paymentForm'))return priorSubmit(event);
 event.preventDefault();if(paymentBusy)return;
 const errors=paymentValidate(paymentDraft,db);if(errors.length)return payError(errors);
 const d=costClone(paymentDraft),actor=activeRole;paymentBusy=true;
 try{
  if(paymentBasis&&!d.attachmentKey){d.attachmentKey='payment:'+d.draftId;await tripAttachment('readwrite',s=>s.put(paymentBasis,d.attachmentKey));}
  let resultId;
  await costMutate(data=>{
   payMigrate(data);if(!paymentCanCreate()||actor!==activeRole)throw Error('角色已变化，请重新核对');
   const dup=data.apps.find(a=>a.creatorDraftId===d.draftId);if(dup){resultId=dup.id;return;}
   const invalid=paymentValidate(d,data);if(invalid.length)throw Error(invalid.join('；'));
   const t=paymentIsBusiness(d)?costTrip(data,d.tripRef):null,fee=d.fee.split('|').at(-1),id='FK-'+costUid();resultId=id;
   const a={...d,id,schema:3,creatorDraftId:d.draftId,paymentType:d.type,fee,feeGroup:d.fee.includes('|')?d.fee.split('|')[0]:'',trip:t?.id||'非团事项',tripUid:t?.uid||null,amount:+d.amount,amountCNY:d.currency==='CNY'?+d.amount:null,rate:null,fxPolicy:'actual-v36',vendor:d.vendor||'未关联供应商',basis:d.demoBasis?'演示依据（虚构）':d.basisName,creator:actor,stage:paymentIsBusiness(d)?0:1,history:[costTime()+' · '+actor+' 提交 '+d.type],reviewer:t?costReviewer(t):null};
   if(t&&fee!=='客户退款'){paymentSnapshot(data,t,a);a.costName=(d.costAllocations?.length?d.costAllocations.map(r=>t.costItems?.find(x=>x.id===r.costId)?.name||'新增／待审成本').join('；'):t.costItems?.find(x=>x.id===d.costId)?.name)||'新增／未匹配成本';}else a.check=checkPayment(a,data);
   if(t&&d.orderNo){
    const scope=t.archiveKind==='monthly'?[t.owner,t.platform,t.product]:[t.owner,t.platform];
    const key=JSON.stringify([...scope,d.orderNo]),order=data.businessOrders.find(x=>x.key===key);
    if(order&&order.tripRef!==tripReference(t))throw Error('该订单已关联其他档案／月份，请核对原归属，勿重复建档');
    if(!order)data.businessOrders.push({id:costUid(),key,orderNo:d.orderNo,tripRef:tripReference(t),month:t.month||'',platform:d.platform,createdBy:actor});
   }
   data.apps.push(a);data.paymentDrafts=data.paymentDrafts.filter(x=>x.draftId!==d.draftId);data.todos.unshift(id+' 待'+statuses[a.stage]+'（模拟通知）');costAudit(data,'提交 '+d.type+' '+id+' '+fee);
  });
  selected=resultId;paymentDraft=payNew();paymentBasis=null;go('审批与付款');toast('提交成功 · '+resultId);
 }catch(e){payError([e.message]);diagnostic('付款提报','失败','提交',e.message);}finally{paymentBusy=false;}
};

 const fee=d.fee.split('|').at(-1),transfer=d.type==='资金往来'&&fee==='内部资金调拨',legacy={...d,due:'not-applicable',company:d.company||'选填',recipient:'由收款方式校验',channel:d.channel||'方式待选',payee:d.payee||'由条件字段校验',month:'not-applicable'};

 let errors;
 if(d.type==='业务付款'&&d.business==='OVERSEAS'){

function settleSummary(){const el=payRead('settleTotals');if(!el)return;const t=settlementTotals(settlementDraft);el.innerHTML=`<b>已选 ${Object.keys(settlementDraft.selected).length} 个团</b> · 归属金额 ${money(t.gross)} − 平台扣款 ${money(t.deductions)} − 实收 ${money(t.net)} ＝ 差额 <b>${money(t.difference)}</b><p class="note">金额均为本次结算币种。此处只做结算勾稽，不自动确认会计收入或计算提成。</p>`;}

function settlementValidate(d,data,confirm=false){
 const errors=[];if(!OWNER_ENTRIES.some(([v])=>v===d.owner)||!OVERSEAS_PLATFORMS[d.platform]||d.product!=='RJT'||!/^\d{4}-(0[1-9]|1[0-2])$/.test(d.month))errors.push('请选择归属、海外平台、入境团项目和结算所属月份');
 if(!d.reference.trim())errors.push('请填写平台结算单／收款核对编号');
 if(!['CNY','USD','EUR','JPY','HKD'].includes(d.currency))errors.push('请选择有效结算币种');
 const old=data.settlements.find(x=>x.id===d.id);if(old?.status==='locked')errors.push('该记录已锁定，须走调整流程，不能直接修改');

 if(confirm){
  if(!d.receivedDate)errors.push('请填写实际收款日期');
  if(!Number.isFinite(+d.net)||+d.net<=0||!Number.isFinite(+d.deductions)||+d.deductions<0)errors.push('实收须大于0，扣款合计不可为负数');
  if(!Object.keys(d.selected).length)errors.push('请点选本次结算收入对应的团档');
  const candidates=new Set(settlementCandidate(data,d).map(tripReference));
  for(const [ref,amount]of Object.entries(d.selected))if(!candidates.has(ref)||amount===''||!Number.isFinite(+amount)||+amount<=0)errors.push('请核对所选团档范围，并为每个团填写正数归属金额');
  if(settlementTotals(d).difference!==0)errors.push('归属金额减扣款须等于实收，请核对平台结算单');
  if(+d.deductions>0&&!d.reason.trim())errors.push('存在平台扣款时请说明佣金／手续费／退款等构成');
  if(data.settlements.some(x=>x.id!==d.id&&['confirmed','locked'].includes(x.status)&&x.owner===d.owner&&x.platform===d.platform&&x.reference.trim()===d.reference.trim()))errors.push('该平台结算编号已有已确认记录，请勿重复计入');
 }
 return [...new Set(errors)];
}

 ${d.type==='客户预存款'?rcSelectField('customerId','客户 *',db.receiptCustomers.map(c=>[c.id,c.name]))+rcSelectField('walletId','客户预存钱包 *',db.customerWallets.filter(w=>w.customerId===d.customerId).map(w=>[w.id,w.name+' · '+w.currency]))+`<div class="wide actions"><button type="button" class="alt" onclick="receiptWalletEditor=!receiptWalletEditor;receiptWalletNotice='';render()">新建客户钱包</button><small class="note">仅客户预存款需要钱包；先建立0余额档案，财务确认充值后才增加余额。</small></div>${receiptWalletEditor?rcWalletEditorFields(true):''}`:''}
 <section class="wide receipt-section"><h3>到账凭证图片 *</h3><label>上传图片附件<input id="r-images" type="file" multiple accept="image/png,image/jpeg,image/webp" onchange="rcChooseFiles(this.files)"></label><p class="note">原型暂定PNG／JPEG／WebP，单张10MB；生产上限待确认。当前未接银行流水导入，请上传图片。</p><button class="alt" type="button" onclick="rcDemoImage()">生成虚构演示凭证（仅测试）</button><div class="receipt-images">${d.attachments.map((a,i)=>`<div><button type="button" class="image-button" onclick="rcViewImage('${a.key}',${esc(JSON.stringify(a.name))})"><img id="preview-${a.key}" alt="${esc(a.name)}"><span>${esc(a.name)}</span></button><button type="button" class="alt" onclick="rcRemoveImage(${i})">移除图片</button></div>`).join('')}</div><div id="r-image-view"></div></section>

async function rcSave(e,action){e?.preventDefault();if(receiptBusy||receiptUploadBusy)return toast('正在处理，请稍候');receiptBusy=true;try{if(action!=='draft')for(const a of receiptDraft.attachments)if(!await tripAttachment('readonly',s=>s.get(a.key)))throw Error('到账凭证缺失，请重新上传');const d=costClone(receiptDraft);let id;await costMutate(data=>{id=rcCommit(data,d,action);});receiptSelected=id;receiptMode='detail';rcReleaseUrls();render();toast(action==='draft'?'收款草稿已保存':action==='correct'?'收款已更正，历史已保留':rcFinance()?'确认到账成功':'已提交，等待财务确认');}catch(e){rcError(e);}finally{receiptBusy=false;}}
function rcError(e){const id='RC-ERR-'+Date.now();const el=payRead('receiptError');if(el)el.innerHTML='<p class="banner risk">'+esc(e.message)+'<small>错误标识 '+id+'；请修正后重试，或重新打开记录。</small></p>';toast(e.message);if(typeof diagnostic==='function')diagnostic('收款操作','失败','收款登记',id+' · '+e.message);}
async function rcAction(id,version,action){if(receiptBusy)return;receiptBusy=true;try{const reason=payVal('r-action-reason');if(action==='confirm'){const r=db.receipts.find(r=>r.id===id);for(const a of r?.attachments||[])if(!await tripAttachment('readonly',s=>s.get(a.key)))throw Error('到账凭证缺失，请退回重新上传');}await costMutate(data=>rcAct(data,id,version,action,reason));render();toast({confirm:'确认到账成功',return:'已退回修改',cancel:'已撤销并回退对应影响'}[action]);}catch(e){rcError(e);}finally{receiptBusy=false;}}
async function rcDeleteDraft(id,version){try{await costMutate(data=>{rcMigrate(data);const r=data.receipts.find(r=>r.id===id);if(!r||r.status!=='draft'||r.creator!==activeRole||r.version!==version)throw Error('草稿状态已变化或无删除权限');data.receipts=data.receipts.filter(r=>r.id!==id);costAudit(data,id+' 删除草稿');});rcList();}catch(e){rcError(e);}}
function rcDetail(r){if(!r||!rcCanRead(r))return '<div class="panel">请选择有权限查看的收款记录。</div>';const risks=rcRisks(db,r),editable=['draft','returned'].includes(r.status)&&(r.creator===activeRole||r.handler===activeRole);
 return `<div class="panel"><div class="panelhead"><div><h3>${esc(r.id)}</h3><span class="tag">${RECEIPT_STATES[r.status]}</span> <span class="tag">${rcAllocationState(r)}</span></div><button class="alt" onclick="rcList()">返回收款记录</button></div><p><b>${esc(r.type)} · ${esc(r.currency||rcCurrency(r,db))} ${money(r.amount||0)}</b></p><p>付款方：${esc(r.payer)} · 实际到账：${esc(r.date)} · 归属：${esc(r.owner||'见分配明细')}</p><p>收款账户：${esc(r.accountName)} · 币种：${esc(r.currency)}</p>${r.platform?'<p>平台：'+esc(({...TRIP_PLATFORMS,...OVERSEAS_PLATFORMS})[r.platform])+' · 业务项目：'+esc((OVERSEAS_PLATFORMS[r.platform]?OVERSEAS_PRODUCTS:TRIP_PRODUCTS)[r.product])+' · 结算所属月份 '+esc(r.month)+'</p>':''}${r.transferType?'<p>往来类别：'+esc(r.transferType)+' · 对象：'+esc(r.counterparty)+' · 依据／原记录：'+esc(r.originalRef)+'</p>':''}${r.walletId&&(rcFinance()||activeRole.startsWith('总经理 / '))?'<p>客户钱包：'+esc(db.customerWallets.find(w=>w.id===r.walletId)?.name)+'</p>':''}<p>备注／退款原因：${esc(r.note||r.refundReason||'—')}</p><p class="note">提报：${esc(r.creator)} · ${esc(r.createdAt)}<br>财务确认：${esc(r.confirmedBy||'尚未确认')} · ${esc(r.confirmedAt||'')}</p>
 ${['客户团款','平台结算款','供应商退款'].includes(r.type)?'<div class="cost-overview">'+rcSummary(r)+'</div><table><tr><th>关联对象</th><th>本次分配</th><th>阶段／归属</th></tr>'+r.allocations.map(a=>'<tr><td>'+esc(a.label||a.ref)+'</td><td>'+money(a.amount)+'</td><td>'+esc((a.stage||'')+' '+(a.owner||''))+'</td></tr>').join('')+'</table>':''}
 <h3>到账凭证</h3><div class="actions">${r.attachments.map(a=>`<button class="alt" onclick="rcViewImage('${a.key}',${esc(JSON.stringify(a.name))})">查看 ${esc(a.name)}</button>`).join('')||'<span class="note">草稿尚未上传</span>'}</div><div id="r-image-view"></div>
 ${risks.map(x=>'<p class="banner">'+esc(x)+'</p>').join('')}${r.reviewNote?'<p>财务核查说明：'+esc(r.reviewNote)+'</p>':''}${r.commissionReview?.length?'<p class="banner">需要复核提成批次：'+esc(r.commissionReview.join('、'))+'</p>':''}
 <div id="receiptError" role="alert"></div>${rcFinance()&&['pending','confirmed'].includes(r.status)?'<label>处理原因／风险核查说明<textarea id="r-action-reason" placeholder="退回、撤销，或风险确认时必填"></textarea></label>':''}<div class="actions">
 ${editable?`<button onclick="rcEdit('${r.id}')">${r.status==='returned'?'修改后重提':'继续填写'}</button>`:''}${r.status==='draft'&&r.creator===activeRole?`<button class="alt" onclick="rcDeleteDraft('${r.id}',${r.version})">删除草稿</button>`:''}
 ${rcFinance()&&r.status==='pending'?`<button onclick="rcAction('${r.id}',${r.version},'confirm')">确认到账</button><button class="alt" onclick="rcAction('${r.id}',${r.version},'return')">退回修改</button>`:''}
 ${rcFinance()&&r.status==='confirmed'?`<button onclick="rcEdit('${r.id}','correct')">${['客户团款','平台结算款'].includes(r.type)?'补充分配／更正':'更正收款'}</button><button class="alt" onclick="rcAction('${r.id}',${r.version},'cancel')">撤销收款</button>`:''}</div>
 <details><summary>操作轨迹与前后记录（${r.history.length}）</summary>${r.history.map(h=>'<div class="receipt-history"><b>'+esc(h.action)+'</b> · '+esc(h.actor)+' · '+esc(h.time)+'<p>'+esc(h.reason||'')+'</p>'+(h.before?'<details><summary>查看操作前快照</summary><pre>'+esc(JSON.stringify(h.before,null,2))+'</pre></details>':'')+'</div>').join('')}</details><p class="note">到账与分配已分别记录。确认不等于生成提成；图片和数据仅在当前浏览器保存。</p></div>`;
}
function rcRecords(){const rows=db.receipts.filter(rcCanRead).filter(r=>!receiptFilter||[r.id,r.payer,r.type,RECEIPT_STATES[r.status],rcAllocationState(r)].join(' ').includes(receiptFilter));
 return `<div class="panel"><div class="panelhead"><h3>收款记录</h3><span class="tag">${rows.length} 笔</span></div><label>搜索收款单／付款方／状态<input id="r-filter" value="${esc(receiptFilter)}" placeholder="输入关键字后按回车" onkeydown="if(event.key==='Enter'){receiptFilter=this.value;render()}"></label>${!rows.length?'<p class="note">暂无匹配记录。可新建收款，或切换财务角色核实到账。</p>':'<div class="cost-table"><table><tr><th>收款单／类型</th><th>到账日期／付款方</th><th>账户／金额</th><th>到账与分配状态</th><th></th></tr>'+rows.map(r=>`<tr><td>${esc(r.id)}<small>${esc(r.type)}</small></td><td>${esc(r.date)}<small>${esc(r.payer)}</small></td><td>${esc(r.accountName||'未选账户')}<small>${esc(r.currency||'')} ${money(r.amount||0)}</small></td><td><span class="tag">${RECEIPT_STATES[r.status]}</span><small>${rcAllocationState(r)}${['客户团款','平台结算款','供应商退款'].includes(r.type)?' · 待分配 '+money(rcRemaining(r)):''}</small></td><td><button class="alt" onclick="rcSelect('${r.id}')">查看收款</button></td></tr>`).join('')+'</table></div>'}</div>`;
}
function rcAccountsPanel(){if(!rcFinance())return '';return `<div class="cards">${db.receiptAccounts.map(a=>`<div class="card"><span class="muted">${esc(a.name)}</span><div class="num">${money(rcBalance(db,a.id))}</div><small>${esc(a.company+' · '+a.currency)}</small></div>`).join('')}</div><div class="panel"><h3>团收款与供应商退款汇总</h3><div class="cost-table"><table><tr><th>团号</th><th>已确认团款／抵扣</th><th>已付（人民币）</th><th>供应商已退</th><th>净支出</th></tr>${db.trips.map(t=>{const ref=tripReference(t),paid=rcPaid(db).filter(p=>p.application.tripUid===ref||p.application.trip===t.id),total=paid.reduce((n,p)=>n+p.amount,0),refund=paid.reduce((n,p)=>n+rcRefundTotal(db,p.id),0);return '<tr><td>'+esc(t.id)+'</td><td>'+money(rcTripReceived(db,ref))+'</td><td>'+money(total)+'</td><td>'+money(refund)+'</td><td>'+money(total-refund)+'</td></tr>';}).join('')}</table></div><p class="note">团款为业务管理口径，不是会计收入确认。供应商退款不改预算。尚未接生产提成批次；后续更正会标记受影响批次。</p></div>`;}
function rcWalletPage(){if(!rcCreate())return '<div class="panel">请切换操作、销售或财务角色。</div>';return `<div class="panel"><h3>客户与预存钱包</h3><p class="note">创建空钱包不产生资金；充值由收款确认增加，抵扣由财务操作，不新增实际到账。</p>${rcWalletEditorFields(false)}<table><tr><th>钱包</th><th>客户／币种</th><th>余额</th></tr>${db.customerWallets.map(w=>'<tr><td>'+esc(w.name)+'</td><td>'+esc(db.receiptCustomers.find(c=>c.id===w.customerId)?.name)+' · '+esc(w.currency)+'</td><td>'+money(rcWalletBalance(db,w.id))+'</td></tr>').join('')}</table></div>
 ${rcFinance()?`<div class="panel"><h3>预存抵扣团款</h3><form class="grid" onsubmit="rcDoOffset(event)"><label>客户钱包<select id="w-wallet">${rcOptions(db.customerWallets.map(w=>[w.id,w.name+' · 可用 '+money(rcWalletBalance(db,w.id))]),'')}</select></label><label>已有团号<select id="w-trip">${rcOptions(db.trips.filter(t=>t.archiveKind!=='monthly').map(t=>[tripReference(t),rcTripLabel(t)]),'')}</select></label><label>抵扣金额<input id="w-amount" type="number" min="0.01" step="0.01"></label><label>抵扣说明<input id="w-reason"></label><div class="actions"><button>确认抵扣团款</button></div></form><h3>抵扣轨迹</h3><label>撤销抵扣原因<input id="w-reverse-reason"></label><table><tr><th>抵扣单／团号</th><th>金额／状态</th><th></th></tr>${db.receiptOffsets.map(o=>`<tr><td>${esc(o.id)}<small>${esc(costTrip(db,o.tripRef)?.id||o.tripRef)} · ${esc(o.at)}</small></td><td>${money(o.amount)} · ${o.status==='active'?'已抵扣':'已撤销抵扣'}</td><td>${o.status==='active'?`<button class="alt" onclick="rcUndoOffset('${o.id}')">撤销抵扣</button>`:esc(o.reversal?.reason||'')}</td></tr>`).join('')}</table></div>`:''}<div class="panel" id="receiptError" role="alert"></div>`;}
function rcWalletEditorFields(inline){return `<section class="wide wallet-create-section"><h3>${inline?'在此建立客户预存钱包':'建立客户预存钱包'}</h3><p class="note">选择一个已有客户，或填写新客户名称。已有同币种钱包会直接复用。创建本身不表示收到款项。</p>${receiptWalletNotice?'<p role="status" class="banner">'+esc(receiptWalletNotice)+'</p>':''}<div class="grid"><label>选择已有客户<select id="w-customer">${rcOptions(db.receiptCustomers.map(c=>[c.id,c.name]),inline?receiptDraft.customerId:'','请选择客户（或填写右侧新客户）')}</select></label><label>或填写新客户名称<input id="w-new-customer" placeholder="例如：张先生"></label><label>钱包币种<input id="w-currency" value="CNY" disabled><small class="note">当前原型演示人民币钱包</small></label><div class="actions"><button id="w-create" type="button" onclick="rcCreateWallet(event,${inline})">${inline?'建立并选用钱包':'建立／查找客户钱包'}</button>${inline?'<button class="alt" type="button" onclick="receiptWalletEditor=false;render()">取消建钱包</button>':''}</div><div id="walletCreateError" class="wide" role="alert"></div></div></section>`;}
function rcEnsureWallet(data,customerId,name,currency='CNY'){
 rcMigrate(data);if(!rcCreate())throw Error('当前角色无钱包维护权限');name=String(name||'').trim();if(!name&&!customerId)throw Error('请先选择已有客户，或填写新客户名称');if(name&&customerId)throw Error('已有客户和新客户名称只需填写一项，请清空另一项');if(currency!=='CNY')throw Error('当前原型仅支持人民币钱包');
 let c=name?data.receiptCustomers.find(c=>c.name===name):data.receiptCustomers.find(c=>c.id===customerId);if(!c&&name){c={id:'KH-'+costUid(),name};data.receiptCustomers.push(c);}if(!c)throw Error('客户不存在，请重新选择');
 const existing=data.customerWallets.find(w=>w.customerId===c.id&&w.currency===currency);if(existing)return {walletId:existing.id,customerId:c.id,reused:true,name:existing.name};
 const w={id:'YC-'+costUid(),name:c.name+' · 预存钱包',customerId:c.id,currency,opening:0,balance:0};data.customerWallets.push(w);costAudit(data,'建立客户空钱包 '+c.name);return {walletId:w.id,customerId:c.id,reused:false,name:w.name};
}
async function rcCreateWallet(e,inline=false){e?.preventDefault();if(receiptWalletBusy)return;receiptWalletBusy=true;const btn=payRead('w-create');if(btn)btn.disabled=true;
 try{const customerId=payVal('w-customer'),name=payVal('w-new-customer'),currency=payVal('w-currency')||'CNY';let result;await costMutate(data=>{result=rcEnsureWallet(data,customerId,name,currency);});receiptWalletNotice=(result.reused?'已找到现有钱包：':'已建立0余额钱包：')+result.name;if(inline){receiptDraft.customerId=result.customerId;receiptDraft.walletId=result.walletId;receiptWalletEditor=false;}render();toast(inline?'钱包已选入本次预存申请，其他内容已保留':receiptWalletNotice);
 }catch(e){const el=payRead('walletCreateError');if(el){el.innerHTML='<p class="banner risk">'+esc(e.message)+'</p>';el.scrollIntoView({block:'nearest'});}else rcError(e);toast(e.message);}finally{receiptWalletBusy=false;if(btn?.isConnected)btn.disabled=false;}
}
async function rcDoOffset(e){e.preventDefault();if(receiptBusy)return;receiptBusy=true;try{await costMutate(data=>rcOffset(data,payVal('w-wallet'),payVal('w-trip'),payVal('w-amount'),payVal('w-reason')));render();toast('抵扣成功，账户无新增到账');}catch(e){rcError(e);}finally{receiptBusy=false;}}

const stDownloadPrior=downloadTripAttachment;
downloadTripAttachment=async function(key){try{const stored=await tripAttachment('readonly',s=>s.get(key));if(!stored)return toast('当前浏览器缺少该附件，请重新上传或在原浏览器查看');const file=stored.blob||stored,url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=stored.name||file.name||'附件';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){toast('附件读取失败：'+e.message);}};

function stPreviewAlloc(){const s=db.commissionSheets.find(s=>s.id===stDraft?.id);if(!s)return;stDraft.rows=stCalc(db,{...s,rows:stDraft.rows});stDraft.rows.forEach((r,i)=>{const el=payRead('st-row-'+i);if(el)el.textContent='¥'+money(r.amount);});const el=payRead('st-preview-total');if(el)el.textContent='预览分配合计 ¥'+money(stTotal(stDraft.rows));}

const stCostUsagePrior=costLineUsage;
costLineUsage=function(data,ref,lineId,excludeId){return data.apps.filter(a=>(a.tripUid===ref||a.trip===ref||tripReference(costTrip(data,a.tripUid||a.trip))===ref)&&a.costId===lineId&&a.id!==excludeId&&!a.special&&Number.isFinite(+a.amount)).reduce((n,a)=>n+(a.paymentClosed?stNet(data,a):payCents(a.amountCNY??a.amount)),0)/100;};

const reimbOriginalValidate=paymentValidate;

 if(t.completedAt&&bzFinance())html+=`<details><summary>更正业绩归属月份（保留历史）</summary><div class="grid">${bzText('bz-correct-month','更正归属月份',t.performanceMonth||'','month')}${bzNote('bz-month-reason','更正原因 *')}<div class="actions"><button onclick="bzRun(d=>bzChangeMonth(d,'${ref}',payVal('bz-correct-month'),payVal('bz-month-reason')))">确认月份更正</button></div></div></details>`;
 html+='</div>';
 if(approved)html+=`<div class="panel"><div class="panelhead"><h3>当前有效经营核定</h3><span class="tag">${approved.estimated?'含暂估成本':'已核定'} · ${esc(approved.month)}</span></div><div class="bz-kpis bz-three">${bzCard('核定经营收入','¥'+money(approved.incomeCNY))}${bzCard('核定实际成本','¥'+money(approved.costCNY))}${bzCard('账面利润','¥'+money(approved.incomeCNY-approved.costCNY))}</div><p class="bz-hint">${esc(approved.currency)} · 汇率快照 ${esc(approved.rate)} · 核定人 ${esc(approved.approvedBy)} · ${esc(approved.approvedAt)}</p>${pending?'<p class="bz-alert">后续修改审核中，当前有效数据继续用于看板。</p>':''}</div>`;
 if(pending){html+=`<div class="panel"><div class="panelhead"><h3>核定申请 ${esc(pending.id)}</h3><span class="tag">${BZ_STATES[pending.status]}</span></div><p>最终应收 ${money(pending.receivable)} · 实际成本 ${money(pending.cost)} · ${esc(pending.month)}</p><p>操作说明：${esc(pending.reason)}</p><p class="bz-hint">对比有效预算 V${pending.budgetVersion}：${money(pending.budgetTotal)}。此核定不直接覆盖预算版本，预算调整仍走成本变更。</p>${bzTable(['实际成本明细','类别','金额'],pending.costRows.map(r=>[esc(r.name),esc(r.category),money(r.amount)]))}`;

function bzVisibleLogs(data,query=''){bzMigrate(data);const technical=activeRole.startsWith('配置管理员 / '),dep=bzUserDep(data),mine=data.biz.events.filter(e=>bzGM()||stFinance()||bzManager()&&e.dep===dep||e.actor===activeRole||!!costTrip(data,e.ref)&&bzCanTrip(data,costTrip(data,e.ref)));const logs=technical?[]:mine;const tokens=query.toLowerCase().split(/\s+/).filter(Boolean);return logs.filter(e=>!tokens.length||tokens.some(q=>JSON.stringify(e).toLowerCase().includes(q))).slice(0,80);}
function bzLogPage(){const rows=bzVisibleLogs(db,bzLogQuery);return `<div class="bz-header"><div><span class="bz-eyebrow">AUDIT & DIAGNOSTICS</span><h3>日志查询与诊断</h3><p>按当前角色查询业务轨迹；机器人接入入口预留</p></div><span class="tag">本地规则检索 · 未接AI</span></div><div class="panel"><form onsubmit="event.preventDefault();bzLogQuery=payVal('bz-log-search');render()" class="bz-search"><input id="bz-log-search" value="${esc(bzLogQuery)}" placeholder="输入团号、核定单号、错误编号或关键词"><button>查询日志</button></form><div class="bz-chat"><p>可以问：某团为什么还没进入经营看板？或直接输入操作编号。</p><label>问题<input id="bz-question" placeholder="例如：查一下刚才核定失败的原因"></label><button class="alt" onclick="bzDiagnose()">查询并解释（演示）</button><div id="bz-log-answer">${bzLogAnswer}</div></div></div><div class="panel"><h3>权限范围内的业务记录 · ${rows.length}条</h3>${rows.map(e=>'<div class="log"><small>'+esc(e.at+' · '+e.id)+'</small><p>'+esc(e.type+' / '+e.ref)+'</p><p>'+esc(e.text)+'</p><small>'+esc(e.actor)+'</small></div>').join('')||'<p class="bz-hint">没有匹配记录，不能据此判断操作成功或失败。</p>'}</div>${bzGM()||activeRole.startsWith('配置管理员 / ')?'<div class="panel"><h3>前端异常诊断（维护视图）</h3>'+readDiagnostics().slice(0,20).map(e=>'<div class="log">'+esc(e.reference+' · '+e.action+' · '+e.result+' · '+e.stage)+'<p>'+esc(String(e.detail||'').replace(/\b\d{12,}\b/g,'[已隐藏账号]'))+'</p></div>').join('')+'</div>':''}`;}
function bzDiagnose(){const q=payVal('bz-question').trim();const trips=db.trips.filter(t=>bzCanTrip(db,t)&&q.includes(t.id));if(trips.length){const t=trips[0],r=bzLatest(db,tripReference(t)),pending=db.biz.reviews.find(r=>r.tripRef===tripReference(t)&&['supervisor','finance'].includes(r.status));bzLogAnswer='<div class="bz-alert"><b>'+esc(t.id)+'</b><p>'+(!t.completedAt?'尚未标记团结束，未确定经营月份。':!r?'本团尚无生效经营核定，不能计入已核定金额。':'当前已核定，归属 '+esc(r.month)+'；若看不到，请核对筛选月份及权限。')+(pending?'当前还有 '+BZ_STATES[pending.status]+' 的申请。':'')+'</p><p class="bz-hint">依据：团档及核定状态，非模型猜测。</p></div>';}
 else{const rows=bzVisibleLogs(db,q);bzLogAnswer=rows.length?'<div class="bz-alert">找到 '+rows.length+' 条授权记录。最新依据：'+esc(rows[0].id+' / '+rows[0].text)+'</div>':'<div class="bz-alert">没有找到足够的授权记录，无法确定原因。请提供错误编号或团号；此演示不连接后台AI和生产日志库。</div>';}

</script><script data-module="supervisor.js">/* Department supervisor workspace, using the original business records. */

 if(r.group==='客户'){let x=data.receiptCustomers.find(x=>x.id===id);if(!x)data.receiptCustomers.push(x={id});Object.assign(x,{name:r.name,active:r.active});}
 if(r.group==='客户预存钱包'){let x=data.customerWallets.find(x=>x.id===id);if(!x)data.customerWallets.push(x={id,opening:0});Object.assign(x,{name:r.name,customerId:cfData(data).records.find(x=>x.id===r.customerId)?.sourceId||r.customerId,currency:r.currency,active:r.active});}
 if(r.group==='员工'){for(const role of r.roles){let p=data.biz.people.find(x=>x.name===r.name&&x.role===role);if(!p)data.biz.people.push(p={id:'EMP-'+costUid(),name:r.name,role});Object.assign(p,{dep:r.dep,active:r.active,projects:r.projects});if(['操作','销售'].includes(role)&&!data.staff.some(x=>x.id===p.id))data.staff.push({id:p.id,name:p.name,role});}for(const p of data.biz.people.filter(x=>x.name===r.name&&!r.roles.includes(x.role)))p.active=false;}
 if(r.group==='提成规则'&&r.active&&r.from<=stMonth())Object.assign(data.biz.defaults,{sales:+r.sales,operatorA:+r.operatorA,operatorB:+r.operatorB});
 if(r.group==='部门'&&r.manager){data.biz.supervisors[r.name]=r.manager;COST_SUPERVISORS[r.name]=r.manager;}

 if(['费用分类','平台','业务项目','目的地'].includes(r.group)){const group=r.group==='平台'?(r.scope==='海外'?'海外平台':'国内平台'):r.group;const key=group+'|'+r.code;let x=data.biz.dictionary.find(x=>x.key===key);if(!x)data.biz.dictionary.push(x={key});Object.assign(x,r,{group});bzApplyConfig(data);}
 if(r.group==='公司主体'&&r.active&&!COMPANY_OPTIONS.includes(r.name))COMPANY_OPTIONS.push(r.name);
}
function cfSubmit(data,r,reason,expected){stAssert(cfAllowed(),'请切换配置员维护');cfInit(data);stAssert(reason?.trim(),'请填写变更原因');const old=cfData(data).records.find(x=>x.id===r.id);stAssert((old?.rev||0)===expected,'此配置已更新，请刷新');cfValidate(data,r);stAssert(!cfData(data).changes.some(c=>c.record.id===r.id&&c.status==='pending'),'此项已有待确认修改');const before=old?costClone(old):null;if(cfConfirmRequired(r.group)){cfData(data).changes.unshift({id:'CC-'+costUid(),record:costClone(r),before,expected,reason,status:'pending',at:new Date().toISOString(),actor:activeRole});cfAudit(data,'提交待确认',r,before,r,reason);}else{cfApply(data,r);cfAudit(data,'已生效',r,before,r,reason);}}
function cfConfirm(data,id,approve,note){const c=cfData(data).changes.find(x=>x.id===id);stAssert(c?.status==='pending','此项已经处理');stAssert(cfAllowed(true,c.record.group),'当前身份没有确认权');stAssert(note?.trim(),'请填写确认或退回意见');stAssert((cfData(data).records.find(x=>x.id===c.record.id)?.rev||0)===c.expected,'配置已变化，请退回后重提');if(approve){cfValidate(data,c.record);cfApply(data,c.record);}Object.assign(c,{status:approve?'approved':'returned',confirmedBy:activeRole,note,confirmedAt:new Date().toISOString()});cfAudit(data,approve?'确认生效':'已退回',c.record,c.before,c.record,note);}

function cfLogPage(){const c=cfData(),source=cfLogTab==='配置记录'?[...c.logs,...db.biz.changes.map(x=>({id:x.id,at:x.at,actor:x.creator,group:BZ_CONFIG_NAMES[x.kind]||x.kind,type:x.status==='pending'?'待确认':x.status==='approved'?'已生效':'已退回',before:null,after:x.value,reason:x.reason}))]:cfLogTab==='业务操作记录'?[...db.biz.events,...db.logs.map(x=>({at:x.time,text:x.t,type:'业务轨迹'}))]:readDiagnostics(),rows=source.filter(l=>{const date=String(l.at||l.iso||l.time||'').slice(0,10),text=JSON.stringify(l);return(!cfLogFrom||date>=cfLogFrom)&&(!cfLogTo||date<=cfLogTo)&&(!cfLogActor||text.includes(cfLogActor))&&(!cfLogStatus||text.includes(cfLogStatus))&&(!cfLogRef||text.includes(cfLogRef));});return `<h3>操作日志</h3><div class="bz-tabs">${['配置记录','业务操作记录','异常记录'].map(t=>`<button class="${cfLogTab===t?'':'alt'}" onclick="cfLogTab=${emArg(t)};render()">${t}</button>`).join('')}</div><section class="panel"><form class="em-filters" onsubmit="event.preventDefault();cfLogFrom=payVal('cl-from');cfLogTo=payVal('cl-to');cfLogActor=payVal('cl-actor');cfLogStatus=payVal('cl-status');cfLogRef=payVal('cl-ref');render()">${bzText('cl-from','开始日期',cfLogFrom,'date')}${bzText('cl-to','结束日期',cfLogTo,'date')}${bzText('cl-actor','人员',cfLogActor)}${bzText('cl-status','状态／类型',cfLogStatus)}${bzText('cl-ref','团号／单号／错误编号',cfLogRef)}<button>查询</button></form><p>日志自动记录，仅可查询。机器人查询将在正式接入后提供。</p>${rows.map(l=>`<details><summary>${esc(l.at||l.time||'')} · ${esc(l.actor||'系统')} · ${esc(l.group||l.type||l.action||'异常')} · ${esc(l.type||l.result||'')}</summary><p>编号 ${esc(l.id||l.reference||'—')} · ${esc(l.ref||'')}</p><p>${esc(l.reason||l.text||l.detail||'')}</p>${l.before!==undefined?bzTable(['内容','修改前','修改后'],[['配置',esc(cfDisplay(l.before)),esc(cfDisplay(l.after))]]):''}</details>`).join('')||'<p class="em-empty">没有匹配记录</p>'}</section>${cfPending()}`;}

function fnTasks(data=db){const rows=data.apps.map(a=>fnPaymentTask(a,data));for(const r of data.receipts.filter(r=>r.status!=='draft')){const allocated=!['客户团款','平台结算款','供应商退款'].includes(r.type)||rcRemaining(r)===0;rows.push({kind:'receipt',id:r.id,key:'receipt:'+r.id,title:r.type+' · '+(r.payer||''),amount:+r.amount,currency:r.currency||'CNY',done:r.status==='cancelled'||r.status==='confirmed'&&allocated,action:r.status==='pending'||r.status==='confirmed'&&!allocated,status:r.status==='confirmed'&&!allocated?'已到账，待分配':RECEIPT_STATES[r.status],record:r,creator:r.creator,update:r.confirmedAt||r.createdAt});}
 for(const r of data.biz.reviews){rows.push({kind:'review',id:r.id,key:'review:'+r.id,title:(costTrip(data,r.tripRef)?.id||r.tripName||'团')+'经营核定',ref:r.tripRef,done:r.status==='approved',action:r.status==='finance',status:BZ_STATES[r.status]||r.status,record:r,trip:costTrip(data,r.tripRef),update:r.approvedAt||r.createdAt,creator:r.creator});}
 for(const s of data.employeeInvoices||[]){rows.push({kind:'invoice',id:s.id,key:'invoice:'+s.id,title:(costTrip(data,s.tripRef)?.id||'团')+'成本票核验',ref:s.tripRef,amount:s.amount,done:s.status==='matched',action:s.status==='pending',status:s.status==='matched'?'已核验匹配':s.status==='returned'?'已退回，待员工补充':'待财务核验',record:s,update:s.handledAt||s.at,creator:s.creator});}
 for(const s of data.commissionSheets){rows.push({kind:'commission',id:s.id,key:'commission:'+s.id,title:s.tripName+'提成结算',ref:s.tripRef,amount:stTotal(s.rows),done:s.status==='transferred',action:s.status==='approved',status:s.status==='approved'?'已确认，待转工资':s.status==='transferred'?'已转工资':suCommissionStatus(s),record:s,update:s.history?.at(-1)?.at,creator:s.reviewer});}
 for(const c of data.costChanges.filter(c=>c.status!=='draft'))rows.push({kind:'cost',id:c.id,key:'cost:'+c.id,title:(costTrip(data,c.tripRef)?.id||'团')+'成本变更',ref:c.tripRef,done:['approved','rejected','withdrawn'].includes(c.status),action:false,status:costChangeStatuses[c.status],record:c,creator:c.creator,update:c.updatedAt});
 for(const t of data.trips.filter(t=>t.archiveApproval)){const a=t.archiveApproval;rows.push({kind:'archive',id:tripReference(t),key:'archive:'+tripReference(t),title:t.id+'建档',ref:tripReference(t),done:['approved','rejected'].includes(a.status),action:false,status:{pending:'待主管审核',returned:'已退回，待修改',approved:'建档已通过',rejected:'建档已拒绝'}[a.status]||a.status,record:t});}
 for(const c of cfData().changes.filter(c=>cfAllowed(true,c.record.group)))rows.push({kind:'config',id:c.id,key:'config:'+c.id,title:c.record.group+' · '+(c.record.name||c.record.id),done:['approved','returned'].includes(c.status),action:c.status==='pending',status:c.status==='pending'?'待财务确认':c.status==='approved'?'配置已生效':'已退回，本次流程结束',record:c});
 for(const c of data.biz.changes.filter(c=>bzConfigCan(c.kind,true,c.value)))rows.push({kind:'legacyconfig',id:c.id,key:'legacyconfig:'+c.id,title:(BZ_CONFIG_NAMES[c.kind]||c.kind)+'配置确认',done:['approved','returned'].includes(c.status),action:c.status==='pending',status:BZ_STATES[c.status]||c.status,record:c});
 return rows.sort((a,b)=>Number(b.action)-Number(a.action)||emStamp(b.update)-emStamp(a.update)||a.key.localeCompare(b.key));}
function fnTag(kind){return emTag(kind,kind==='invoice'?'成本票核验':['config','legacyconfig'].includes(kind)?'配置确认':undefined);}
function fnTaskRow(t){return `<button class="em-task-row" onclick="fnOpenTask(${emArg(t.key)})"><span><span class="em-task-title">${esc(t.title)} ${fnTag(t.kind)}</span><small>${esc(t.id)}${t.ref?' · '+esc(costTrip(db,t.ref)?.id||''):''}</small></span><span class="em-task-state ${t.action?'em-attention':''}">${t.action?'待我处理 · ':''}${esc(t.status)}</span><span class="em-task-amount">${t.amount!==undefined?esc(t.currency&&t.currency!=='CNY'?t.currency+' ':'¥')+money(t.amount):''}</span><span class="em-link">查看</span></button>`;}
function fnHome(){const tasks=fnTasks(),actions=tasks.filter(t=>t.action&&!t.done),pending=db.apps.filter(a=>a.stage===3&&!a.special&&!a.paymentClosed),amount=pending.filter(a=>(a.currency||'CNY')==='CNY').reduce((n,a)=>n+stRemaining(db,a),0)/100,receipts=tasks.filter(t=>t.kind==='receipt'&&t.action),sheets=db.commissionSheets.filter(s=>s.month===fnMonth&&s.status!=='transferred'),shown=[...actions,...tasks.filter(t=>!t.done&&!t.action)].slice(0,5);return `<div class="em-page-heading"><div><p class="em-eyebrow">FINANCE WORKSPACE</p><h3>${esc(emName())}，欢迎回来。</h3><p>让每一笔收支，都有清晰的去向。</p></div><span class="em-month">${stMonth()}</span></div><div class="su-kpis su-four">${gmCard('待我处理',actions.length,"fnNavigate('待办事项')")}${gmCard('待付款金额','¥'+money(amount),"fnNavigate('收付管理','付款执行')")}${gmCard('待确认／分配收款',receipts.length+'笔',"fnNavigate('收付管理','收款记录')")}${gmCard('待结算提成',sheets.length+'团',"fnNavigate('薪酬与提成')")}</div><p class="em-caption">待付款汇总仅含人民币，外币在付款清单按原币展示；提成当前查看 ${esc(fnMonth)}。</p><div class="em-home-lower"><section class="panel"><h3>常用操作</h3><div class="em-shortcut-grid">${[['登记付款','核对批准单，登记成功付款及水单',"fnNavigate('收付管理','付款执行')"],['登记收款','确认实际到账与团款分配',"rcStart()"],['成本票核验','核对票据并关联原付款',"fnNavigate('团档与结算','成本票核验')"],['提成结算','核定团结算、提醒及月度汇总',"fnNavigate('薪酬与提成')"]].map(([n,d,a])=>`<button class="em-shortcut" onclick="${a}"><b>${n}</b><small>${d}</small></button>`).join('')}</div></section><section class="panel em-home-tasks"><div class="em-panel-heading"><h3>我的待办</h3><span>${actions.length}条待处理</span></div>${shown.map(t=>`<button class="em-summary-item" onclick="fnOpenTask(${emArg(t.key)})"><span class="em-summary-top"><b>${esc(t.title)}</b>${fnTag(t.kind)}</span><small>${esc(t.status)}</small></button>`).join('')||'<p class="em-empty">当前没有待办</p>'}<div class="em-more"><button class="em-link" onclick="fnNavigate('待办事项')">查看更多</button></div></section></div>`;}
function fnOpenTask(key){if(!fnActive())return;fnTaskKey=key;fnSection='待办事项';const t=fnTasks().find(t=>t.key===key);fnSub=t?.done?'已完成':'进度中';page='财务视图';render();}
function fnTaskList(){if(fnTaskKey)return fnTaskDetail();const rows=fnTasks().filter(t=>t.done===(fnSub==='已完成')&&(!fnKind||t.kind===fnKind)&&(!fnFind||[t.title,t.id,t.status,costTrip(db,t.ref)?.id].join(' ').toLowerCase().includes(fnFind.toLowerCase())));return fnHeading(fnSub,'查看流程进度，处理当前到达财务的事项')+`<section class="panel"><form class="em-filters" onsubmit="event.preventDefault();fnFind=payVal('fn-find');fnKind=payVal('fn-kind');render()"><label>搜索事项<input id="fn-find" value="${esc(fnFind)}" placeholder="团号、标题或单号"></label><label>事项类型<select id="fn-kind">${bzOptions([...Object.entries(EM_TYPES).map(([k,v])=>[k,k==='invoice'?'成本票核验':v[0]]),['config','配置确认'],['legacyconfig','核算配置']],fnKind,'全部')}</select></label><button>筛选</button></form></section><section class="panel em-task-list">${rows.map(fnTaskRow).join('')||'<p class="em-empty">暂无匹配事项</p>'}</section>`;}
function fnTaskDetail(){const t=fnTasks().find(t=>t.key===fnTaskKey);if(!t)return '<section class="panel">事项已更新，请返回列表。<button onclick="fnTaskKey=\'\';render()">返回</button></section>';let body='';if(t.kind==='payment'){selected=t.id;body=newPaymentDetail(t.record);}else if(t.kind==='receipt'){receiptSelected=t.id;body=receiptMode==='form'?rcForm():rcDetail(t.record);}else if(t.kind==='review'){bzSelectedTrip=t.ref;body=bzReviewDetail(costTrip(db,t.ref));}else if(t.kind==='invoice')body=fnInvoiceDetail(t.record);else if(t.kind==='commission')body=stSheetDetail(t.record).replace("stTab='pool';stDraft=null;render()","fnNavigate('薪酬与提成','待结算池')");else if(t.kind==='cost')body='<section class="panel">'+costChangeDetail(costTrip(db,t.ref),t.record)+'</section>';else if(t.kind==='archive')body=fnTripOverview(t.record);else if(t.kind==='config')body=cfPending();else if(t.kind==='legacyconfig'){const old=bzTab;bzTab='变更记录';body='<section class="panel">'+bzConfigBody()+'</section>';bzTab=old;}return `<button class="em-link" onclick="fnTaskKey='';render()">返回待办事项</button>`+fnHeading(t.title,t.status)+(['payment','receipt','review','commission','cost','archive'].includes(t.kind)?emFlow(t):'')+body;}

function fnTripOverview(t){const ref=tripReference(t),f=stFunds(db,ref);return `<section class="panel">${bzTable(['信息','内容'],[['团号／名称',esc(t.id+' · '+(t.name||''))],['部门／出发日期',esc(t.dep+' · '+(t.departureDate||''))],['负责人员',esc([t.sales,t.operatorA,t.operatorB].filter(Boolean).join('／'))],['行程状态',esc(emTripState(t))],['当前净团款','¥'+money(f.income)],['实际净支付成本','¥'+money(f.expense)]])}</section>`;}
function fnTripList(){const t=costTrip(db,fnTripRef);if(t){const tabs=['团概况','成本明细','收付款明细','成本票核验','经营核定'];let content=fnTripTab==='成本明细'?'<section class="panel"><h3>有效预算成本 V'+(t.costVersion||1)+'</h3>'+costSummaryHtml(t.costItems||[])+costItemsReadonly(t.costItems||[])+'</section>':fnTripTab==='收付款明细'?emTourPayments(t):fnTripTab==='成本票核验'?stTourDetail(t):fnTripTab==='经营核定'?bzReviewDetail(t):fnTripOverview(t);return `<button class="em-link" onclick="fnTripRef='';render()">返回团档列表</button>`+fnHeading(t.id,t.name||'')+`<div class="bz-tabs">${tabs.map(s=>`<button class="${s===fnTripTab?'':'alt'}" onclick="fnTripTab=${emArg(s)};render()">${s}</button>`).join('')}</div>`+content;}const rows=db.trips.filter(t=>t.archiveKind!=='monthly'&&(!fnFind||[t.id,t.name].join(' ').toLowerCase().includes(fnFind.toLowerCase()))&&(!fnDep||t.dep===fnDep)&&(!fnDateFrom||t.departureDate>=fnDateFrom)&&(!fnDateTo||t.departureDate<=fnDateTo)&&(!fnProgress||emTripState(t)===fnProgress)).sort((a,b)=>(b.departureDate||'').localeCompare(a.departureDate||''));return fnHeading('团档列表','查看各部门与项目的团档、收付进度及结算依据')+`<section class="panel"><form class="em-filters" onsubmit="event.preventDefault();fnFind=payVal('fn-find');fnDep=payVal('fn-dep');fnDateFrom=payVal('fn-from');fnDateTo=payVal('fn-to');fnProgress=payVal('fn-progress');render()"><label>团号／名称<input id="fn-find" value="${esc(fnFind)}"></label><label>部门<select id="fn-dep">${bzOptions([...new Set(db.trips.map(t=>t.dep))].map(x=>[x,x]),fnDep,'全部')}</select></label><label>出发日期从<input id="fn-from" type="date" value="${fnDateFrom}"></label><label>至<input id="fn-to" type="date" value="${fnDateTo}"></label><label>进度<select id="fn-progress">${bzOptions(['未开始','进行中','已结团'].map(x=>[x,x]),fnProgress,'全部')}</select></label><button>筛选</button></form>${bzTable(['团号／名称','部门','出发日期','人员','进度','操作'],rows.map(t=>[esc(t.id)+'<small>'+esc(t.name||'')+'</small>',esc(t.dep),esc(t.departureDate||''),esc([t.sales,t.operatorA,t.operatorB].filter(Boolean).join('／')),esc(emTripState(t)),`<button class="alt" onclick="fnOpenTrip(${emArg(tripReference(t))})">查看</button>`]))}${rows.length?'':'<p class="em-empty">暂无匹配团档</p>'}</section>`;}
function fnInvoiceDetail(s){const t=costTrip(db,s.tripRef),group=stInvoiceGroups(db,s.tripRef).find(g=>g.key===s.groupKey);return `<section class="panel"><h3>成本票核验</h3><p>${esc(t?.id||s.tripRef)} · ${esc(group?.entity||'供应商')} · 对方账号 ${esc(group?.account||'')}</p><div class="st-metrics"><div>本次票据金额<strong>¥${money(s.amount)}</strong></div><div>该组待追票<strong>¥${money((group?.pending||0)/100)}</strong></div></div><p>${esc(s.note||'')}</p>${s.proof?.key?`<button class="alt" onclick="downloadTripAttachment(${emArg(s.proof.key)})">查看票据附件</button>`:''}${s.status==='pending'?`<p class="field-note">核对开票单位、金额及原付款后确认匹配；不符合时填写原因退回。</p><label>处理说明<input id="fn-invoice-reason"></label><div class="actions"><button onclick="stAction(d=>emMatchInvoice(d,${emArg(s.id)},'match',''))">确认核验并匹配</button><button class="alt" onclick="stAction(d=>emMatchInvoice(d,${emArg(s.id)},'return',payVal('fn-invoice-reason')))">退回补充</button></div>`:`<span class="field-status">${s.status==='matched'?'已核验匹配':'已退回：'+esc(s.reason||'')}</span>`}<div id="st-error" role="alert"></div></section>`;}

function fnLedger(){const period={from:fnDateFrom||stMonth()+'-01',to:fnDateTo||emDay()},q=gmCashQuery(db,period),rows=q.events.filter(e=>!fnAccount||e.account===fnAccount).sort((a,b)=>b.date.localeCompare(a.date));return fnHeading('账户流水','查看已确认收款、成功付款及账户余额')+`<section class="panel"><form class="em-filters" onsubmit="event.preventDefault();fnDateFrom=payVal('fn-from');fnDateTo=payVal('fn-to');fnAccount=payVal('fn-account');render()"><label>开始日期<input id="fn-from" type="date" value="${period.from}"></label><label>结束日期<input id="fn-to" type="date" value="${period.to}"></label><label>账户<select id="fn-account">${bzOptions(db.receiptAccounts.map(a=>[a.id,a.name+' · '+a.currency]),fnAccount,'全部')}</select></label><button>查询</button></form></section><div class="su-kpis su-four">${gmCard('期初资金余额','¥'+money(q.opening))}${gmCard('本期外部流入','¥'+money(q.income))}${gmCard('本期外部流出','¥'+money(q.outflow))}${gmCard('期末资金余额','¥'+money(q.closing))}</div><p class="field-note">顶部为公司人民币总资金；账户筛选仅影响下方流水。内部转账不重复计入公司外部收支。</p>${q.unknown.length?'<p class="field-note">'+q.unknown.length+'条历史记录缺少期间／账户信息或为非人民币，未纳入期间流水。</p>':''}<section class="panel">${bzTable(['日期／原单','账户','用途／对方','流入','流出','操作'],rows.map(e=>[esc(e.date)+'<small>'+esc(e.ref)+'</small>',esc(rcAccount(db,e.account)?.name||e.account),esc(e.title)+'<small>'+esc(e.counterparty||'')+'</small>',e.amount>0?money(e.amount/100):'—',e.amount<0?money(-e.amount/100):'—',`<button class="alt" onclick="gmOpenCashRecord(${emArg(e.kind)},${emArg(e.ref)})">原单与凭证</button>`]))}${rows.length?'':'<p class="em-empty">当前日期范围没有流水</p>'}</section>`;}
function fnPayrollBatches(){const rows=db.payrollBatches.filter(b=>b.month===fnMonth);return `<section class="panel"><h3>已转工资批次 · ${esc(fnMonth)}</h3>${rows.map(b=>`<details class="st-invoice"><summary>${esc(b.id)} · ¥${money(stTotal(b.lines))}</summary><p>${esc(b.at||'')} · ${esc(b.status||'已转工资')}</p>${bzTable(['员工','团号／角色','提成金额'],b.lines.map(l=>[esc(l.name||l.employeeId),esc(l.tripName+' / '+l.role),money(l.amount)]))}<button class="alt" onclick="stExportBatch(${emArg(b.id)})">导出工资交接CSV</button></details>`).join('')||'<p class="em-empty">本月暂无已转工资批次</p>'}</section>`;}
function fnSalary(){const period=`<section class="panel su-settlement-period"><label>提成结算月份<input id="fn-month" type="month" value="${fnMonth}" onchange="fnMonth=this.value;stSelectedMonth=this.value;render()"></label><p class="em-caption">默认上月，汇总与明细随月份切换。</p></section>`;stSelectedMonth=fnMonth;const monthly=stMonthlyPage(),cut=monthly.indexOf('<div class="panel"><h3>已转工资批次');if(fnSub==='工资结算')return fnHeading('工资结算','查看已转入工资的提成批次，导出工资交接明细')+period+`<section class="panel"><button onclick="fnNewPayment(true)">提报员工薪酬付款</button><p class="field-note">转入工资批次不代表已发薪。基础薪资、单位五险一金等通过薪酬付款及核算配置归集。</p></section>`+(cut>=0?fnPayrollBatches():monthly);if(stTab==='detail'&&stSheetId){const s=db.commissionSheets.find(s=>s.id===stSheetId);return fnHeading('提成核对单')+(s?stSheetDetail(s):'<p>结算单不存在</p>')+'<div id="st-error" role="alert"></div>';}return fnHeading(fnSub)+period+(fnSub==='月度提成汇总'?cut>=0?monthly.slice(0,cut):monthly:stPoolPage(db.commissionSheets.filter(s=>s.month===fnMonth)))+'<div id="st-error" role="alert"></div>';}
function fnContent(){if(page==='申请付款')return paymentPage();if(fnSection==='我的工作台')return fnHome();if(fnSection==='待办事项')return fnTaskList();if(page==='申请付款')return paymentPage();if(fnSection==='收付管理'){if(fnSub==='付款执行')return fnPaymentList();if(fnSub==='账户流水')return fnLedger();if(fnSub==='客户钱包')return fnHeading('客户钱包')+rcWalletPage();return fnHeading(receiptMode==='form'?'登记收款':'收款记录')+(receiptMode==='form'?rcForm():receiptMode==='detail'&&receiptSelected?rcDetail(db.receipts.find(r=>r.id===receiptSelected)):`<section class="panel"><button onclick="rcStart()">新建收款登记</button></section>`+rcRecords());}if(fnSection==='团档与结算'){if(fnSub==='成本票核验')return fnInvoicePage();if(fnSub==='经营核定')return fnHeading('经营核定')+bzReviewPage();return fnTripList();}if(fnSection==='薪酬与提成')return fnSalary();return fnSub==='资金情况'?gmCashPage():gmOperatingPage();}
function fnSyncRoute(){if(page==='概览'){fnSection='我的工作台';fnSub='';fnTaskKey='';}else if(page==='申请付款'){if(paymentDraft.type!=='员工薪酬'){fnSection='收付管理';fnSub='付款执行';}}else if(page==='审批与付款'){fnSection='收付管理';fnSub='付款执行';}else if(page==='收款申请'&&fnSection!=='待办事项'){fnSection='收付管理';if(fnSub!=='客户钱包'||receiptMode==='form')fnSub='收款记录';}else if(page==='提成结算'){fnSection='薪酬与提成';if(!['待结算池','月度提成汇总','工资结算'].includes(fnSub))fnSub='待结算池';if(stTab==='monthly')fnSub='月度提成汇总';}else if(page==='经营核定'){fnSection='团档与结算';fnSub='经营核定';}else if(page==='经营看板'){fnSection='经营看板';if(!['经营分析','资金情况'].includes(fnSub))fnSub='经营分析';}else if(page==='团进度与追票'){fnSection='团档与结算';fnSub='团档列表';fnTripRef=stTripRef;fnTripTab='成本票核验';}else if(page==='团档案'){fnSection='团档与结算';fnSub='团档列表';}}

};

// Salary amounts are calculated from saved, effective parameters. Missing rates are not zero.
function v35PayrollRows(data,b){const names=[...new Set([...(b.lines||[]).map(l=>l.name),...data.staff.filter(p=>p.active!==false).map(p=>p.name),...data.biz.people.filter(p=>p.active&&p.role!=='配置管理员').map(p=>p.name)])];return names.map(name=>{const person=v35Staff(data,name);return {employeeId:person.id,name,dep:person.dep||data.biz.people.find(p=>p.name===name)?.dep||'综合定制部',base:'',leaveDays:0,socialBase:'',fundBase:'',tax:'',extraPay:0,otherDeduction:0,adjustmentReason:'',payee:name,bank:'',card:'',noContrib:false,noContribReason:''};});}
function v35PayrollScheme(data,month){return [...data.v35.salarySchemes].reverse().find(s=>s.from<=month&&(!s.to||s.to>=month));}
function v35Round(n,unit){return unit==='yuan'?Math.round(n):Math.round((n+Number.EPSILON)*100)/100;}
function v35PayrollCalculate(data,b,row){
 const scheme=v35PayrollScheme(data,b.month),leaveDeduction=Number(row.base)/21.75*Number(row.leaveDays||0),basic=v35Round(Number(row.base)-leaveDeduction,'cent'),comm=(b.lines||[]).filter(l=>l.employeeId===row.employeeId||l.name===row.name).reduce((n,l)=>n+payCents(l.amount),0)/100;
 let personal=0,unit=0,personalFund=0,unitFund=0,missing=false;
 if(!row.noContrib){if(!scheme||row.socialBase===''||row.fundBase==='')missing=true;else for(const item of scheme.items){const base=Number(item.kind==='公积金'?row.fundBase:row.socialBase),p=v35Round(base*Number(item.personal)/100+Number(item.personalFixed||0),item.round),u=v35Round(base*Number(item.unit)/100+Number(item.unitFixed||0),item.round);if(item.kind==='公积金'){personalFund+=p;unitFund+=u;}else{personal+=p;unit+=u;}}}
 const gross=v35Round(basic+comm+Number(row.extraPay||0),'cent'),deductions=v35Round(personal+personalFund+Number(row.tax||0)+Number(row.otherDeduction||0),'cent');
 return {...row,basic,leaveDeduction:v35Round(leaveDeduction,'cent'),commission:comm,personal:v35Round(personal,'cent'),unit:v35Round(unit,'cent'),personalFund:v35Round(personalFund,'cent'),unitFund:v35Round(unitFund,'cent'),gross,deductions,net:v35Round(gross-deductions,'cent'),missingScheme:missing,schemeId:scheme?.id};
}
function v35PayrollErrors(b,data){const e=[];if(!b?.wageRows?.length)return ['工资批次没有员工'];for(const row of b.wageRows){const calc=v35PayrollCalculate(data,b,row);if(!v35Money(row.base)||!v35Money(row.tax)||!Number.isFinite(+row.leaveDays)||+row.leaveDays<0||(+row.leaveDays*2)%1)e.push(row.name+'：请填写基础工资、个税和有效事假天数');if(!row.bank?.trim()||!row.card?.trim())e.push(row.name+'：请补齐收款银行及账号');if(row.noContrib&&!row.noContribReason?.trim())e.push(row.name+'：请说明本批未缴费原因');if(calc.missingScheme)e.push(row.name+'：社保公积金基数或有效缴费方案未补齐');if(calc.net<0)e.push(row.name+'：实发为负，请先人工核定');if((Number(row.extraPay)||Number(row.otherDeduction))&&!row.adjustmentReason?.trim())e.push(row.name+'：补发／扣回须原因');}return e;}
function v35CreatePayroll(data,month){stAssert(v35Finance()&&v35Month(month),'仅财务可建立月工资批次');let id;if(data.commissionSheets.some(s=>s.month===month&&s.status==='approved'))id=stPayroll(data,month,costUid());else{const b={id:'GZ-'+costUid(),month,lines:[],sheetIds:[],status:'工资草稿',at:costTime()};data.payrollBatches.push(b);id=b.id;}const b=data.payrollBatches.find(b=>b.id===id);b.wageRows=v35PayrollRows(data,b);b.status='工资草稿';b.total=0;return id;}
function v35SalaryField(batchId,index,key,value){const b=db.payrollBatches.find(b=>b.id===batchId);if(b?.status==='工资草稿')b.wageRows[index][key]=value;}
async function v35SaveSalary(batchId){const b=db.payrollBatches.find(b=>b.id===batchId),snapshot=costClone(b);await bzRun(data=>{const old=data.payrollBatches.find(b=>b.id===batchId);stAssert(v35Finance()&&old?.status==='工资草稿','仅财务可保存草稿工资');old.wageRows=snapshot.wageRows;old.total=old.wageRows.reduce((n,r)=>n+payCents(v35PayrollCalculate(data,old,r).net),0)/100;costAudit(data,b.id+' 保存工资草稿');},'工资草稿已保存');}
function v35SalarySummary(b){const rows=b.calculatedRows||b.wageRows?.map(r=>v35PayrollCalculate(db,b,r))||[];return bzTable(['员工','基础工资','常规及额外提成','个人社保公积金','个税','实发'],rows.map(r=>[esc(r.name),money(r.basic||0),money(r.commission||0),money((r.personal||0)+(r.personalFund||0)),money(r.tax||0),r.missingScheme?'待补参数':money(r.net||0)]));}
function v35SalaryPage(){
 if(!v35Sensitive())return '<section class="panel">无工资明细权限。</section>';const batches=db.payrollBatches.filter(b=>b.month===fnMonth);for(const b of batches)if(!b.wageRows)b.wageRows=v35PayrollRows(db,b);
 const b=batches.find(b=>b.id===v35SalarySelected),scheme=v35PayrollScheme(db,fnMonth);
 return `<section class="panel"><h3>工资结算</h3><div class="grid"><label>薪酬所属月份<input type="month" value="${fnMonth}" onchange="fnMonth=this.value;v35SalarySelected='';render()"></label><div class="actions">${v35Finance()?`<button onclick="bzRun(d=>{v35SalarySelected=v35CreatePayroll(d,fnMonth)})">建立本月工资批次</button>`:''}</div></div><p class="field-note">基础工资＋已确认提成，个税由财务填写。工资批次审批通过后再登记发放。</p>${batches.map(x=>`<button class="alt" onclick="v35SalarySelected=${emArg(x.id)};render()">${esc(x.id)} · ${esc(x.status)}</button>`).join('')}</section>
 ${b?`<section class="panel"><h3>${esc(b.id)} · ${esc(b.status)}</h3>${b.status==='工资草稿'&&v35Finance()?`<div class="table-scroll"><table><tr><th>员工</th><th>标准基础工资 *</th><th>事假天数</th><th>提成</th><th>社保基数 *</th><th>公积金基数 *</th><th>个税 *</th><th>实发预览</th></tr>${b.wageRows.map((r,i)=>{const c=v35PayrollCalculate(db,b,r);return `<tr><td>${esc(r.name)}</td>${['base','leaveDays'].map(k=>`<td><input aria-label="${esc(r.name+k)}" type="number" min="0" step="${k==='leaveDays'?'0.5':'0.01'}" value="${esc(r[k])}" oninput="v35SalaryField(${emArg(b.id)},${i},'${k}',this.value)"></td>`).join('')}<td>${money(c.commission)}</td>${['socialBase','fundBase','tax'].map(k=>`<td><input aria-label="${esc(r.name+k)}" type="number" min="0" step="0.01" value="${esc(r[k])}" oninput="v35SalaryField(${emArg(b.id)},${i},'${k}',this.value)"></td>`).join('')}<td>${c.missingScheme?'待补缴费参数':money(c.net)}</td></tr>`;}).join('')}</table></div>${b.wageRows.map((r,i)=>`<details><summary>${esc(r.name)} · 收款信息及工资调整</summary><div class="grid">${['bank','card','extraPay','otherDeduction','adjustmentReason','noContribReason'].map(k=>`<label>${({bank:'银行名称 *',card:'收款账号 *',extraPay:'其他应发',otherDeduction:'其他扣款',adjustmentReason:'调整原因',noContribReason:'本批无缴费原因'})[k]}<input value="${esc(r[k])}" oninput="v35SalaryField(${emArg(b.id)},${i},'${k}',this.value)"></label>`).join('')}<label class="st-check"><input type="checkbox" ${r.noContrib?'checked':''} onchange="v35SalaryField(${emArg(b.id)},${i},'noContrib',this.checked)">本批不缴社保公积金（须说明）</label><button class="alt" onclick="db.payrollBatches.find(b=>b.id===${emArg(b.id)}).wageRows.splice(${i},1);render()">移出本批</button></div></details>`).join('')}<div class="actions"><button class="alt" onclick="v35SaveSalary(${emArg(b.id)})">保存并更新计算</button><button onclick="v35SalaryPaymentId=${emArg(b.id)};paymentDraft.type='员工薪酬';go('申请付款')">核对并提交薪酬付款</button></div>`:v35SalarySummary(b)+(v35Finance()&&stApp(db,b.paymentId)?.special==='退回修改'?`<button class="alt" onclick="bzRun(d=>v35ReopenSalary(d,${emArg(b.id)}))">按退回意见修改工资批次</button>`:'')+(b.paymentId?`<button class="alt" onclick="fnOpenPayment(${emArg(b.paymentId)})">查看付款审批／发放进度</button>`:'')}${(b.lines||[]).length?`<details><summary>查看已确认提成来源</summary>${bzTable(['员工','团号','角色','金额'],b.lines.map(l=>[esc(l.name),esc(l.tripName),esc(l.role),money(l.amount)]))}</details>`:''}</section>`:''}
 ${v35Finance()?v35SchemePage(scheme):''}<div id="bz-error" role="alert"></div>`;
}
function v35SchemePage(scheme){if(!v35SchemeDraft)v35SchemeDraft=scheme?costClone(scheme):{from:fnMonth,location:'',items:['养老','医疗','失业','工伤','公积金'].map(kind=>({kind,personal:'',unit:'',personalFixed:0,unitFixed:0,round:'cent'}))};const d=v35SchemeDraft;return `<section class="panel"><details><summary>社保、公积金缴费参数 · ${scheme?'已配置':'待补充'}</summary><p class="field-note">实际比例由财务核定填写，系统不会预设或猜测。</p><div class="grid"><label>适用参保地 *<input value="${esc(d.location)}" oninput="v35SchemeDraft.location=this.value"></label><label>生效月份 *<input type="month" value="${d.from}" onchange="v35SchemeDraft.from=this.value"></label></div>${bzTable(['项目','个人比例% *','单位比例% *','个人固定额','单位固定额','取整'],d.items.map((r,i)=>[esc(r.kind),...['personal','unit','personalFixed','unitFixed'].map(k=>`<input type="number" min="0" step="0.0001" value="${esc(r[k])}" oninput="v35SchemeDraft.items[${i}].${k}=this.value">`),`<select onchange="v35SchemeDraft.items[${i}].round=this.value"><option value="cent" ${r.round==='cent'?'selected':''}>到分</option><option value="yuan" ${r.round==='yuan'?'selected':''}>到元</option></select>`]))}<button onclick="v35SaveScheme()">保存并确认新版本</button></details></section>`;}
function v35SaveScheme(){const input=costClone(v35SchemeDraft);return bzRun(data=>{stAssert(v35Finance()&&input.location?.trim()&&v35Month(input.from),'请财务填写参保地及生效月份');for(const r of input.items)for(const k of ['personal','unit'])stAssert(r[k]!==''&&Number.isFinite(+r[k])&&+r[k]>=0&&+r[k]<=100,'各项目个人和单位比例必须明确填写，可为0');data.v35.salarySchemes.push({...input,id:'SB-'+costUid(),actor:activeRole,at:costTime()});v35SchemeDraft=null;costAudit(data,'确认缴费方案新版本');},'缴费方案已确认');}
function v35SalaryPaymentPage(){const b=db.payrollBatches.find(b=>b.id===(v35SalaryPaymentId||paymentDraft.salaryBatchId));if(!v35Finance())return '<section class="panel">薪酬付款由财务建立和提报。</section>';if(!b)return `<section class="panel"><h3>员工薪酬付款</h3><label>工资批次 *<select onchange="v35SalaryPaymentId=this.value;render()">${bzOptions(db.payrollBatches.filter(b=>b.status==='工资草稿').map(b=>[b.id,b.month+' · '+b.id]),'')}</select></label><button class="alt" onclick="fnNavigate('薪酬与提成','工资结算')">建立／完善工资批次</button></section>`;return `<section class="panel"><h3>核对工资批次 ${esc(b.id)}</h3>${v35SalarySummary(b)}<form id="paymentForm" onsubmit="v35SubmitSalaryPayment(event)"><label class="st-check"><input id="v35-payroll-ack" type="checkbox">已核对工资构成、代扣及员工收款信息</label><button>提交总经理审批</button><button type="button" class="alt" onclick="fnNavigate('薪酬与提成','工资结算')">返回工资结算</button><div id="p-errors" role="alert"></div></form></section>`;}
async function v35SubmitSalaryPayment(e){e.preventDefault();if(!payRead('v35-payroll-ack')?.checked)return payError(['请确认工资和员工收款信息']);try{const id=v35SalaryPaymentId||paymentDraft.salaryBatchId;let appId;await costMutate(data=>{const b=data.payrollBatches.find(b=>b.id===id);stAssert(v35Finance()&&b?.status==='工资草稿','仅财务可提交工资草稿');const errors=v35PayrollErrors(b,data);stAssert(!errors.length,errors.join('；'));stAssert(!data.apps.some(a=>a.salaryBatchId===id&&!a.special),'该工资批次已提报，不能重复申请');b.calculatedRows=b.wageRows.map(r=>v35PayrollCalculate(data,b,r));b.total=b.calculatedRows.reduce((n,r)=>n+payCents(r.net),0)/100;stAssert(b.total>0,'批次实发合计须大于0');appId='FK-'+costUid();const a={id:appId,schema:3,paymentType:'员工薪酬',salaryBatchId:b.id,fee:'工资批次',amount:b.total,amountCNY:b.total,currency:'CNY',rate:1,owner:'工资批次各员工所属部门',note:b.month+'工资发放 '+b.id,creator:activeRole,stage:2,history:[costTime()+' · 财务提交工资批次'],executionVersion:0,trip:'非团事项',basis:'工资批次及已核定提成底稿'};data.apps.push(a);b.paymentId=appId;b.status='审批中';costAudit(data,b.id+' 提交薪酬付款审批');});selected=appId;go('审批与付款');}catch(error){payError([error.message]);}}

function v35EmployeePaid(data,appId,employeeId){return data.paymentReceipts.filter(p=>p.applicationId===appId).flatMap(p=>p.employeeAllocations||[]).filter(r=>r.employeeId===employeeId).reduce((n,r)=>n+payCents(r.amount),0)/100;}
const v35PriorExecutionPanel=stExecutionPanel;
stExecutionPanel=function(a){let html=v35PriorExecutionPanel(a);html=html.replace(/<details class="wide"><summary>实际收款资料有变化？[\s\S]*?<\/details>/,'').replace(/<label>处理原因[\s\S]*?关闭剩余应付<\/button>/,'').replace(/<label[^>]*>原因[\s\S]*?关闭剩余应付<\/button>/,'');html=html.replace(/<label>原因／处理说明<textarea id="st-close-reason"[\s\S]*?关闭剩余应付<\/button>/,'').replace(/<label[^>]*>[^<]*<textarea id="st-close-reason"[\s\S]*?关闭剩余应付<\/button>/,'').replace(/<button[^>]*onclick="stAction\(d=>stClosePayment[\s\S]*?关闭剩余应付<\/button>/,'');const b=db.payrollBatches.find(b=>b.id===a.salaryBatchId);if(b&&v35Finance()&&a.stage===3){const table=bzTable(['员工','批准实发','累计已发','本次成功发放'],b.calculatedRows.map((r,i)=>{const paid=v35EmployeePaid(db,a.id,r.employeeId);return [esc(r.name),money(r.net),money(paid),`<input id="v35-paid-${i}" type="number" min="0" step="0.01" value="${bzR(r.net-paid)}" oninput="v35SalaryExecutionTotal(${emArg(b.id)})">`];}));html=html.replace('<label>实际金额（CNY） *',`<div class="wide">${table}</div><label>实际金额（CNY） *`).replace('id="st-pay-amount"','id="st-pay-amount" readonly');}return html;};
function v35SalaryExecutionTotal(id){const b=db.payrollBatches.find(b=>b.id===id);payRead('st-pay-amount').value=b.calculatedRows.reduce((n,r,i)=>n+payCents(payVal('v35-paid-'+i)||0),0)/100;}
function v35ReopenSalary(data,id){const b=data.payrollBatches.find(b=>b.id===id),a=stApp(data,b?.paymentId);stAssert(v35Finance()&&a?.special==='退回修改'&&stGross(data,a)===0,'仅可修改已退回且未发放的工资批次');a.special='已撤回';a.history.push(costTime()+' · '+activeRole+' 退回工资批次重新编辑');b.status='工资草稿';b.previousPaymentIds??=[];b.previousPaymentIds.push(a.id);delete b.paymentId;delete b.calculatedRows;costAudit(data,id+' 工资退回修改，保留原审批轨迹');}
const v35PriorExecuteSalary=stExecute;
stExecute=function(data,id,input){const a=stApp(data,id),b=data.payrollBatches.find(b=>b.id===a?.salaryBatchId);if(b){stAssert(input.employeeAllocations?.length,'请填写本次员工发放明细');stAssert(new Set(input.employeeAllocations.map(r=>r.employeeId)).size===input.employeeAllocations.length,'员工发放明细不能重复');stAssert(input.employeeAllocations.reduce((n,r)=>n+payCents(r.amount),0)===payCents(input.amount),'员工发放合计与本次付款金额不一致');for(const row of input.employeeAllocations){const approved=b.calculatedRows.find(r=>r.employeeId===row.employeeId);stAssert(approved&&v35Money(row.amount)&&Number(row.amount)+v35EmployeePaid(data,id,row.employeeId)<=approved.net,'员工累计发放不能超过其批准实发金额');}}const result=v35PriorExecuteSalary(data,id,input);if(b)data.paymentReceipts.find(p=>p.id===result).employeeAllocations=costClone(input.employeeAllocations);return result;};
stSaveExecution=async function(e,id,version,key){e.preventDefault();if(stBusy)return;try{stAssert(stProof&&await tripAttachment('readonly',s=>s.get(stProof.key)),'请上传水单');const a=stApp(db,id),b=db.payrollBatches.find(b=>b.id===a.salaryBatchId),input={version,requestKey:key,amount:payVal('st-pay-amount'),source:payVal('st-pay-source'),date:payVal('st-pay-date'),proof:stProof,changed:false,employeeAllocations:b?b.calculatedRows.map((r,i)=>({employeeId:r.employeeId,amount:payVal('v35-paid-'+i)||'0'})):undefined};await stAction(data=>{const result=stExecute(data,id,input);stProof=null;return result;});}catch(error){toast(error.message);}};
</script><script data-module="workspace-v3.js">/* Finance maintenance, per-expense allocation and handover surfaces. */
let v35AccountDraft=null,v35ExpenseDraft=null,v35HandoffDraft=null;
const v35OldBzInitial=bzInitial;

function v35AccountPage(){
 if(!v35Finance()&&!v35GM())return '<section class="panel">公司账户与期初由财务或总经理维护、确认。</section>';
