<script>
const KEY='xingjie-finance-rules-v2',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{};db??={trips:[],apps:[],logs:[],balance:100000,todos:[]};let page='概览',activeRole='操作 / 江婧婕',selected=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function log(t){db.logs.unshift({t,time:new Date().toLocaleString('zh-CN')});save()}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3000)}function go(p){page=p;render()}const money=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2});const statuses=['主管审核','财务审核','总经理审核','待付款','付款完成'];function state(a){return a.special||statuses[a.stage]}function getTrip(id){return db.trips.find(t=>t.id===id||t.uid===id)}function table(){return db.apps.length?`<table><tr><th>申请单 / 团号</th><th>用途 / 供应商</th><th>金额</th><th>当前状态</th><th></th></tr>${db.apps.map(a=>`<tr><td>${esc(a.id)}<div class="note">${esc(a.trip)}</div></td><td>${esc(a.note)}<div class="note">${esc(a.vendor)}</div></td><td>¥${money(a.amount)}</td><td><span class="tag">${state(a)}</span></td><td><button class="alt" onclick="selected='${a.id}';go('审批与付款')">查看</button></td></tr>`).join('')}</table>`:'<div class="empty">还没有付款申请。先创建一笔，体验完整审批流程。</div>'}
function render(){document.getElementById('title').textContent=page;document.getElementById('nav').innerHTML=['概览','团档案','申请付款','审批与付款','待办与记录'].map(x=>`<button class="${x===page?'active':''}" onclick="go('${x}')">${x}</button>`).join('');let html='';
if(page==='概览')html=`<div class="cards">${[['已建团',db.trips.length],['审批中',db.apps.filter(a=>a.stage<3&&!a.special).length],['待付款',db.apps.filter(a=>a.stage===3&&!a.special).length],['模拟账户余额','¥'+money(db.balance)]].map(([k,v])=>`<div class="card"><span class="muted">${k}</span><div class="num">${v}</div></div>`).join('')}</div><div class="panel"><h3>从一笔付款开始走查</h3><p class="muted">建团 → 操作提报 → 主管审核 → 财务审核 → 总经理审核 → 财务执行</p><div class="actions"><button onclick="go('团档案')">新建业务团档</button><button class="alt" onclick="go('申请付款')">发起付款申请</button><button class="alt" onclick="seedApp()">载入虚构测试团档</button></div></div><div class="panel"><h3>最近付款申请</h3>${table()}</div>`;
if(page==='团档案')html=`<div class="panel"><h3>新建团档案</h3>${tripForm()}</div><div class="panel"><h3>团档案</h3><div id="savedCosts"></div><table><tr><th>团号</th><th>归属 / 目的地</th><th>已确认成本</th><th>成本附件 / 清单</th></tr>${db.trips.map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(t.dep)} / ${esc(t.dest)}</td><td>${t.costConfirmed?'¥'+money(t.budget):'待导入核对'}</td><td>${esc(t.file)}<br><button type="button" class="alt" onclick="showTripCosts('${t.id}')">查看成本清单</button></td></tr>`).join('')}</table></div>`;
if(page==='申请付款')html=`<div class="panel"><h3>团相关付款申请</h3>${!activeRole.startsWith('操作')?'<p class="risk">请切换到操作角色填写申请。</p>':`<form onsubmit="submitApp(event)" class="grid"><label>财务方向<input disabled value="付款"></label><label>关联方式<input disabled value="关联旅游团"></label><label class="wide">团号<select id="trip" required onchange="paymentCostOptions()">${db.trips.map(t=>`<option value="${esc(tripReference(t))}">${esc(t.id)}</option>`).join('')}</select></label><label>费用类别<input disabled value="定制团 · 从档案带出"></label><label class="wide">对应成本明细<select id="costItem" onchange="paymentCostPreview()"></select><div id="costHint" class="note"></div></label><label>用途 / 备注<textarea id="note" required placeholder="如：酒店30%预付款"></textarea></label><label>金额（人民币）<input id="amount" oninput="paymentCostPreview()" type="number" min="0.01" step="0.01" required></label><label>供应商<select id="vendor"><option>示例酒店 · 已准入</option><option>示例车队 · 已准入</option></select></label><label>对方收款方式<select disabled><option>银行转账</option></select></label><label>对方收款信息<input disabled value="供应商测试账户 · 尾号0001"><div class="note">模拟账号，不可用于真实付款。</div></label><label class="wide">付款依据<input type="file" id="basis"><span class="note"><input id="demoBasis" type="checkbox" style="width:auto"> 使用演示账单（模拟附件）</span></label><label class="risk">是否未收款先垫款<select id="advance" onchange="document.getElementById('cancelwrap').hidden=this.value!=='是'"><option>否</option><option>是</option></select></label><label id="cancelwrap" hidden class="risk">最晚取消时间<input type="datetime-local" id="cancel"></label><div id="paymentCheck" class="wide"></div><div class="wide"><button>提交付款审批</button></div></form>`}</div>`;

async function tripAttachment(mode, action) {
  const dbHandle=await new Promise((resolve,reject)=>{
    let expired=false;
    const timer=setTimeout(()=>{expired=true;reject(new Error('成本附件存储连接超时，请关闭其他原型页面后重试'));},10000);
    const request=indexedDB.open('xingjie-trip-files',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('files');
    request.onsuccess=()=>{clearTimeout(timer);if(expired){request.result.close();return;}request.result.onversionchange=()=>request.result.close();resolve(request.result);};
    request.onerror=()=>{clearTimeout(timer);reject(request.error);};
    request.onblocked=()=>{clearTimeout(timer);expired=true;reject(new Error('成本附件存储被其他页面占用，请关闭其他原型页面后重试'));};
  });
  try {
    return await new Promise((resolve,reject)=>{
      const transaction=dbHandle.transaction('files',mode);
      const timer=setTimeout(()=>transaction.abort(),10000);
      const request=action(transaction.objectStore('files'));
      transaction.oncomplete=()=>{clearTimeout(timer);resolve(request.result);};
      transaction.onabort=()=>{clearTimeout(timer);reject(transaction.error||new Error('附件保存超时或已中止'));};
    });
  } finally { dbHandle.close(); }
}
async function downloadTripAttachment(uid) {
  try {
    const file=await tripAttachment('readonly',store=>store.get(uid));
    if (!file) return toast('当前浏览器没有该成本原文件');
    const url=URL.createObjectURL(file);
    const link=document.createElement('a');
    link.href=url;
    link.download=file.name;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  } catch { toast('成本原文件读取失败'); }
}
let tripSaving=false;
async function createTrip(event) {
  event.preventDefault();
  if(tripSaving)return;
  if(!canCreateTrip())return tripFeedback('当前角色无建团权限','权限校验');
  const invalid=[...document.getElementById('tripForm').elements].filter(el=>el.willValidate&&!el.validity.valid);
  if(invalid.length){
    const names=invalid.map(el=>el.getAttribute('aria-label')||el.closest('label')?.firstChild?.textContent?.trim()||el.id||'表单字段');
    tripFeedback('请补齐或修正：'+names.join('、'),'字段校验');
    const field=invalid[0];
    const visible=field.tagName==='SELECT'?field.previousElementSibling?.querySelector('input'):field;
    visible?.scrollIntoView({block:'center',behavior:'smooth'});visible?.focus();return;
  }
  diagnostic('建团保存','开始','校验');
  if (!costDraft.file || !costDraft.confirmed || !costDraft.items.length) return tripFeedback('请先上传、核对并确认成本明细','成本校验');
  const date=tripField('date').value;
  const destination=chosenDestination(), base=currentTripBase();
  if (!base) return tripFeedback('请补齐团号所需字段','团号校验');
  const category=tripField('tripCategory').value;
  const owner=tripField('tripOwner').value;
  const record={
    uid:typeof crypto.randomUUID==='function'?crypto.randomUUID():'trip-'+Date.now()+'-'+Math.random().toString(36).slice(2), dep:owner.slice(owner.indexOf(':')+1), owner, category,
    dest:destination.name, destinationId:destination.key, destinationScope:tripField('destScope').value,
    destinationCode:destination.code, departureDate:date,
    sales:tripField('tripSales').value, operatorA:tripField('tripOperatorA').value, operatorB:tripField('tripOperatorB').value,
    budget:costTotal(), file:costDraft.filename, costConfirmed:true, costVersion:1,
    costItems:structuredClone(costDraft.items), costSheet:costDraft.sheet, costConfirmedAt:new Date().toISOString()
  };
  if (category==='RJ') record.foreignSource=tripField('foreignSource').value;
  record.name=tripField('tripName')?.value.trim()||record.dest;
  record.archiveKind='single';
  if (['COTA','OVERSEAS'].includes(category)) {
    record.externalOrder=tripField('tripOrder').value.trim();
    record.platform=tripField('tripPlatform').value;
    record.product=tripField('tripProduct').value;
  }
  const attachment=costDraft.file;
  const button=tripField('tripSave');
  tripSaving=true;
  button.disabled=true;
  button.textContent='保存中…';
  let storedFile=false;
  try {
    tripFeedback('正在保存成本附件，请稍候…','保存附件',false);
    diagnostic('建团保存','进行中','保存附件');
    await tripAttachment('readwrite',store=>store.put(attachment,record.uid));
    storedFile=true;
    const commit=()=>{
      const latest=JSON.parse(localStorage.getItem(KEY)) || db;
      if(record.externalOrder&&latest.trips.some(t=>t.owner===record.owner&&t.platform===record.platform&&t.externalOrder===record.externalOrder))throw new Error('该平台订单已有团档，请查找并复用');
      record.id=nextTripCode(base,latest.trips);
      const updated={...latest,trips:[...latest.trips,record],
        logs:[{t:'建立团档案 '+record.id,time:new Date().toLocaleString('zh-CN')},...latest.logs]};
      localStorage.setItem(KEY,JSON.stringify(updated));
      db=updated;
    };
    if (navigator.locks) await navigator.locks.request(KEY+'-business-write',{signal:AbortSignal.timeout(10000)},commit);
    else commit();
  } catch (error) {
    diagnostic('建团保存','失败','本地保存',error.name+': '+error.message);
    if (storedFile) await tripAttachment('readwrite',store=>store.delete(record.uid)).catch(()=>{});
    tripFeedback('保存失败：'+error.message+'。填写内容已保留，可在「待办与记录」导出诊断日志。','本地保存',false);
    return;
  } finally {
    tripSaving=false;
    button.disabled=false;
    button.textContent='保存并生成团号';
  }
  costDraft=emptyCostDraft();
  render();
  if (page==='团档案') showTripCosts(record.id);
  diagnostic('建团保存','成功','完成',record.id);
  tripFeedback('建团成功 · 团号：'+record.id+' · 成本合计 ¥'+money(record.budget),'完成',false);
  document.getElementById('tripFeedback')?.scrollIntoView({block:'center',behavior:'smooth'});
}

function tripFeedback(message,stage,record=true){
 const el=document.getElementById('tripFeedback');
 if(el){el.hidden=false;el.className='wide banner';el.textContent=message;}
 if(record)diagnostic('建团保存','未通过',stage,message);
 toast(message);
}
const originalCreateTrip=createTrip;
createTrip=async function(event){try{await originalCreateTrip(event);}catch(error){diagnostic('建团保存','异常','运行',error.name+': '+error.message);tripFeedback('建团未完成：'+error.message+'。填写内容已保留，可导出诊断日志。','运行',false);}};

function groundCostSection(rows) {
  const start = rows.findIndex(r => /^附\s*1\s*[:：]\s*地接明[细細]/.test(String(r.cells[1] || '').trim()));
  if (start < 0) return null;
  const end = rows.findIndex((r, i) => i > start && /^行程[費费]用[總总][額额]/.test(String(r.cells[1] || '').trim()));
  const header = rows.findIndex((r, i) => i > start && i < end && /[項项]目/.test(r.cells[1]) && /[價价]格|金[額额]/.test(r.cells[6]));
  return header < 0 ? null : {header, end, total: parseAmount(rows[end].cells[6])};

function costTotal(items=costDraft.items){
  return items.filter(x=>x.include).reduce((n,x)=>n+Math.round((Number(x.amount)||0)*100),0)/100;
}
function refreshCostTotals(){
  const groups=new Map();
  for(const item of costDraft.items){
    const key=item.sourceCategory||'其他明细';
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(item);
  }
  Array.from(groups.values()).forEach((items,i)=>{
    document.getElementById('cost-subtotal-'+i).textContent='¥'+money(costTotal(items));
  });
  document.getElementById('costTotal').textContent=money(costTotal());
  const summary=document.getElementById('costSummary');if(summary)summary.innerHTML=costSummaryHtml(costDraft.items.filter(x=>x.include));
  const warnings=document.getElementById('costWarnings');if(warnings)warnings.innerHTML=costWarningHtml();

function matchCostText(value){return String(value??'').trim().replace(/\s+/g,'').toLowerCase();}
function sameCostContent(a,b){return matchCostText(a.name)===matchCostText(b.name)&&matchCostText(a.category)===matchCostText(b.category)&&Math.round(Number(a.amount)*100)===Math.round(Number(b.amount)*100);}
function ensureChangeMatches(){
 if(!costEditor)return;
 const old=costVersion(costTrip(db,costEditor.tripRef),costEditor.baseVersion)?.items||[];
 const incoming=costDraft.items.filter(x=>x.include);
 if(costEditor.mode==='online'){
  for(const x of incoming)if(x.originId===undefined){x.originId='new';x.matchConfirmed=true;}
  return;
 }
 const used=new Set(incoming.filter(x=>x.originId&&x.originId!=='new').map(x=>x.originId));
 // Unique one-to-one matches: full content first, then identity fields. Never use Excel row positions.
 const criteria=[(a,b)=>sameCostContent(a,b),(a,b)=>matchCostText(a.name)===matchCostText(b.name)&&matchCostText(a.category)===matchCostText(b.category),(a,b)=>!!matchCostText(a.name)&&matchCostText(a.name)===matchCostText(b.name)];
 for(const matches of criteria){
  const fresh=incoming.filter(x=>x.originId===undefined),available=old.filter(o=>!used.has(o.id));
  for(const x of fresh){
   const options=available.filter(o=>!used.has(o.id)&&matches(x,o));
   if(options.length===1&&fresh.filter(n=>n.originId===undefined&&matches(n,options[0])).length===1){x.originId=options[0].id;x.matchConfirmed=true;x.matchMethod='auto';used.add(x.originId);}
  }
 }
 for(const x of incoming){
  if(x.originId!==undefined)continue;
  const possible=old.filter(o=>!used.has(o.id)&&(matchCostText(o.name)===matchCostText(x.name)||(matchCostText(o.category)===matchCostText(x.category)&&Number(o.amount)===Number(x.amount))));
  x.originId=possible.length?'':'new';x.matchConfirmed=!possible.length;x.matchMethod=possible.length?'ambiguous':'new';
 }
}
function changeMappingHtml(){

 const unchanged=included.filter(({x})=>{const original=old.find(o=>o.id===x.originId);return original&&sameCostContent(x,original);});
 const review=included.filter(({x})=>{const original=old.find(o=>o.id===x.originId);return !original||!sameCostContent(x,original)||x.matchMethod==='manual'||!x.matchConfirmed;});
 const unresolved=included.filter(({x})=>!x.originId||!x.matchConfirmed).length;

function paymentRiskSignature(check){return JSON.stringify([check.risk,check.version,check.costId,check.used,check.limit,check.pendingId,check.pendingAmount]);}
checkPayment=function(a,data=db){
 const t=costTrip(data,a.tripUid||a.trip),messages=[],item=t?.costItems?.find(x=>x.id===a.costId),ref=t?tripReference(t):a.trip;
 const pending=t?pendingCostChange(data,ref):null,proposed=pending?.items.find(x=>x.id===a.costId),used=costLineUsage(data,ref,a.costId,a.id),amount=Number(a.amount)||0;
 let risk=false;
 if(!t?.costConfirmed){risk=true;messages.push('该团尚无已确认成本，无法核对有效额度。');}
 else if(!item){risk=true;messages.push(proposed?'新增待审成本明细：'+proposed.category+' / '+proposed.name+'，尚无已生效预算依据。':'未匹配当前有效成本明细，请主管核对依据。');}
 else{
  const cumulative=Math.round((used+amount)*100)/100;risk=cumulative>Number(item.amount);
  messages.push('对应 '+item.category+' / '+(item.name||item.category)+'；有效成本 ¥'+money(item.amount)+'；其他已付及有效审批占用 ¥'+money(used)+'；本次 ¥'+money(amount)+'；累计 ¥'+money(cumulative)+'。');
  messages.push(risk?'超过有效成本 ¥'+money(cumulative-item.amount)+'，仅提示风险，由主管判断。':'累计金额未超过有效成本，仍需主管审核。');
 }
 if(pending)messages.push('成本变更 '+pending.id+' 待审'+(proposed?'，该明细拟定金额 ¥'+money(proposed.amount):item?'，待审版本拟删除该明细':'')+'；以有效 V'+t.costVersion+' 为准，付款通过不代表成本变更通过。');
 return {risk,messages,version:t?.costVersion||null,source:item?.source||'',costId:a.costId,used,limit:item?Number(item.amount):null,pendingId:pending?.id||null,pendingAmount:proposed?.amount??null,time:new Date().toISOString(),engine:'有效成本及占用核对'};
};

submitApp=async function(event){
 event.preventDefault();if(costActionBusy)return;
 const read=id=>document.getElementById(id),form=event.currentTarget;
 if(!activeRole.startsWith('操作'))return toast('请切换到操作角色');

  const a={...input,trip:t.id,tripUid:t.uid,stage:0,history:['操作提交申请'],creator:activeRole,reviewer:costReviewer(t)};

 });selected=input.id;go('审批与付款');toast('付款申请已提交；成本风险交由主管判断');}catch(e){toast(e.message);}finally{costActionBusy=false;}
};
approve=async function(id){
 if(costActionBusy)return;
 const opinion=document.getElementById('opinion')?.value.trim()||'',ack=document.getElementById('riskack')?.checked,signature=document.getElementById('paymentReviewRisk')?.value;
 costActionBusy=true;
 try{await costMutate(data=>{
  const a=data.apps.find(x=>x.id===id),expected=a?['主管','财务','总经理'][a.stage]:null;
  if(!a||a.special||!expected||!activeRole.startsWith(expected)||(a.stage===0&&a.reviewer&&activeRole!==a.reviewer))throw Error('当前角色无审批权限或申请已处理');
  const check=checkPayment(a,data);
  if(a.stage===0){
   if(paymentRiskSignature(check)!==signature){db=data;throw Error('付款风险已变化，请重新查看后确认');}
   if(check.risk&&(!ack||!opinion))throw Error('超额或无成本依据的付款，须确认风险并填写主管风险处理意见');
   a.supervisorRisk=costClone(check);a.riskOpinion=opinion;
  }
  a.history.push(activeRole+' 同意：'+(opinion||'无补充意见'));a.stage++;costAudit(data,a.id+' 审批通过，进入 '+statuses[a.stage]);
 });render();toast('付款审批已通过本节点');}catch(e){if(e.message.includes('风险已变化'))render();toast(e.message);}finally{costActionBusy=false;}
};

resubmit=async function(event,id){
 event.preventDefault();if(costActionBusy||!activeRole.startsWith('操作'))return;
 const note=document.getElementById('editnote').value,amount=+document.getElementById('editamount').value;

 try{await costMutate(data=>{const a=data.apps.find(x=>x.id===id);if(!a||!['退回修改','已撤回'].includes(a.special))throw Error('申请状态已变化');a.attempts??=[];a.attempts.push({costSnapshot:costClone(a.costSnapshot||null),check:costClone(a.check||null),amount:a.amount,note:a.note});a.note=note;a.amount=amount;a.special=null;a.stage=0;delete a.supervisorRisk;delete a.riskOpinion;paymentSnapshot(data,costTrip(data,a.tripUid||a.trip),a);a.history.push('操作修改后重新提交至主管');costAudit(data,a.id+' 重新提交');});render();}catch(e){toast(e.message);}finally{costActionBusy=false;}

function paymentValidate(d,data){
 const errors=[],required=(k,label)=>{if(!String(d[k]??'').trim())errors.push('请填写'+label);};
 if(!PAYMENT_TYPES.includes(d.type))errors.push('请选择有效付款类型');
 for(const [k,l] of [['company','公司主体'],['owner','部门／项目'],['fee','费用类别'],['note','用途'],['due','期望付款日期']])required(k,l);
 if(!OWNER_ENTRIES.some(([k])=>k===d.owner))errors.push('请选择有效部门／项目');
 if(!Number.isFinite(+d.amount)||+d.amount<=0)errors.push('付款金额须大于0');
 if(!['CNY','USD','EUR','JPY','HKD'].includes(d.currency))errors.push('请选择有效币种');
 if(d.currency!=='CNY'&&(!Number.isFinite(+d.rate)||+d.rate<=0))errors.push('请填写有效折算汇率');
 if(!d.demoBasis&&!d.basisName)errors.push('请上传付款依据或使用演示依据');
 const fee=d.fee.split('|').at(-1),transfer=d.type==='资金往来'&&fee==='内部资金调拨';
 if(!transfer)for(const [k,l] of [['payee','收款对象'],['channel','收款渠道'],['recipient','收款信息']])required(k,l);
 if(d.type==='业务付款'){
  if(!PAYMENT_BUSINESSES[d.business])errors.push('请选择业务类别');
  const t=costTrip(data,d.tripRef);if(!t)errors.push('请关联业务档案');
  else{
   if(!payArchiveMatches(t,d))errors.push('关联档案与当前业务类别、平台或月份不一致');
   if(!costReviewer(t))errors.push('该归属的业务审核主管尚未配置，请联系配置人员；系统不会猜测审批人');
   if(['DZ','RJ'].includes(d.business)&&fee!=='客户退款'&&!t.costConfirmed)errors.push('定制业务须先完整建档并确认首次成本单');
  }
  if(['COTA','OVERSEAS'].includes(d.business)){const platforms=d.business==='OVERSEAS'?OVERSEAS_PLATFORMS:TRIP_PLATFORMS,products=d.business==='OVERSEAS'?OVERSEAS_PRODUCTS:TRIP_PRODUCTS;if(!platforms[d.platform]||!products[d.product])errors.push('请选择有效平台与业务项目');required('orderNo','平台订单号');}
  if(d.business==='OVERSEAS'&&!/^\d{4}-(0[1-9]|1[0-2])$/.test(d.month))errors.push('请由操作人员填写有效所属月份');
  if(!BUSINESS_FEES.includes(fee))errors.push('请选择有效业务费用类别');
  if(fee==='客户退款'){
   required('originalRef','原收款编号');required('refundReason','退款原因');
   if(!Number.isFinite(+d.originalAmount)||+d.originalAmount<=0)errors.push('请填写原收款金额');
   const used=data.apps.filter(a=>a.schema===3&&a.paymentType==='业务付款'&&a.fee==='客户退款'&&!a.special&&a.tripUid===t?.uid&&a.originalRef===d.originalRef&&a.creatorDraftId!==d.draftId).reduce((sum,a)=>sum+(a.amountCNY??a.amount),0);
   if(used+(+d.amount)*(d.currency==='CNY'?1:+d.rate)>+d.originalAmount)errors.push('本次及历史有效退款超过填报的原收款金额，请核对');
  }
  if(d.advance==='是'&&fee!=='客户退款')required('cancel','最晚取消时间');
 }else{
  required('period','所属月份／期间');
  if(d.type==='管销付款'){const [g,c]=d.fee.split('|');if(!PAYMENT_GROUPS[g]?.includes(c))errors.push('请选择有效费用类别');}
  if(d.type==='资金往来'){
   if(!TRANSFER_FEES.includes(fee))errors.push('请选择有效往来类别');
   if(transfer){required('sourceAccount','转出账户');required('targetAccount','转入账户');if(d.sourceAccount===d.targetAccount)errors.push('转入与转出账户不能相同');}
   if(fee==='归还借款本金')required('originalRef','原借款依据');
   if(['借出款','平台保证金','押金及其他保证金'].includes(fee)){required('returnDate','预计收回日期');required('returnTerms','归还／退还条件');}
  }
  if(d.type==='员工薪酬'){
   if(!paymentCanSensitive())errors.push('当前角色无薪酬提报权限，请使用财务角色');
   if(!PAYROLL_FEES.includes(fee))errors.push('请选择有效薪酬项目');
   required('staff','员工或薪酬批次');required('payrollDepartment','核算归属');
   if(['社会保险费','住房公积金'].includes(fee)){
    if(d.unitShare===''||d.personalShare===''||!Number.isFinite(+d.unitShare)||!Number.isFinite(+d.personalShare)||+d.unitShare<0||+d.personalShare<0||payCents(+d.unitShare + +d.personalShare)!==payCents(d.amount))errors.push('单位承担＋个人代扣须等于本次缴纳金额');
   }
   if(fee==='业务提成'){required('originalRef','提成核算档案号');if(!data.trips.some(t=>t.id===d.originalRef||t.uid===d.originalRef))errors.push('提成须关联已有业务或月度档案');}
  }
  if(d.type==='税费缴纳'&&!TAX_FEES.includes(fee))errors.push('请选择有效税种');
 }
 return errors;
}
async function savePaymentDraft(){

  const draft=costClone(paymentDraft);draft.creator=activeRole;draft.updatedAt=costTime();

 }catch(e){toast('保存失败：'+e.message);}finally{paymentBusy=false;}

 if(a.schema!==3)return priorCostCheck(a,data);

 const messages=a.fee==='客户退款'?['客户退款按原收款和历史退款核对，不作为新增团采购成本。','原收款依据及退款金额须财务复核。']:a.paymentType==='员工薪酬'?['薪酬按项目、人员及所属期核对；实际支付不重复确认人工费用。']:a.paymentType==='税费缴纳'?['按税种、纳税主体及所属期缴纳；缴纳不自动增加当期费用。']:a.paymentType==='资金往来'?['按往来性质核对；本金、保证金及内部调拨不作为新增经营费用。']:['非团费用按部门、用途及所属期间核对，不要求团号。'];
 return {risk:false,messages,version:null,source:'分类规则',time:new Date().toISOString(),engine:'付款分类核对'};

function rcAccount(data,id){return data.receiptAccounts.find(a=>a.id===id);}

function rcCurrency(d,data){return rcAccount(data,d.accountId)?.currency||'';}
function rcCanRead(r){return rcFinance()||r.creator===activeRole;}
function rcSum(d){return (d.allocations||[]).reduce((n,a)=>n+rcCents(a.amount||0),0)/100;}
function rcRemaining(d){return rcAmount((+d.amount||0)-rcSum(d));}
function rcAllocationState(d){return !['客户团款','平台结算款','供应商退款'].includes(d.type)?'不适用':!rcSum(d)?'待分配':rcRemaining(d)>0?'部分分配':'已分配';}
function rcTrips(data,d){return data.trips.filter(t=>t.archiveKind!=='monthly'&&(d.type==='平台结算款'?['COTA','OVERSEAS'].includes(t.category)&&t.platform===d.platform&&t.product===d.product:true)).sort((a,b)=>(b.departureDate||'').localeCompare(a.departureDate||''));}
function rcTripLabel(t){return t.id+' · '+(t.name||t.dest||'')+' · '+(PAYMENT_BUSINESSES[t.category||'DZ']||'业务团档')+' · '+(t.departureDate||'')+' · '+(t.owner||t.dep||'');}
function rcPaid(data){return (data.paymentReceipts||[]).map(p=>{const a=data.apps.find(a=>a.id===p.applicationId);return a?.stage===4&&!a.special?{...p,application:a,currency:'CNY'}:null;}).filter(Boolean);}
function rcRefundTotal(data,id,exclude){return data.receipts.filter(r=>r.id!==exclude&&r.status==='confirmed'&&r.type==='供应商退款').reduce((n,r)=>n+r.allocations.filter(a=>a.ref===id).reduce((m,a)=>m+rcCents(a.amount),0),0)/100;}
function rcRefundOptions(data,d){return rcPaid(data).filter(p=>!p.internal&&(d.refundMode==='trip'?(p.application.tripUid||p.application.trip)===d.refundTrip||tripReference(costTrip(data,p.application.tripUid||p.application.trip))===d.refundTrip:!costTrip(data,p.application.tripUid||p.application.trip)));}
function rcPaidLabel(p,data,d){return p.applicationId+' · '+(p.application.vendor||p.application.payee||'')+' · '+p.date+' · 实付 '+money(p.amount)+' · 剩余可退 '+money(p.amount-rcRefundTotal(data,p.id,d.id));}
function rcTripReceived(data,ref){return rcAmount(data.receipts.filter(r=>r.status==='confirmed'&&['客户团款','平台结算款'].includes(r.type)).reduce((s,r)=>s+r.allocations.filter(a=>a.ref===ref).reduce((n,a)=>n+(+a.amount||0),0),0)+data.receiptOffsets.filter(o=>o.status==='active'&&o.tripRef===ref).reduce((s,o)=>s+o.amount,0));}
function rcWalletBalance(data,id,exclude){const w=data.customerWallets.find(w=>w.id===id);return rcAmount((w?.opening||0)+data.receipts.filter(r=>r.id!==exclude&&r.status==='confirmed'&&r.type==='客户预存款'&&r.walletId===id).reduce((n,r)=>n+(+r.amount),0)-data.receiptOffsets.filter(o=>o.status==='active'&&o.walletId===id).reduce((n,o)=>n+o.amount,0));}
function rcFundingUsed(data,id){return data.receiptOffsets.filter(o=>o.status==='active').some(o=>o.funding?.some(f=>f.receiptId===id));}
function rcDuplicate(data,d){return data.receipts.filter(r=>r.id!==d.id&&r.status!=='cancelled'&&r.status!=='draft'&&r.accountId===d.accountId&&r.date===d.date&&rcCents(r.amount)===rcCents(d.amount)&&r.payer.trim()===d.payer.trim());}

 const e=[],account=rcAccount(data,d.accountId),currency=account?.currency;
 if(!RECEIPT_TYPES.includes(d.type))e.push('请选择收款类型');if(!account)e.push('请选择公司收款账户');

 if(d.type==='客户预存款'){const w=data.customerWallets.find(w=>w.id===d.walletId&&w.customerId===d.customerId);if(!w)e.push('请选择客户及其预存钱包');else if(w.currency!==currency)e.push('钱包与到账币种须一致');}

function rcEffects(data,r){if(r?.status!=='confirmed')return {};const out={[r.accountId]:rcCents(r.amount)};

function rcApply(data,before,after){const a=rcEffects(data,before),b=rcEffects(data,after);for(const id of new Set([...Object.keys(a),...Object.keys(b)])){const delta=(b[id]||0)-(a[id]||0);if(!delta)continue;if(id==='bank')data.balance=(rcCents(data.balance)+delta)/100;else{const account=rcAccount(data,id);if(!account)throw Error('账户不存在，请刷新');account.balance=(rcCents(account.balance)+delta)/100;}}

function rcSnapshot(d,data){const account=rcAccount(data,d.accountId);return {...costClone(d),amount:+d.amount,company:account?.company||'',currency:account?.currency||'',accountName:account?.name||'',allocations:d.allocations.map(a=>{const t=costTrip(data,a.ref),p=rcPaid(data).find(p=>p.id===a.ref);return {...a,amount:+a.amount,owner:t?.owner||(t?.dep?'部门:'+t.dep:'')||p?.application.owner||'',label:t?rcTripLabel(t):p?rcPaidLabel(p,data,d):a.ref};})};}
function rcCommit(data,d,action){
 rcMigrate(data);if(!rcCreate())throw Error('当前角色无收款登记权限');const old=data.receipts.find(r=>r.id===d.id),before=old&&costClone(old);
 if(old&&old.version!==d.version)throw Error('记录已被其他页面更新，请重新打开');

 if(action==='correct'){if(!rcFinance()||old?.status!=='confirmed')throw Error('仅财务可更正已确认记录');if(!d.changeReason.trim())throw Error('请填写更正原因');if(old.type!==d.type)throw Error('更正不切换收款类型；请按业务原因另行处理');}
 else if(old&&(!['draft','returned'].includes(old.status)||old.creator!==activeRole))throw Error('记录状态已变化或无编辑权限');
 if(old?.status==='confirmed'){const refunds=data.apps.filter(a=>a.originalRef===old.id&&a.fee==='客户退款'&&!a.special);for(const ref of new Set(refunds.map(a=>a.tripUid))){const used=refunds.filter(a=>a.tripUid===ref).reduce((n,a)=>n+rcCents(a.amountCNY??a.amount),0),assigned=d.allocations.filter(a=>a.ref===ref).reduce((n,a)=>n+rcCents(a.amount),0);if(assigned<used)throw Error('该收款已有客户退款占用，请先处理关联退款再更正分配');}}
 if(old?.status==='confirmed'&&old.type==='客户预存款'&&rcFundingUsed(data,old.id)&&(old.walletId!==d.walletId||rcCents(old.amount)!==rcCents(d.amount)))throw Error('该充值已被消费，请先处理相应抵扣再调整充值');

 next.history=costClone(old?.history||[]);next.history.push({time:costTime(),actor:activeRole,action:action==='correct'?'更正已确认收款':action==='draft'?'保存草稿':confirmed?'登记并确认到账':'提交财务确认',reason:d.changeReason||d.reviewNote||'',before:before?{...before,history:undefined}:null});

function rcOffset(data,walletId,tripRef,amount,reason){rcMigrate(data);if(!rcFinance())throw Error('请切换财务角色执行抵扣');const w=data.customerWallets.find(w=>w.id===walletId),t=costTrip(data,tripRef);if(!w||!t||t.archiveKind==='monthly')throw Error('请选择钱包和已有独立团档');if(w.currency!==(t.currency||'CNY'))throw Error('钱包与团账币种须一致');if(!Number.isFinite(+amount)||+amount<=0||rcCents(amount)>rcCents(rcWalletBalance(data,w.id)))throw Error('抵扣金额无效或钱包余额不足');if(!reason.trim())throw Error('请填写抵扣说明');

function rcReverseOffset(data,id,reason){if(!rcFinance()||!reason.trim())throw Error('请财务填写撤销抵扣原因');const o=data.receiptOffsets.find(o=>o.id===id&&o.status==='active');if(!o)throw Error('抵扣已处理');o.status='reversed';o.reversal={actor:activeRole,at:costTime(),reason};const w=data.customerWallets.find(w=>w.id===o.walletId);w.balance=rcWalletBalance(data,w.id);costAudit(data,id+' 撤销抵扣（恢复钱包，不产生到账）');}
// Form and page state
function rcReleaseUrls(){receiptUrls.forEach(URL.revokeObjectURL);receiptUrls=[];}
function rcStart(){receiptWalletEditor=false;rcReleaseUrls();receiptDraft=rcNew();receiptFiles=[];receiptEditKind='';receiptMode='form';receiptTab='records';go('收款申请');}
function rcEdit(id,kind=''){receiptWalletEditor=false;const r=db.receipts.find(r=>r.id===id);if(!r||!rcCanRead(r))return toast('无查看权限');if(kind==='correct'&&!rcFinance())return;rcReleaseUrls();receiptDraft=costClone(r);receiptDraft.changeReason='';receiptFiles=[];receiptEditKind=kind;receiptMode='form';render();}
function rcList(){receiptWalletEditor=false;receiptMode='list';receiptSelected=null;receiptFiles=[];rcReleaseUrls();render();}
function rcSelect(id){receiptSelected=id;receiptMode='detail';render();}
function rcField(k,v,redraw=false){receiptDraft[k]=v;if(['type','business','platform','product','refundMode','refundTrip'].includes(k))receiptDraft.allocations=[];

 if(k==='platform')receiptDraft.product='';if(k==='customerId')receiptDraft.walletId='';if(k==='transferType'){receiptDraft.originalRef='';receiptDraft.sourceAccount='';}
 if(k==='amount'&&receiptDraft.type==='客户团款'&&receiptDraft.allocations.length===1)receiptDraft.allocations[0].amount=v;
 if(redraw)render();else rcRefreshSummary();

function rcOptions(entries,value,placeholder='请选择'){return '<option value="">'+placeholder+'</option>'+entries.map(([v,t])=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(t)}</option>`).join('');}
function rcInput(k,label,type='text',hint=''){return `<label>${label}<input id="r-${k}" type="${type}" value="${esc(receiptDraft[k]||'')}" ${type==='number'?'min="0" step="0.01"':''} oninput="rcField('${k}',this.value)">${hint?'<small class="note">'+hint+'</small>':''}</label>`;}
function rcSelectField(k,label,entries){return `<label>${label}<select id="r-${k}" onchange="rcField('${k}',this.value,true)">${rcOptions(entries,receiptDraft[k])}</select></label>`;}
function rcAddAllocation(ref){if(!ref||receiptDraft.allocations.some(a=>a.ref===ref))return;const first=receiptDraft.allocations.length===0;receiptDraft.allocations.push({ref,amount:first&&receiptDraft.type==='客户团款'?receiptDraft.amount:'',stage:receiptDraft.type==='客户团款'?'定金':''});render();}
function rcRemoveAllocation(i){receiptDraft.allocations.splice(i,1);render();}
function rcRefreshSummary(){const el=payRead('r-summary');if(el)el.innerHTML=rcSummary(receiptDraft);const risk=payRead('r-risk');if(risk)risk.innerHTML=rcRisks(db,receiptDraft).map(x=>'<p class="banner">'+esc(x)+'</p>').join('');}
function rcSummary(d){return `<b>实际到账 ${money(d.amount||0)}</b>　已分配 ${money(rcSum(d))}　<span class="${rcRemaining(d)<0?'risk':''}">待分配 ${money(rcRemaining(d))}</span><p class="note">${rcCurrency(d,db)||'请选择账户'} · ${rcAllocationState(d)} · 补充分配不会再次增加账户余额。</p>`;}
function rcAllocationFields(){const d=receiptDraft,isRefund=d.type==='供应商退款',items=isRefund?rcRefundOptions(db,d).map(p=>[p.id,rcPaidLabel(p,db,d)]):rcTrips(db,d).map(t=>[tripReference(t),rcTripLabel(t)]);
 return `<section class="wide receipt-section"><div class="panelhead"><h3>${isRefund?'关联原实际付款':'团档分配'}</h3><span class="tag">可多选，逐项分配</span></div>
 <label>${isRefund?'历史已付款记录':'搜索已有团号'}<select id="r-add" onchange="rcAddAllocation(this.value)">${rcOptions(items.filter(([ref])=>!d.allocations.some(a=>a.ref===ref)),'',isRefund?'选择原付款后添加':'选择团号后添加')}</select></label>
 ${!items.length?'<p class="note">'+(isRefund?'该范围暂无已实际付款记录，请先选择团号或切换非团付款退款。':'暂无匹配团档，请先完成建档；平台候选不限出行月份。')+'</p>':''}
 <div class="cost-table"><table><thead><tr><th>${isRefund?'原付款与历史退款':'团号／归属／出行日期'}</th><th>本次分配金额</th>${d.type==='客户团款'?'<th>收款阶段</th>':''}<th></th></tr></thead><tbody>${d.allocations.map((a,i)=>{const t=costTrip(db,a.ref),p=rcPaid(db).find(p=>p.id===a.ref);return `<tr><td>${esc(t?rcTripLabel(t):p?rcPaidLabel(p,db,d):a.ref)}${p?'<small>费用：'+esc(p.application.fee||'')+' · 历史退款 '+money(rcRefundTotal(db,p.id,d.id))+'</small>':''}</td><td><input aria-label="第${i+1}项分配金额" id="r-alloc-${i}" type="number" min="0" step="0.01" value="${esc(a.amount)}" oninput="receiptDraft.allocations[${i}].amount=this.value;rcRefreshSummary()"></td>${d.type==='客户团款'?'<td><label>收款阶段<select id="r-stage-'+i+'" onchange="receiptDraft.allocations['+i+'].stage=this.value">'+rcOptions(payNamed(RECEIPT_STAGES),a.stage)+'</select></label></td>':''}<td><button class="alt" type="button" onclick="rcRemoveAllocation(${i})">移除</button></td></tr>`;}).join('')}</tbody></table></div><div id="r-summary" class="cost-overview">${rcSummary(d)}</div></section>`;
}
async function rcChooseFiles(files){if(receiptUploadBusy)return;receiptUploadBusy=true;try{const accepted=[...files];if(accepted.some(f=>!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10*1024*1024))throw Error('演示版支持PNG、JPEG、WebP图片，单张不超过10MB');for(const file of accepted){const key='receipt:'+costUid();await tripAttachment('readwrite',s=>s.put(file,key));receiptDraft.attachments.push({key,name:file.name,size:file.size});}render();}catch(e){toast('上传失败：'+e.message);}finally{receiptUploadBusy=false;}}
function rcRemoveImage(i){receiptDraft.attachments.splice(i,1);render();}
async function rcPreviewImages(){for(const a of receiptDraft.attachments){const el=payRead('preview-'+a.key);if(!el)continue;try{const file=await tripAttachment('readonly',s=>s.get(a.key));if(file&&el.isConnected){const u=URL.createObjectURL(file);receiptUrls.push(u);el.src=u;}else if(el.isConnected)el.alt='当前浏览器缺少附件，请重新上传';}catch{if(el.isConnected)el.alt='读取失败，请重试';}}}
async function rcViewImage(key,name){try{const file=await tripAttachment('readonly',s=>s.get(key));if(!file)return toast('当前浏览器没有该图片，请重新上传');const el=payRead('r-image-view');if(el){const url=URL.createObjectURL(file);receiptUrls.push(url);el.innerHTML='<p>'+esc(name)+'</p><img alt="到账凭证放大预览" src="'+esc(url)+'">';el.scrollIntoView({block:'nearest'});}}catch(e){toast(e.message);}}
function rcForm(){const d=receiptDraft,acc=rcAccount(db,d.accountId),platforms={...TRIP_PLATFORMS,...OVERSEAS_PLATFORMS},products=OVERSEAS_PLATFORMS[d.platform]?OVERSEAS_PRODUCTS:TRIP_PRODUCTS,correct=receiptEditKind==='correct';
 return `<div class="panel"><div class="panelhead"><div><h3>${correct?'更正已确认收款':'新建收款申请'}</h3><p class="note">一笔到账只登记一次；支持多团分配。财务确认后计入模拟账表。</p></div><button class="alt" onclick="rcList()">取消并退出</button></div>
 <form id="receiptForm" class="grid" novalidate onsubmit="rcSave(event,'${correct?'correct':'submit'}')">
 ${correct?'<label>收款类型<input disabled value="'+esc(d.type)+'"></label>':rcSelectField('type','收款类型 *',payNamed(RECEIPT_TYPES))}
 ${rcSelectField('accountId','公司收款账户 *',db.receiptAccounts.map(a=>[a.id,a.name+' · '+a.currency]))}<label>公司主体<input id="r-company" disabled value="${esc(acc?.company||'选择收款账户后自动带出')}"><small class="note">实际收款主体</small></label><label>币种<input id="r-currency" disabled value="${esc(acc?.currency||'自动带出')}"></label>
 ${rcInput('date','实际收款日期 *','date')}${rcInput('amount','实际到账金额 *','number')}${rcInput('payer','实际付款方名称 *')}
 ${['资金往来收款','客户预存款'].includes(d.type)?rcSelectField('owner','归属部门／项目 *',OWNER_ENTRIES):''}
 
 ${d.type==='平台结算款'?rcSelectField('platform','平台 *',Object.entries(platforms))+rcSelectField('product','业务项目 *',Object.entries(products))+rcInput('month','结算所属月份 *','month')+'<p class="wide banner">按实际到账登记，无需结算单号或平台扣款信息。可先确认到账，再由财务补充分配。</p>':''}
 ${d.type==='供应商退款'?rcSelectField('refundMode','退款关联方式 *',[['trip','团相关付款退款'],['other','非团付款退款']])+(d.refundMode==='trip'?rcSelectField('refundTrip','先选择对应团号 *',db.trips.filter(t=>t.archiveKind!=='monthly').map(t=>[tripReference(t),rcTripLabel(t)])):'')+rcInput('refundReason','退款原因 *'):''}
 ${['客户团款','平台结算款','供应商退款'].includes(d.type)?rcAllocationFields():''}
 ${d.type==='资金往来收款'?rcSelectField('transferType','往来类别 *',payNamed(RECEIPT_TRANSFERS))+rcInput('counterparty','往来对象 *')+(['收回借出款','收回押金／保证金','公司内部资金调入'].includes(d.transferType)?rcSelectField('originalRef','对应原实际付款记录 *',rcPaid(db).filter(p=>d.transferType==='公司内部资金调入'?p.internal:d.transferType==='收回借出款'?p.application.fee==='借出款':['平台保证金','押金及其他保证金'].includes(p.application.fee)).map(p=>[p.id,rcPaidLabel(p,db,d)])):['收到借款','收到投资款'].includes(d.transferType)?rcInput('originalRef','相关依据说明 *'):'')+(d.transferType==='公司内部资金调入'?rcSelectField('sourceAccount','公司转出账户 *',db.receiptAccounts.map(a=>[a.id,a.name]))+'<p class="wide note">配对原转出记录；仅同主体、同币种账户。未有转出记录时先完成付款流程。</p>':''):''}
 ${d.type==='客户预存款'?rcSelectField('customerId','客户 *',db.receiptCustomers.map(c=>[c.id,c.name]))+rcSelectField('walletId','客户预存钱包 *',db.customerWallets.filter(w=>w.customerId===d.customerId).map(w=>[w.id,w.name+' · '+w.currency]))+`<div class="wide actions"><button type="button" class="alt" onclick="receiptWalletEditor=!receiptWalletEditor;receiptWalletNotice='';render()">新建客户钱包</button><small class="note">仅客户预存款需要钱包；先建立0余额档案，财务确认充值后才增加余额。</small></div>${receiptWalletEditor?rcWalletEditorFields(true):''}`:''}
 <section class="wide receipt-section"><h3>到账凭证图片 *</h3><label>上传图片附件<input id="r-images" type="file" multiple accept="image/png,image/jpeg,image/webp" onchange="rcChooseFiles(this.files)"></label><p class="note">原型暂定PNG／JPEG／WebP，单张10MB；生产上限待确认。当前未接银行流水导入，请上传图片。</p><button class="alt" type="button" onclick="rcDemoImage()">生成虚构演示凭证（仅测试）</button><div class="receipt-images">${d.attachments.map((a,i)=>`<div><button type="button" class="image-button" onclick="rcViewImage('${a.key}',${esc(JSON.stringify(a.name))})"><img id="preview-${a.key}" alt="${esc(a.name)}"><span>${esc(a.name)}</span></button><button type="button" class="alt" onclick="rcRemoveImage(${i})">移除图片</button></div>`).join('')}</div><div id="r-image-view"></div></section>
 <label class="wide">${d.type==='资金往来收款'&&d.transferType==='其他往来收款'?'具体说明 *':'收款备注（选填）'}<textarea id="r-note" oninput="receiptDraft.note=this.value">${esc(d.note)}</textarea></label><div class="wide" id="r-risk">${rcRisks(db,d).map(x=>'<p class="banner">'+esc(x)+'</p>').join('')}</div>
 ${rcFinance()?'<label class="wide">财务风险核查说明（疑似重复／超额退款时必填）<textarea id="r-reviewNote" oninput="receiptDraft.reviewNote=this.value">'+esc(d.reviewNote||'')+'</textarea></label>':''}
 ${correct?'<label class="wide">更正原因 *<textarea id="r-changeReason" oninput="receiptDraft.changeReason=this.value">'+esc(d.changeReason||'')+'</textarea></label><p class="wide note">更正保留前后值和历史，不重复增加到账。原提报人保持不变。</p>':''}
 <div id="receiptError" class="wide" role="alert"></div><div class="wide actions"><button type="submit" ${receiptBusy?'disabled':''}>${correct?'保存更正':rcFinance()?'登记并确认到账':'提交财务确认'}</button>${!correct?'<button class="alt" type="button" onclick="rcSave(event,\'draft\')">保存草稿</button>':''}<button type="button" class="alt" onclick="rcList()">取消并退出</button></div></form></div>`;
}
async function rcSave(e,action){e?.preventDefault();if(receiptBusy||receiptUploadBusy)return toast('正在处理，请稍候');receiptBusy=true;try{if(action!=='draft')for(const a of receiptDraft.attachments)if(!await tripAttachment('readonly',s=>s.get(a.key)))throw Error('到账凭证缺失，请重新上传');const d=costClone(receiptDraft);let id;await costMutate(data=>{id=rcCommit(data,d,action);});receiptSelected=id;receiptMode='detail';rcReleaseUrls();render();toast(action==='draft'?'收款草稿已保存':action==='correct'?'收款已更正，历史已保留':rcFinance()?'确认到账成功':'已提交，等待财务确认');}catch(e){rcError(e);}finally{receiptBusy=false;}}
function rcError(e){const id='RC-ERR-'+Date.now();const el=payRead('receiptError');if(el)el.innerHTML='<p class="banner risk">'+esc(e.message)+'<small>错误标识 '+id+'；请修正后重试，或重新打开记录。</small></p>';toast(e.message);if(typeof diagnostic==='function')diagnostic('收款操作','失败','收款登记',id+' · '+e.message);}
async function rcAction(id,version,action){if(receiptBusy)return;receiptBusy=true;try{const reason=payVal('r-action-reason');if(action==='confirm'){const r=db.receipts.find(r=>r.id===id);for(const a of r?.attachments||[])if(!await tripAttachment('readonly',s=>s.get(a.key)))throw Error('到账凭证缺失，请退回重新上传');}await costMutate(data=>rcAct(data,id,version,action,reason));render();toast({confirm:'确认到账成功',return:'已退回修改',cancel:'已撤销并回退对应影响'}[action]);}catch(e){rcError(e);}finally{receiptBusy=false;}}
async function rcDeleteDraft(id,version){try{await costMutate(data=>{rcMigrate(data);const r=data.receipts.find(r=>r.id===id);if(!r||r.status!=='draft'||r.creator!==activeRole||r.version!==version)throw Error('草稿状态已变化或无删除权限');data.receipts=data.receipts.filter(r=>r.id!==id);costAudit(data,id+' 删除草稿');});rcList();}catch(e){rcError(e);}}
function rcDetail(r){if(!r||!rcCanRead(r))return '<div class="panel">请选择有权限查看的收款记录。</div>';const risks=rcRisks(db,r),editable=['draft','returned'].includes(r.status)&&r.creator===activeRole;
 return `<div class="panel"><div class="panelhead"><div><h3>${esc(r.id)}</h3><span class="tag">${RECEIPT_STATES[r.status]}</span> <span class="tag">${rcAllocationState(r)}</span></div><button class="alt" onclick="rcList()">返回收款记录</button></div><p><b>${esc(r.type)} · ${esc(r.currency||rcCurrency(r,db))} ${money(r.amount||0)}</b></p><p>付款方：${esc(r.payer)} · 实际到账：${esc(r.date)} · 归属：${esc(r.owner||'见分配明细')}</p><p>收款账户：${esc(r.accountName)} · 公司主体：${esc(r.company)} · 币种：${esc(r.currency)}</p>${r.platform?'<p>平台：'+esc(({...TRIP_PLATFORMS,...OVERSEAS_PLATFORMS})[r.platform])+' · 业务项目：'+esc((OVERSEAS_PLATFORMS[r.platform]?OVERSEAS_PRODUCTS:TRIP_PRODUCTS)[r.product])+' · 结算所属月份 '+esc(r.month)+'</p>':''}${r.transferType?'<p>往来类别：'+esc(r.transferType)+' · 对象：'+esc(r.counterparty)+' · 依据／原记录：'+esc(r.originalRef)+'</p>':''}${r.walletId?'<p>客户钱包：'+esc(db.customerWallets.find(w=>w.id===r.walletId)?.name)+'</p>':''}<p>备注／退款原因：${esc(r.note||r.refundReason||'—')}</p><p class="note">提报：${esc(r.creator)} · ${esc(r.createdAt)}<br>财务确认：${esc(r.confirmedBy||'尚未确认')} · ${esc(r.confirmedAt||'')}</p>
 ${['客户团款','平台结算款','供应商退款'].includes(r.type)?'<div class="cost-overview">'+rcSummary(r)+'</div><table><tr><th>关联对象</th><th>本次分配</th><th>阶段／归属</th></tr>'+r.allocations.map(a=>'<tr><td>'+esc(a.label||a.ref)+'</td><td>'+money(a.amount)+'</td><td>'+esc((a.stage||'')+' '+(a.owner||''))+'</td></tr>').join('')+'</table>':''}
 <h3>到账凭证</h3><div class="actions">${r.attachments.map(a=>`<button class="alt" onclick="rcViewImage('${a.key}',${esc(JSON.stringify(a.name))})">查看 ${esc(a.name)}</button>`).join('')||'<span class="note">草稿尚未上传</span>'}</div><div id="r-image-view"></div>
 ${risks.map(x=>'<p class="banner">'+esc(x)+'</p>').join('')}${r.reviewNote?'<p>财务核查说明：'+esc(r.reviewNote)+'</p>':''}${r.commissionReview?.length?'<p class="banner">需要复核提成批次：'+esc(r.commissionReview.join('、'))+'</p>':''}
 <div id="receiptError" role="alert"></div>${rcFinance()&&['pending','confirmed'].includes(r.status)?'<label>处理原因／风险核查说明<textarea id="r-action-reason" placeholder="退回、撤销，或风险确认时必填"></textarea></label>':''}<div class="actions">
 ${editable?`<button onclick="rcEdit('${r.id}')">${r.status==='returned'?'修改后重提':'继续填写'}</button>`:''}${r.status==='draft'&&r.creator===activeRole?`<button class="alt" onclick="rcDeleteDraft('${r.id}',${r.version})">删除草稿</button>`:''}
 ${rcFinance()&&r.status==='pending'?`<button onclick="rcAction('${r.id}',${r.version},'confirm')">确认到账</button><button class="alt" onclick="rcAction('${r.id}',${r.version},'return')">退回修改</button>`:''}
 ${rcFinance()&&r.status==='confirmed'?`<button onclick="rcEdit('${r.id}','correct')">${['客户团款','平台结算款'].includes(r.type)?'补充分配／更正':'更正收款'}</button><button class="alt" onclick="rcAction('${r.id}',${r.version},'cancel')">撤销收款</button>`:''}</div>
 <details><summary>操作轨迹与前后记录（${r.history.length}）</summary>${r.history.map(h=>'<div class="receipt-history"><b>'+esc(h.action)+'</b> · '+esc(h.actor)+' · '+esc(h.time)+'<p>'+esc(h.reason||'')+'</p>'+(h.before?'<details><summary>查看操作前快照</summary><pre>'+esc(JSON.stringify(h.before,null,2))+'</pre></details>':'')+'</div>').join('')}</details><p class="note">到账与分配已分别记录。确认不等于生成提成；图片和数据仅在当前浏览器保存。</p></div>`;
}
function rcRecords(){const rows=db.receipts.filter(rcCanRead).filter(r=>!receiptFilter||[r.id,r.payer,r.type,RECEIPT_STATES[r.status],rcAllocationState(r)].join(' ').includes(receiptFilter));
 return `<div class="panel"><div class="panelhead"><h3>收款记录</h3><span class="tag">${rows.length} 笔</span></div><label>搜索收款单／付款方／状态<input id="r-filter" value="${esc(receiptFilter)}" placeholder="输入关键字后按回车" onkeydown="if(event.key==='Enter'){receiptFilter=this.value;render()}"></label>${!rows.length?'<p class="note">暂无匹配记录。可新建收款，或切换财务角色核实到账。</p>':'<div class="cost-table"><table><tr><th>收款单／类型</th><th>到账日期／付款方</th><th>账户／金额</th><th>到账与分配状态</th><th></th></tr>'+rows.map(r=>`<tr><td>${esc(r.id)}<small>${esc(r.type)}</small></td><td>${esc(r.date)}<small>${esc(r.payer)}</small></td><td>${esc(r.accountName||'未选账户')}<small>${esc(r.currency||'')} ${money(r.amount||0)}</small></td><td><span class="tag">${RECEIPT_STATES[r.status]}</span><small>${rcAllocationState(r)}${['客户团款','平台结算款','供应商退款'].includes(r.type)?' · 待分配 '+money(rcRemaining(r)):''}</small></td><td><button class="alt" onclick="rcSelect('${r.id}')">查看收款</button></td></tr>`).join('')+'</table></div>'}</div>`;
}
function rcAccountsPanel(){if(!rcFinance())return '';return `<div class="cards">${db.receiptAccounts.map(a=>`<div class="card"><span class="muted">${esc(a.name)}</span><div class="num">${money(rcBalance(db,a.id))}</div><small>${esc(a.company+' · '+a.currency)}</small></div>`).join('')}</div><div class="panel"><h3>团收款与供应商退款汇总</h3><div class="cost-table"><table><tr><th>团号</th><th>已确认团款／抵扣</th><th>已付（人民币）</th><th>供应商已退</th><th>净支出</th></tr>${db.trips.map(t=>{const ref=tripReference(t),paid=rcPaid(db).filter(p=>p.application.tripUid===ref||p.application.trip===t.id),total=paid.reduce((n,p)=>n+p.amount,0),refund=paid.reduce((n,p)=>n+rcRefundTotal(db,p.id),0);return '<tr><td>'+esc(t.id)+'</td><td>'+money(rcTripReceived(db,ref))+'</td><td>'+money(total)+'</td><td>'+money(refund)+'</td><td>'+money(total-refund)+'</td></tr>';}).join('')}</table></div><p class="note">团款为业务管理口径，不是会计收入确认。供应商退款不改预算。尚未接生产提成批次；后续更正会标记受影响批次。</p></div>`;}
function rcWalletPage(){if(!rcCreate())return '<div class="panel">请切换操作、销售或财务角色。</div>';return `<div class="panel"><h3>客户与预存钱包</h3><p class="note">创建空钱包不产生资金；充值由收款确认增加，抵扣由财务操作，不新增实际到账。</p>${rcWalletEditorFields(false)}<table><tr><th>钱包</th><th>客户／币种</th><th>余额</th></tr>${db.customerWallets.map(w=>'<tr><td>'+esc(w.name)+'</td><td>'+esc(db.receiptCustomers.find(c=>c.id===w.customerId)?.name)+' · '+esc(w.currency)+'</td><td>'+money(rcWalletBalance(db,w.id))+'</td></tr>').join('')}</table></div>

const receiptPriorRender=render;
render=function(){rcMigrate(db);const requested=page;if(page==='收款申请'||page==='平台结算核对'){page='概览';receiptPriorRender();page=requested;payRead('title').textContent=page==='平台结算核对'?'历史平台结算核对':'收款申请';payRead('app').innerHTML=page==='平台结算核对'?'<div class="panel"><h3>历史平台结算核对</h3><p>新版平台结算款已纳入收款申请，直接按实际到账登记。旧记录仅供查阅，不自动转成到账，避免重复入账。</p><button onclick="go(\'收款申请\')">前往收款申请</button><pre>'+esc(JSON.stringify(db.settlements||[],null,2))+'</pre></div>':rcPage();if(receiptMode==='form'&&page==='收款申请')rcPreviewImages();}else receiptPriorRender();

 if(page==='概览'){const p=document.createElement('div');p.className='panel';p.innerHTML='<h3>收款流程已开放</h3><p class="note">客户团款、平台结算、供应商退款、资金往来和客户预存；平台只记实际到账，不填扣款信息。</p><button onclick="rcStart()">发起收款申请</button>';payRead('app').append(p);}
 if(page==='审批与付款'&&selected){const a=db.apps.find(a=>a.id===selected);const paid=rcPaid(db).filter(p=>p.applicationId===selected);if(paid.length){const p=document.createElement('div');p.className='panel';p.innerHTML='<h3>关联供应商退款</h3>'+paid.map(x=>'<p>原实付 '+money(x.amount)+' · 已退 '+money(rcRefundTotal(db,x.id))+' · 剩余可退 '+money(x.amount-rcRefundTotal(db,x.id))+'</p>'+db.receipts.filter(r=>r.status==='confirmed'&&r.type==='供应商退款'&&r.allocations.some(a=>a.ref===x.id)&&rcCanRead(r)).map(r=>`<button class="alt" onclick="receiptSelected='${r.id}';receiptMode='detail';go('收款申请')">查看退款 ${esc(r.id)}</button>`).join('')).join('');payRead('app').append(p);}}
};

 const rows=db.receipts.filter(r=>r.status==='confirmed'&&['客户团款','平台结算款'].includes(r.type)&&r.allocations.some(a=>a.ref===d.tripRef));

 }return html;};

const rcPriorPaymentValidate=paymentValidate;
paymentValidate=function(d,data){const errors=rcPriorPaymentValidate(d,data);if(d.type==='业务付款'&&d.fee==='客户退款'){
 const r=data.receipts?.find(r=>r.id===d.originalRef&&r.status==='confirmed'&&['客户团款','平台结算款'].includes(r.type));if(!r||!r.allocations.some(a=>a.ref===d.tripRef))errors.push('请选择对应团档的已确认收款');else{const amount=r.allocations.filter(a=>a.ref===d.tripRef).reduce((n,a)=>n+a.amount,0);if(r.currency!=='CNY'||d.currency!=='CNY')errors.push('跨币种客户退款须另行确定折算口径');if(rcCents(amount)!==rcCents(d.originalAmount))errors.push('原收款金额已变化，请重新选择');}
 }return [...new Set(errors)];};

</script><script>/* Payment execution, invoice follow-up and commission settlement. Browser-local prototype. */
const ST_STATUS={review:'待负责人核对',supervisor:'待主管确认',approved:'已审核',dirty:'待重新核对',objection:'有异议',transferred:'已转工资'};
const stFinance=()=>rcFinance(),stName=()=>activeRole.split(' / ').slice(1).join(' / '),stMonth=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'}).slice(0,7);
let stTripRef='',stSheetId='',stTab='pool',stSelectedMonth=stMonth(),stBusy=false,stDraft=null,stProof=null;
function stAssert(test,message){if(!test)throw Error(message);}
function stMigrate(data){
 costMigrate(data);rcMigrate(data);data.invoiceRecords??=[];data.invoiceTasks??=[];data.commissionSheets??=[];data.payrollBatches??=[];data.staff??=[{id:'EMP-001',name:'示例销售员',role:'销售'},{id:'EMP-002',name:'江婧婕',role:'操作'},{id:'EMP-003',name:'示例操作员',role:'操作'},{id:'EMP-004',name:'示例协作员',role:'操作'}];
 for(const a of data.apps){a.executionVersion??=0;a.history??=[];if(a.stage===4&&!a.special&&!data.paymentReceipts.some(p=>p.applicationId===a.id)){data.paymentReceipts.push({id:'LEGACY-EXEC-'+a.id,applicationId:a.id,amount:(a.amountCNY??a.amount),source:'bank',accountName:a.account||'历史付款账户（待核对）',date:a.paydate||'',internal:a.fee==='内部资金调拨',debitApplied:true,migrated:true});}}
 return data;
}
function stApp(data,id){return data.apps.find(a=>a.id===id);}
function stRef(data,a){const t=costTrip(data,a.tripUid||a.trip);return t?tripReference(t):'';}
function stGross(data,a){return data.paymentReceipts.filter(p=>p.applicationId===a.id).reduce((n,p)=>n+payCents(p.amount),0);}
function stRefund(data,a){return data.paymentReceipts.filter(p=>p.applicationId===a.id).reduce((n,p)=>n+payCents(rcRefundTotal(data,p.id)),0);}
function stNet(data,a){return stGross(data,a)-stRefund(data,a);}
function stLimit(a){return payCents(a.amountCNY??a.amount);}
function stRemaining(data,a){return Math.max(0,stLimit(a)-stNet(data,a));}
function stPaymentState(data,a){return a.paymentClosed?'已关闭':stRemaining(data,a)===0?'付款完成':stNet(data,a)>0?'部分付款':'待付款';}
function stSyncPayments(data){for(const a of data.apps)if(a.stage>=3&&!a.special)a.stage=stRemaining(data,a)===0?4:3;}
rcPaid=function(data){return (data.paymentReceipts||[]).map(p=>{const a=stApp(data,p.applicationId);return a&&a.stage>=3&&!a.special?{...p,application:a,currency:'CNY'}:null;}).filter(Boolean);};
const stOldState=state;
state=function(a){return a.stage>=3&&!a.special?stPaymentState(db,a):stOldState(a);};
function stExecute(data,id,input){
 stMigrate(data);const a=stApp(data,id);stAssert(stFinance(),'仅财务可登记付款');stAssert(a&&a.stage>=3&&!a.special&&!a.paymentClosed,'申请未通过或剩余付款已关闭');
 stAssert(a.executionVersion===input.version,'付款记录已更新，请刷新，避免重复登记');stAssert(!data.paymentReceipts.some(p=>p.requestKey===input.requestKey),'本次登记已完成，请勿重复');
 const cents=payCents(input.amount);stAssert(Number.isFinite(cents)&&cents>0,'实际金额须大于0');stAssert(cents<=stRemaining(data,a),'超出原单剩余可付，请另提补充申请并审核');stAssert(/^\d{4}-\d{2}-\d{2}$/.test(input.date),'请填写实际付款日期');stAssert(input.proof?.key,'请上传水单或生成虚构演示水单');
 stAssert((a.currency||'CNY')==='CNY','本轮仅人民币执行；跨币种实际支付折算口径待确认');
 if(input.changed){stAssert(input.reason?.trim()&&input.payee?.trim()&&input.recipient?.trim(),'收款资料变化须财务核验，填写收款人、账号和原因');stAssert(input.verified,'请确认已核验更改后的收款资料');}
 if(a.fee==='内部资金调拨')stAssert([input.source,rcAccount(data,input.source)?.name].includes(a.sourceAccount),'请选择申请中的转出账户');
 const account=rcAccount(data,input.source);stAssert(account,'请选择有效公司付款账户');stAssert(account.currency==='CNY','仅人民币公司账户可登记');stAssert(payCents(rcBalance(data,input.source))>=cents,'模拟账户余额不足');
 if(input.source==='bank')data.balance=(payCents(data.balance)-cents)/100;else account.balance=(payCents(account.balance)-cents)/100;
 const record={id:'FKJL-'+costUid(),applicationId:id,amount:cents/100,source:input.source,accountName:account.name,date:input.date,proof:costClone(input.proof),internal:a.fee==='内部资金调拨',debitApplied:true,requestKey:input.requestKey,at:costTime(),actor:activeRole,receiptSnapshot:costClone(a.receiptSnapshot||{payee:a.payee,card:a.recipient}),recipientChange:input.changed?{payee:input.payee,recipient:input.recipient,reason:input.reason,verifiedBy:activeRole}:null};

 return `<div class="panel"><div class="panelhead"><h3>付款进度 · ${esc(stPaymentState(db,a))}</h3><span class="tag">申请单 ${esc(a.id)}</span></div><div class="st-metrics"><div>批准金额<strong>¥${money(stLimit(a)/100)}</strong></div><div>累计实付<strong>¥${money(stGross(db,a)/100)}</strong></div><div>已确认退回<strong>¥${money(stRefund(db,a)/100)}</strong></div><div>实际净支付<strong>¥${money(stNet(db,a)/100)}</strong></div><div>${a.paymentClosed?'已关闭剩余':'剩余待付'}<strong>¥${money(remaining)}</strong></div></div><p class="note">一张申请可分次登记成功付款。付款记录不是第二张申请；本团操作可以查看进度。超批准额度另提补充申请。</p>
 ${a.paymentClosed?'<p class="banner">关闭原因：'+esc(a.paymentClosed.reason)+'</p>':''}
 <div class="table-scroll"><table><tr><th>执行记录／日期</th><th>公司付款账户</th><th>实付／退回／净付</th><th>水单与核验</th></tr>${records.map(p=>`<tr><td>${esc(p.id)}<small>${esc(p.date)}</small></td><td>${esc(p.accountName||rcAccount(db,p.source)?.name||p.source)}</td><td>¥${money(p.amount)} / ${money(rcRefundTotal(db,p.id))} / ${money(p.amount-rcRefundTotal(db,p.id))}</td><td>${p.proof?`<button class="alt" onclick="downloadTripAttachment('${p.proof.key}')">${esc(p.proof.name)}</button>`:esc(a.slip||'历史记录未保存附件')}${p.recipientChange?'<small>财务已核验变更：'+esc(p.recipientChange.payee+' / '+p.recipientChange.recipient+'；'+p.recipientChange.reason)+'</small>':''}</td></tr>`).join('')||'<tr><td colspan="4">尚未登记成功付款</td></tr>'}</table></div>
 ${stFinance()&&remaining>0&&!a.paymentClosed?`<h3>登记一笔成功付款</h3><p class="note">请先在外部渠道付款成功，再回到此处登记。登记会模拟扣减账户余额；本轮仅人民币。</p><form class="grid" onsubmit="stSaveExecution(event,'${a.id}',${a.executionVersion},'${costUid()}')"><label>公司付款账户 *<select id="st-pay-source">${stOptions(db.receiptAccounts.map(x=>[x.id,x.name+' · 可用 '+money(rcBalance(db,x.id))]),'bank')}</select></label><label>实际付款日期 *<input id="st-pay-date" type="date" required></label><label>实际金额（CNY） *<input id="st-pay-amount" type="number" min="0.01" step="0.01" max="${remaining}" value="${remaining}" required></label>${stProofFields()}<details class="wide"><summary>实际收款资料有变化？财务核验后填写</summary>${stCheck('st-pay-changed','本次更改收款资料')}<div class="grid"><label>实际收款人<input id="st-payee"></label><label>实际收款账号／二维码识别<input id="st-recipient"></label><label class="wide">变更原因<input id="st-pay-reason"></label>${stCheck('st-pay-verified','已完成财务核验并保留原因')}</div></details><div class="actions wide"><button>登记成功付款</button></div></form>${stReason('st-close-reason')}<button class="alt" onclick="stAction(d=>stClosePayment(d,'${a.id}',${a.executionVersion},payVal('st-close-reason')))">关闭剩余应付</button>`:!stFinance()&&remaining>0?'<p class="note">由财务登记付款；本团操作可在此跟进。</p>':''}<div id="st-error" class="risk" role="alert"></div></div>`;
}
const stPriorDetail=newPaymentDetail;
newPaymentDetail=function(a){let html=stPriorDetail(a);if(a.stage>=3&&!a.special){html=html.replace(/<h3>财务执行（模拟）<\/h3>[\s\S]*?<\/form>/,'').replace(/<p>请切换财务角色执行付款。<\/p>/,'').replace(/<p class="tag">已付款 ·[\s\S]*?<\/p>/,'');html+=stExecutionPanel(a);}return html;};
pay=function(event,id){event.preventDefault();toast('请在下方“付款进度”中登记实际付款金额和水单');};
function stTourPage(){
 const t=costTrip(db,stTripRef),valid=t&&stTourCan(t);return `<div class="panel"><div class="panelhead"><div><h3>团进度与追票</h3><p class="note">行程完结只表示行程结束；付款、收款和财务结清分别管理。</p></div><button class="alt" onclick="go('团档案')">返回团档案</button></div><label>选择团档<select onchange="stTripRef=this.value;stProof=null;render()">${stTripOptions(stTripRef)}</select></label></div>${!valid?'<div class="panel empty">选择一个已有团档，查看付款、行程与追票进度。</div>':stTourDetail(t)}`;
}
function stTourDetail(t){const ref=tripReference(t),funds=stFunds(db,ref),apps=db.apps.filter(a=>stRef(db,a)===ref),groups=stInvoiceGroups(db,ref);return `<div class="panel"><div class="panelhead"><h3>${esc(t.id)} · ${t.completedAt?'行程已完结':'行程进行中'}</h3><span class="tag">财务结清另行核对</span></div><div class="st-metrics"><div>实际净团款<strong>¥${money(funds.income)}</strong></div><div>实际净支付成本<strong>¥${money(funds.expense)}</strong></div><div>当前利润<strong>¥${money(funds.profit)}</strong></div></div>${t.completedAt?'<p class="note">完结时间 '+esc(t.completedAt)+'；首次追票提醒已生成。提成由财务核对后按月推送。</p>':`<p class="banner">完结不会自动认定已收齐、已付清或发票已收齐。</p>${/^(操作|主管|总经理) \/ /.test(activeRole)&&[t.operatorA,t.operatorB].includes(stName())?`<button onclick="stAction(d=>stComplete(d,'${ref}'))">标记行程完结并生成首次追票</button>`:''}`}
 <h3>关联付款及进度</h3><div class="table-scroll"><table><tr><th>付款单／提报人</th><th>批准金额</th><th>实际净支付</th><th>剩余待付／状态</th><th></th></tr>${apps.map(a=>`<tr><td>${esc(a.id)}<small>${esc(a.creator)}</small></td><td>¥${money(stLimit(a)/100)}</td><td>¥${money(stNet(db,a)/100)}</td><td>${money(a.paymentClosed?0:stRemaining(db,a)/100)} · ${esc(state(a))}</td><td><button class="alt" onclick="selected='${a.id}';go('审批与付款')">付款记录／水单</button></td></tr>`).join('')||'<tr><td colspan="5">暂无付款申请</td></tr>'}</table></div></div>
 <div class="panel"><h3>追票汇总</h3><p class="note">同团按“供应商／开票单位＋对方收款账号”汇总；不同公司付款账户不拆组。金额基于净支付，不含客户退款。</p>${!t.completedAt?'<p class="note">行程完结后生成追票待办；当前可预览金额。</p>':''}${groups.map((g,i)=>`<details class="st-invoice"><summary>${esc(g.entity)} · 对方账号 ${esc(g.account)} <b>待追票 ¥${money(g.pending/100)}</b></summary><div class="st-metrics"><div>实付<strong>${money(g.gross/100)}</strong></div><div>退款<strong>${money(g.refund/100)}</strong></div><div>净付<strong>${money(g.net/100)}</strong></div><div>已匹配发票<strong>${money(g.invoiced/100)}</strong></div></div><p>责任分配：${Object.entries(g.owners).map(([o,n])=>esc(o)+'（本人净支付 '+money(n/100)+'）').join('；')}。上方待票为本组总额，不重复累加。</p>${g.invoiced>g.net?'<p class="banner">已匹配发票超过最新净支付，可能发生退款，请财务复核发票冲红。</p>':''}<table><tr><th>付款记录</th><th>付款账户</th><th>实付／退回</th></tr>${g.records.map(p=>`<tr><td>${esc(p.applicationId)}<small>${esc(p.id)} · ${esc(p.date)}</small></td><td>${esc(p.accountName||rcAccount(db,p.source)?.name||p.source)}</td><td>${money(p.amount)} / ${money(rcRefundTotal(db,p.id))}</td></tr>`).join('')}</table>${db.invoiceRecords.filter(x=>x.tripRef===ref&&x.groupKey===g.key).map(x=>`<p>发票 ¥${money(x.amount)} · ${esc(x.note)} <button class="alt" onclick="downloadTripAttachment('${x.proof.key}')">附件</button></p>`).join('')}${stFinance()&&t.completedAt&&g.pending?`<button class="alt" onclick="stInvoiceForm('${ref}','${encodeURIComponent(g.key).replaceAll("'",'%27')}',${g.pending/100})">登记发票匹配</button>`:''}</details>`).join('')||'<p class="note">暂无需要追票的实际付款。</p>'}<div id="st-invoice-form"></div><div id="st-error" role="alert" class="risk"></div></div>`;}
function stInvoiceForm(ref,key,amount){stProof=null;payRead('st-invoice-form').innerHTML=`<h3>登记本组发票</h3><form class="grid" onsubmit="stSaveInvoice(event,'${ref}','${key}')"><label>匹配金额<input id="st-invoice-amount" type="number" min="0.01" step="0.01" max="${amount}" value="${amount}" required></label><label>发票说明<input id="st-invoice-note" required></label>${stProofFields()}<div class="actions"><button>确认发票匹配</button><button type="button" class="alt" onclick="this.closest('form').remove()">取消</button></div></form>`;}
async function stSaveInvoice(e,ref,key){e.preventDefault();if(!stProof||!await tripAttachment('readonly',s=>s.get(stProof.key)))return toast('请上传发票附件');await stAction(d=>stInvoice(d,ref,decodeURIComponent(key),payVal('st-invoice-amount'),payVal('st-invoice-note'),stProof));stProof=null;}
function stOpenSheet(id){stSheetId=id;stDraft=null;stTab='detail';go('提成结算');}
function stCommissionPage(){
 const visible=db.commissionSheets.filter(stCanView),s=visible.find(s=>s.id===stSheetId);return `<div class="panel"><div class="panelhead"><div><h3>提成结算</h3><p class="note">财务推送 → 单一负责人核对 → 主管确认 → 财务月度汇总 → 转工资。</p></div>${stFinance()?'<button class="alt" onclick="stSeedDemo()">载入虚构结算演示团</button>':''}</div><div class="actions"><button class="${stTab==='pool'?'':'alt'}" onclick="stTab='pool';stDraft=null;render()">${stFinance()?'待结算池':'我的核对与提成'}</button>${stFinance()?'<button class="'+(stTab==='monthly'?'':'alt')+'" onclick="stTab=\'monthly\';render()">月度汇总与工资批次</button>':''}</div></div>${stTab==='detail'&&s?stSheetDetail(s):stTab==='monthly'&&stFinance()?stMonthlyPage():stPoolPage(visible)}<div id="st-error" role="alert" class="panel risk"></div>`;
}
function stPoolPage(visible){return `${stFinance()?`<div class="panel"><h3>已完结 · 待推送</h3><p class="note">由财务确认收付款满足本月结算条件后推送。缺发票不阻断；未收齐或未付清的团可暂缓。</p><label>推送所属月份<input id="st-generate-month" type="month" value="${stSelectedMonth}" onchange="stSelectedMonth=this.value"></label>${stCheck('st-generate-check','已检查本次所选团的收付款，确认可在本月结算')}<div class="table-scroll"><table><tr><th>团档／完结</th><th>净团款／净支付／利润</th><th>核对负责人</th><th></th></tr>${db.trips.filter(t=>t.completedAt&&!db.commissionSheets.some(s=>s.tripRef===tripReference(t))).map(t=>{const f=stFunds(db,tripReference(t));return `<tr><td>${esc(t.id)}<small>${esc(t.completedAt)}</small></td><td>${money(f.income)} / ${money(f.expense)} / ${money(f.profit)}</td><td>${esc(t.commissionReviewer||t.operatorA)}</td><td><button onclick="stAction(d=>stGenerate(d,'${tripReference(t)}',payVal('st-generate-month'),payRead('st-generate-check').checked))">生成并推送核对</button></td></tr>`;}).join('')||'<tr><td colspan="4">暂无待推送团档。操作先标记行程完结，或载入虚构演示团。</td></tr>'}</table></div></div>`:''}<div class="panel"><h3>${stFinance()?'结算单进度':'与我相关的结算单'}</h3><div class="table-scroll"><table><tr><th>团号／月份</th><th>负责人／主管</th><th>状态</th><th>${stFinance()?'分配合计':'与我相关金额'}</th><th></th></tr>${visible.map(s=>`<tr><td>${esc(s.tripName)}${s.kind==='adjustment'?' · 差额调整':''}<small>${esc(s.month)} · ${esc(s.id)}</small></td><td>${esc(s.reviewer)}<small>${esc(s.supervisor)}</small></td><td><span class="tag">${ST_STATUS[s.status]}</span>${s.adjustmentNeeded?'<small class="risk">需差额处理／异议复核</small>':''}</td><td>¥${money(stTotal(stCanManage(s)?s.rows:s.rows.filter(r=>r.employeeId===stPerson(db,stName()))))}</td><td><button class="alt" onclick="stOpenSheet('${s.id}')">查看／处理</button></td></tr>`).join('')||'<tr><td colspan="5">暂无结算单</td></tr>'}</table></div></div>`;}
function stDraftFor(s){if(!stDraft||stDraft.id!==s.id||stDraft.version!==s.version)stDraft={id:s.id,version:s.version,rows:costClone(s.rows)};return stDraft;}
function stSheetDetail(s){
 const manage=stCanManage(s),reviewer=s.reviewer===activeRole,edit=reviewer&&['review','dirty','approved','objection'].includes(s.status),rows=stDraftFor(s).rows,f=s.snapshot,showRows=manage?rows:rows.filter(r=>r.employeeId===stPerson(db,stName())),total=stTotal(s.rows);
 return `<div class="panel"><div class="panelhead"><h3>${esc(s.tripName)} · ${s.kind==='adjustment'?'差额调整单':'提成核对单'}</h3><span class="tag">${ST_STATUS[s.status]}</span></div><p class="note">${esc(s.id)} · 原所属月 ${esc(s.originalMonth)} · 本次结算月 ${esc(s.month)}</p><p>核对负责人 ${esc(s.reviewer)} · 主管 ${esc(s.supervisor)}</p>${s.status==='dirty'?'<p class="banner">收付款或人员数据已变化，必须重新计算并完成负责人及主管确认；当前保留上一快照。</p>':''}${s.status==='transferred'?'<p class="banner">原单已转工资批次，保留原始金额。后续变化通过差额调整进入后续批次。</p>':''}
 ${manage?`<div class="st-metrics"><div>净团款<strong>¥${money(f.income)}</strong></div><div>净支付成本<strong>¥${money(f.expense)}</strong></div><div>提成基数<strong>¥${money(f.profit)}</strong></div><div>本单分配<strong>¥${money(total)}</strong></div><div>分配后余额<strong>¥${money(f.profit-total)}</strong></div></div><p class="note">快照 ${esc(f.at)}；收入 ${money(f.receipt)} − 客户退款 ${money(f.customerRefund)}；支出 ${money(f.grossPaid)} − 供应商退款 ${money(f.supplierRefund)}。提成及额外奖励不重复扣入基数。</p><details><summary>查看快照来源单据</summary><p>收款：${f.receiptIds.map(esc).join('、')||'无'}</p><p>付款执行：${f.paymentIds.map(esc).join('、')||'无'}</p></details>`:'<p class="note">当前只展示你本人的提成；如有问题，可向核对负责人反馈异议。</p>'}
 <h3>${manage?'角色及分配':'我的提成'}</h3><div class="table-scroll"><table class="st-allocation"><tr><th>角色</th><th>员工</th><th>提成比例／额外金额</th><th>参与</th><th>金额</th></tr>${showRows.map(r=>{const i=rows.indexOf(r);return `<tr><td>${edit&&r.extra&&s.kind!=='adjustment'?`<input aria-label="额外角色" value="${esc(r.role)}" oninput="stDraft.rows[${i}].role=this.value">`:esc(r.role)+(r.extra?' · '+(s.kind==='adjustment'?'差额':'额外'): '')}</td><td>${edit?`<select aria-label="${esc(r.role)}员工" onchange="stDraft.rows[${i}].employeeId=this.value">${stEmployeeOptions(r.employeeId)}</select>`:esc(r.name||db.staff.find(e=>e.id===r.employeeId)?.name||'未指定')}</td><td>${edit?`<input aria-label="${esc(r.role)}${r.extra?'金额':'比例'}" type="number" step="0.01" ${s.kind==='adjustment'?'':'min="0"'} value="${r.extra?r.amount:r.rate}" oninput="stDraft.rows[${i}].${r.extra?'amount':'rate'}=Number(this.value);stPreviewAlloc()">${r.extra?'元':'%'}`:r.extra?'额外 ¥'+money(r.amount):r.rate+'%'}</td><td>${edit?`<label class="st-check"><input type="checkbox" ${r.inactive?'checked':''} onchange="stDraft.rows[${i}].inactive=this.checked;stPreviewAlloc()">不参与分配</label>`:r.inactive?'不参与分配':'参与'}</td><td id="st-row-${i}">¥${money(r.amount)}</td></tr>`;}).join('')}</table></div>
 ${edit?`<p id="st-preview-total" class="tag">预览分配合计 ¥${money(stTotal(rows))}</p><p class="note">默认销售10%、操作A 4.8%、操作B 3.6%；额外奖励另加，不从三类提成中扣除。每行先保留两位小数，再汇总。调整比例与额外金额会更新预览，提交后保存快照。</p>${s.kind!=='adjustment'?'<button class="alt" onclick="stDraft.rows.push({id:costUid(),role:\'额外分配角色\',employeeId:\'\',rate:0,extra:true,inactive:false,amount:0});render()">添加额外分配角色</button>':''}${stCheck('st-profit-ack','已核对利润及收付款快照')}${stCheck('st-allocation-ack','已核对人员、比例、额外金额及不参与分配情况')}`:''}
 ${manage?stReason():''}<div class="actions">${edit?`<button class="alt" onclick="stAction(d=>stRecheck(d,'${s.id}',${s.version},payVal('st-reason')))">重新计算并核对</button><button onclick="stSubmitSheet('${s.id}',${s.version})">确认并提交主管</button>`:''}${s.supervisor===activeRole&&s.status==='supervisor'?`<button onclick="stAction(d=>stApprove(d,'${s.id}',${s.version},'approve',payVal('st-reason')))">主管确认通过</button><button class="alt" onclick="stAction(d=>stApprove(d,'${s.id}',${s.version},'return',payVal('st-reason')))">退回负责人</button>`:''}${reviewer&&s.objections.some(o=>!o.resolved)?`<button class="alt" onclick="stAction(d=>stResolve(d,'${s.id}',${s.version},payVal('st-reason')))">记录异议处理结果</button>`:''}${stFinance()&&s.status==='transferred'&&s.kind!=='adjustment'?`<button class="alt" onclick="stAction(d=>stAdjustment(d,'${s.id}',${s.version},payVal('st-reason')))">发起后续月份差额调整</button>`:''}</div>
 ${stFinance()&&s.status!=='transferred'?`<div class="st-divider"><div class="grid"><label>调整核对负责人<select id="st-reviewer">${stEmployeeOptions(stPerson(db,s.reviewer.split(' / ')[1]))}</select></label><div class="actions"><button class="alt" onclick="stAction(d=>stSetReviewer(d,'${s.tripRef}',payVal('st-reviewer'),payVal('st-reason')))">更换负责人</button></div><label>延期至月份<input id="st-defer-month" type="month"></label><div class="actions"><button class="alt" onclick="stAction(d=>stDefer(d,'${s.id}',${s.version},payVal('st-defer-month'),payVal('st-reason')))">延期并保留原因</button><button class="alt" onclick="stRemind('${s.id}',${s.version})">提醒尚未核对人员</button></div></div></div>`:''}
 ${s.rows.some(r=>!r.inactive&&r.employeeId===stPerson(db,stName()))?`<div class="st-divider">${stReason('st-objection')}<button class="alt" onclick="stAction(d=>stObjection(d,'${s.id}',${s.version},payVal('st-objection')))">反馈提成异议</button></div>`:''}
 <h3>异议记录</h3>${s.objections.filter(o=>manage||o.employeeId===stPerson(db,stName())).map(o=>`<p>${esc(o.actor)} · ${esc(o.reason)} · ${o.resolved?'已处理：'+esc(o.resolution):'待处理'}</p>`).join('')||'<p class="note">暂无异议</p>'}${manage?'<h3>操作轨迹</h3>'+s.history.map(h=>'<div class="log">'+esc(h.at+' · '+h.actor+' · '+h.text)+'</div>').join(''):''}<button class="alt" onclick="stTab='pool';stDraft=null;render()">返回结算池</button></div>`;
}
function stSubmitSheet(id,v){const rows=costClone(stDraft.rows),reason=payVal('st-reason'),p=!!payRead('st-profit-ack')?.checked,a=!!payRead('st-allocation-ack')?.checked;stAction(d=>stEdit(d,id,v,rows,reason,p,a));}

function bzDeactivateForm(version,group='person'){const lists={person:db.biz.people.map(e=>[e.id,e.name+' · '+e.role]),account:db.receiptAccounts.map(e=>[e.id,e.name]),dictionary:db.biz.dictionary.map(e=>[e.key,e.name]),supplier:db.suppliers.map(e=>[e.id,e.name])};return `<details><summary>停用并保留历史（${esc(group)}）</summary><form class="grid" onsubmit="bzSaveDeactivate(event,'${group}',${version})">${bzSelect('cfg-stop-id','停用对象 *',lists[group])}${bzNote('cfg-handoff','未完成事项交接／处置说明 *')}${bzNote('cfg-stop-reason','停用原因 *')}<button class="alt">提交停用申请</button></form></details>`;}
function bzSaveConfig(e,kind,version){e.preventDefault();let value={};const form=e.currentTarget,val=k=>form.querySelector('[id="cfg-'+k+'"]')?.value||'';if(kind==='allocation')value={category:val('category'),from:val('from'),to:val('to'),historicalAck:!!form.querySelector('[id="cfg-historical"]')?.checked,rows:BZ_DEPS.map((dep,i)=>({dep,percent:Number(val('percent-'+i)||0)}))};if(kind==='person')value={id:val('id'),name:val('name'),role:val('role'),dep:val('dep'),from:val('from'),export:!!form.querySelector('[id="cfg-export"]')?.checked};if(kind==='scope')value={employeeId:val('person'),dep:val('dep'),platform:val('platform'),category:val('category'),product:val('product'),from:val('from')};if(kind==='account')value={id:val('id'),name:val('name'),company:val('company'),opening:val('opening'),date:val('date'),currency:'CNY'};if(kind==='rate')value={currency:val('currency'),rate:val('rate'),from:val('from')};if(kind==='dictionary')value={group:val('group'),code:val('code'),name:val('name'),parent:val('parent'),lon:val('lon'),lat:val('lat')};if(kind==='workflow')value={dep:val('dep'),reviewer:val('reviewer')};if(kind==='defaults')value={sales:+val('sales'),operatorA:+val('operatorA'),operatorB:+val('operatorB')};if(kind==='reminder')value={frequency:val('frequency'),hours:val('hours')};const reason=val('reason');bzRun(data=>bzSubmitConfig(data,kind,value,reason,version),'配置已提交，请在变更记录中确认');}

function bzTransfer(data,id,to,reason){bzMigrate(data);stAssert(bzAdmin(),'仅总经理／获授权管理员可转交');stAssert(to.startsWith('主管 / ')&&reason?.trim(),'选择新主管并填写交接原因');const r=data.biz.reviews.find(r=>r.id===id&&r.status==='supervisor')||data.costChanges.find(c=>c.id===id&&c.status==='pending')||data.apps.find(a=>a.id===id&&a.stage===0&&!a.special)||data.commissionSheets.find(s=>s.id===id&&s.status==='supervisor');stAssert(r,'该单不是待主管处理状态');const old=r.reviewer||r.supervisor;if(r.rows&&r.snapshot)r.supervisor=to;else r.reviewer=to;r.version=(r.version||0)+1;if(r.history)r.history.push(typeof r.history[0]==='string'?costTime()+' 转交 '+old+' → '+to+'：'+reason:{at:costTime(),actor:activeRole,text:'转交 '+old+' → '+to+'：'+reason});bzEvent(data,'审批转交',r.tripRef||r.tripUid||id,id+' '+old+' → '+to+'：'+reason);}

function bzVisibleLogs(data,query=''){bzMigrate(data);const technical=activeRole.startsWith('配置管理员 / '),dep=bzUserDep(data),mine=data.biz.events.filter(e=>bzGM()||stFinance()||bzManager()&&e.dep===dep||e.actor===activeRole||!!costTrip(data,e.ref)&&bzCanTrip(data,costTrip(data,e.ref)));const logs=technical?[]:mine;const tokens=query.toLowerCase().split(/\s+/).filter(Boolean);return logs.filter(e=>!tokens.length||tokens.some(q=>JSON.stringify(e).toLowerCase().includes(q))).slice(0,80);}
function bzLogPage(){const rows=bzVisibleLogs(db,bzLogQuery);return `<div class="bz-header"><div><span class="bz-eyebrow">AUDIT & DIAGNOSTICS</span><h3>日志查询与诊断</h3><p>按当前角色查询业务轨迹；机器人接入入口预留</p></div><span class="tag">本地规则检索 · 未接AI</span></div><div class="panel"><form onsubmit="event.preventDefault();bzLogQuery=payVal('bz-log-search');render()" class="bz-search"><input id="bz-log-search" value="${esc(bzLogQuery)}" placeholder="输入团号、核定单号、错误编号或关键词"><button>查询日志</button></form><div class="bz-chat"><p>可以问：某团为什么还没进入经营看板？或直接输入操作编号。</p><label>问题<input id="bz-question" placeholder="例如：查一下刚才核定失败的原因"></label><button class="alt" onclick="bzDiagnose()">查询并解释（演示）</button><div id="bz-log-answer">${bzLogAnswer}</div></div></div><div class="panel"><h3>权限范围内的业务记录 · ${rows.length}条</h3>${rows.map(e=>'<div class="log"><small>'+esc(e.at+' · '+e.id)+'</small><p>'+esc(e.type+' / '+e.ref)+'</p><p>'+esc(e.text)+'</p><small>'+esc(e.actor)+'</small></div>').join('')||'<p class="bz-hint">没有匹配记录，不能据此判断操作成功或失败。</p>'}</div>${bzGM()||activeRole.startsWith('配置管理员 / ')?'<div class="panel"><h3>前端异常诊断（维护视图）</h3>'+readDiagnostics().slice(0,20).map(e=>'<div class="log">'+esc(e.reference+' · '+e.action+' · '+e.result+' · '+e.stage)+'<p>'+esc(String(e.detail||'').replace(/\b\d{12,}\b/g,'[已隐藏账号]'))+'</p></div>').join('')+'</div>':''}`;}
function bzDiagnose(){const q=payVal('bz-question').trim();const trips=db.trips.filter(t=>bzCanTrip(db,t)&&q.includes(t.id));if(trips.length){const t=trips[0],r=bzLatest(db,tripReference(t)),pending=db.biz.reviews.find(r=>r.tripRef===tripReference(t)&&['supervisor','finance'].includes(r.status));bzLogAnswer='<div class="bz-alert"><b>'+esc(t.id)+'</b><p>'+(!t.completedAt?'尚未标记团结束，未确定经营月份。':!r?'本团尚无生效经营核定，不能计入已核定金额。':'当前已核定，归属 '+esc(r.month)+'；若看不到，请核对筛选月份及权限。')+(pending?'当前还有 '+BZ_STATES[pending.status]+' 的申请。':'')+'</p><p class="bz-hint">依据：团档及核定状态，非模型猜测。</p></div>';}
 else{const rows=bzVisibleLogs(db,q);bzLogAnswer=rows.length?'<div class="bz-alert">找到 '+rows.length+' 条授权记录。最新依据：'+esc(rows[0].id+' / '+rows[0].text)+'</div>':'<div class="bz-alert">没有找到足够的授权记录，无法确定原因。请提供错误编号或团号；此演示不连接后台AI和生产日志库。</div>';}

function bzExport(){const p=bzPerson(db);if(!p?.export)return toast('当前角色无导出权限');const dep=bzManager()?bzUserDep(db):bzFinance()?bzDepartment:'',q=bzQuery(db,bzMonth,dep);const rows=[['业绩月','团号','部门','业务收入','实际业务成本','业务毛利'],...q.records.map(r=>[r.month,r.tripName,r.dep,r.income,r.cost,r.gross])],cell=v=>'"'+String(v??'').replace(/^[=+\-@]/,"'$&").replaceAll('"','""')+'"',csv='\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='授权经营明细_'+bzMonth+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

</script><script>/* Department supervisor workspace, using the original business records. */

 if(r.group==='客户'){let x=data.receiptCustomers.find(x=>x.id===id);if(!x)data.receiptCustomers.push(x={id});Object.assign(x,{name:r.name,active:r.active});}
 if(r.group==='客户预存钱包'){let x=data.customerWallets.find(x=>x.id===id);if(!x)data.customerWallets.push(x={id,opening:0});Object.assign(x,{name:r.name,customerId:cfData(data).records.find(x=>x.id===r.customerId)?.sourceId||r.customerId,currency:r.currency,active:r.active});}
 if(r.group==='员工'){for(const role of r.roles){let p=data.biz.people.find(x=>x.name===r.name&&x.role===role);if(!p)data.biz.people.push(p={id:'EMP-'+costUid(),name:r.name,role});Object.assign(p,{dep:r.dep,active:r.active,projects:r.projects});if(['操作','销售'].includes(role)&&!data.staff.some(x=>x.id===p.id))data.staff.push({id:p.id,name:p.name,role});}for(const p of data.biz.people.filter(x=>x.name===r.name&&!r.roles.includes(x.role)))p.active=false;}
 if(r.group==='提成规则'&&r.active&&r.from<=stMonth())Object.assign(data.biz.defaults,{sales:+r.sales,operatorA:+r.operatorA,operatorB:+r.operatorB});
 if(r.group==='部门'&&r.manager){data.biz.supervisors[r.name]=r.manager;COST_SUPERVISORS[r.name]=r.manager;}

 if(['费用分类','平台','业务项目','目的地'].includes(r.group)){const group=r.group==='平台'?(r.scope==='海外'?'海外平台':'国内平台'):r.group;const key=group+'|'+r.code;let x=data.biz.dictionary.find(x=>x.key===key);if(!x)data.biz.dictionary.push(x={key});Object.assign(x,r,{group});bzApplyConfig(data);}
 if(r.group==='公司主体'&&r.active&&!COMPANY_OPTIONS.includes(r.name))COMPANY_OPTIONS.push(r.name);
}
function cfSubmit(data,r,reason,expected){stAssert(cfAllowed(),'请切换配置员维护');cfInit(data);stAssert(reason?.trim(),'请填写变更原因');const old=cfData(data).records.find(x=>x.id===r.id);stAssert((old?.rev||0)===expected,'此配置已更新，请刷新');cfValidate(data,r);stAssert(!cfData(data).changes.some(c=>c.record.id===r.id&&c.status==='pending'),'此项已有待确认修改');const before=old?costClone(old):null;if(cfConfirmRequired(r.group)){cfData(data).changes.unshift({id:'CC-'+costUid(),record:costClone(r),before,expected,reason,status:'pending',at:new Date().toISOString(),actor:activeRole});cfAudit(data,'提交待确认',r,before,r,reason);}else{cfApply(data,r);cfAudit(data,'已生效',r,before,r,reason);}}
function cfConfirm(data,id,approve,note){const c=cfData(data).changes.find(x=>x.id===id);stAssert(c?.status==='pending','此项已经处理');stAssert(cfAllowed(true,c.record.group),'当前身份没有确认权');stAssert(note?.trim(),'请填写确认或退回意见');stAssert((cfData(data).records.find(x=>x.id===c.record.id)?.rev||0)===c.expected,'配置已变化，请退回后重提');if(approve){cfValidate(data,c.record);cfApply(data,c.record);}Object.assign(c,{status:approve?'approved':'returned',confirmedBy:activeRole,note,confirmedAt:new Date().toISOString()});cfAudit(data,approve?'确认生效':'已退回',c.record,c.before,c.record,note);}
