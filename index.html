const KEY='xingjie-demo-v1',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{};db??={trips:[{id:'DZ-XJ-20261101',dep:'综合定制部',dest:'新疆',budget:20000,file:'示例成本报价表.xlsx'}],apps:[],logs:[],balance:100000,todos:[]};let page='概览',activeRole='操作 / 江婧婕',selected=null;

function render(){document.getElementById('title').textContent=page;document.getElementById('nav').innerHTML=['概览','团档案','申请付款','审批与付款','待办与记录'].map(x=>`<button class="${x===page?'active':''}" onclick="go('${x}')">${x}</button>`).join('');let html='';

if(page==='申请付款')html=`<div class="panel"><h3>团相关付款申请</h3>${!activeRole.startsWith('操作')?'<p class="risk">请切换到操作角色填写申请。</p>':`<form onsubmit="submitApp(event)" class="grid"><label>财务方向<input disabled value="付款"></label><label>关联方式<input disabled value="关联旅游团"></label><label class="wide">团号<select id="trip" required onchange="paymentCostOptions()">${db.trips.map(t=>`<option value="${esc(tripReference(t))}">${esc(t.id)}</option>`).join('')}</select></label><label>费用类别<input disabled value="定制团 · 从档案带出"></label><label class="wide">对应成本明细<select id="costItem" onchange="paymentCostPreview()"></select><div id="costHint" class="note"></div></label><label>用途 / 备注<textarea id="note" required placeholder="如：酒店30%预付款"></textarea></label><label>金额（人民币）<input id="amount" oninput="paymentCostPreview()" type="number" min="0.01" step="0.01" required></label><label>供应商<select id="vendor"><option>示例酒店 · 已准入</option><option>示例车队 · 已准入</option></select></label><label>对方收款方式<select disabled><option>银行转账</option></select></label><label>对方收款信息<input disabled value="供应商测试账户 · 尾号0001"><div class="note">模拟账号，不可用于真实付款。</div></label><label class="wide">付款依据<input type="file" id="basis"><span class="note"><input id="demoBasis" type="checkbox" style="width:auto"> 使用演示账单（模拟附件）</span></label><label class="risk">是否未收款先垫款<select id="advance" onchange="document.getElementById('cancelwrap').hidden=this.value!=='是'"><option>否</option><option>是</option></select></label><label id="cancelwrap" hidden class="risk">最晚取消时间<input type="datetime-local" id="cancel"></label><div id="paymentCheck" class="wide"></div><div class="wide"><button>提交付款审批</button></div></form>`}</div>`;

    field.closest('label').hidden = !visible;
    field.disabled = !visible;
    field.required = visible;
    if (!visible) field.value='';
  }
  updateTripPreview();
}
function tripBaseCode(category,destCode,date,platform,product) {
  if (!Object.hasOwn(TRIP_CATEGORIES,category) || !destCode || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  if (category==='COTA' && (!Object.hasOwn(TRIP_PLATFORMS,platform)||!Object.hasOwn(TRIP_PRODUCTS,product))) return '';
  const components = category==='COTA'?[category,platform,product]:[category,destCode];
  return [...components,date.replaceAll('-','')].join('-');
}
function nextTripCode(base,trips) {
  const used = new Set(trips.map(t=>t.id));
  if (!used.has(base)) return base;
  let index=1;
  while (used.has(base+'-'+String(index).padStart(2,'0'))) index++;
  return base+'-'+String(index).padStart(2,'0');
}
function currentTripBase() {
  return tripBaseCode(tripField('tripCategory').value,chosenDestination()?.code,tripField('date').value,tripField('tripPlatform').value,tripField('tripProduct').value);
}
function updateTripPreview() {
  const base=currentTripBase();
  tripField('tripPreview').textContent=base?nextTripCode(base,db.trips):'填完编号所需字段后显示';
}

async function tripAttachment(mode, action) {
  const dbHandle=await new Promise((resolve,reject)=>{
    let expired=false;
    const timer=setTimeout(()=>{expired=true;reject(new Error('成本附件存储连接超时，请关闭其他原型页面后重试'));},10000);
    const request=indexedDB.open('xingjie-trip-files',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('files');
    request.onsuccess=()=>{clearTimeout(timer);if(expired){request.result.close();return;}request.result.onversionchange=()=>request.result.close();resolve(request.result);};
    request.onerror=()=>{clearTimeout(timer);reject(request.error);};
    request.onblocked=()=>{clearTimeout(timer);expired=true;reject(new Error('成本附件存储被其他页面占用，请关闭其他原型页面后重试'));};
  });
  try {
    return await new Promise((resolve,reject)=>{
      const transaction=dbHandle.transaction('files',mode);
      const timer=setTimeout(()=>transaction.abort(),10000);
      const request=action(transaction.objectStore('files'));
      transaction.oncomplete=()=>{clearTimeout(timer);resolve(request.result);};
      transaction.onabort=()=>{clearTimeout(timer);reject(transaction.error||new Error('附件保存超时或已中止'));};
    });
  } finally { dbHandle.close(); }
}
async function downloadTripAttachment(uid) {
  try {
    const file=await tripAttachment('readonly',store=>store.get(uid));
    if (!file) return toast('当前浏览器没有该成本原文件');
    const url=URL.createObjectURL(file);
    const link=document.createElement('a');
    link.href=url;
    link.download=file.name;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  } catch { toast('成本原文件读取失败'); }
}

    tripFeedback('请补齐或修正：'+names.join('、'),'字段校验');

    destinationCode:destination.code, departureDate:date,
    sales:tripField('tripSales').value, operatorA:tripField('tripOperatorA').value, operatorB:tripField('tripOperatorB').value,
    budget:costTotal(), file:costDraft.filename, costConfirmed:true, costVersion:1,

  const button=tripField('tripSave');

  button.textContent='保存中…';
  let storedFile=false;
  try {
    tripFeedback('正在保存成本附件，请稍候…','保存附件',false);
    diagnostic('建团保存','进行中','保存附件');
    await tripAttachment('readwrite',store=>store.put(attachment,record.uid));
    storedFile=true;
    const commit=()=>{
      const latest=JSON.parse(localStorage.getItem(KEY)) || db;
      record.id=nextTripCode(base,latest.trips);
      const updated={...latest,trips:[...latest.trips,record],
        logs:[{t:'建立团档案 '+record.id,time:new Date().toLocaleString('zh-CN')},...latest.logs]};
      localStorage.setItem(KEY,JSON.stringify(updated));
      db=updated;
    };
    if (navigator.locks) await navigator.locks.request(KEY+'-business-write',{signal:AbortSignal.timeout(10000)},commit);
    else commit();
  } catch (error) {
    diagnostic('建团保存','失败','本地保存',error.name+': '+error.message);
    if (storedFile) await tripAttachment('readwrite',store=>store.delete(record.uid)).catch(()=>{});
    tripFeedback('保存失败：'+error.message+'。填写内容已保留，可在「待办与记录」导出诊断日志。','本地保存',false);
    return;
  } finally {
    tripSaving=false;
    button.disabled=false;
    button.textContent='保存并生成团号';
  }
  costDraft=emptyCostDraft();
  render();
  if (page==='团档案') showTripCosts(record.id);
  diagnostic('建团保存','成功','完成',record.id);
  tripFeedback('建团成功 · 团号：'+record.id+' · 成本合计 ¥'+money(record.budget),'完成',false);
  document.getElementById('tripFeedback')?.scrollIntoView({block:'center',behavior:'smooth'});
}

function matchCostText(value){return String(value??'').trim().replace(/\s+/g,'').toLowerCase();}
function sameCostContent(a,b){return matchCostText(a.name)===matchCostText(b.name)&&matchCostText(a.category)===matchCostText(b.category)&&Math.round(Number(a.amount)*100)===Math.round(Number(b.amount)*100);}
function ensureChangeMatches(){
 if(!costEditor)return;
 const old=costVersion(costTrip(db,costEditor.tripRef),costEditor.baseVersion)?.items||[];
 const incoming=costDraft.items.filter(x=>x.include);
 if(costEditor.mode==='online'){
  for(const x of incoming)if(x.originId===undefined){x.originId='new';x.matchConfirmed=true;}
  return;
 }
 const used=new Set(incoming.filter(x=>x.originId&&x.originId!=='new').map(x=>x.originId));
 // Unique one-to-one matches: full content first, then identity fields. Never use Excel row positions.
 const criteria=[(a,b)=>sameCostContent(a,b),(a,b)=>matchCostText(a.name)===matchCostText(b.name)&&matchCostText(a.category)===matchCostText(b.category),(a,b)=>!!matchCostText(a.name)&&matchCostText(a.name)===matchCostText(b.name)];
 for(const matches of criteria){
  const fresh=incoming.filter(x=>x.originId===undefined),available=old.filter(o=>!used.has(o.id));
  for(const x of fresh){
   const options=available.filter(o=>!used.has(o.id)&&matches(x,o));
   if(options.length===1&&fresh.filter(n=>n.originId===undefined&&matches(n,options[0])).length===1){x.originId=options[0].id;x.matchConfirmed=true;x.matchMethod='auto';used.add(x.originId);}
  }
 }
 for(const x of incoming){
  if(x.originId!==undefined)continue;
  const possible=old.filter(o=>!used.has(o.id)&&(matchCostText(o.name)===matchCostText(x.name)||(matchCostText(o.category)===matchCostText(x.category)&&Number(o.amount)===Number(x.amount))));
  x.originId=possible.length?'':'new';x.matchConfirmed=!possible.length;x.matchMethod=possible.length?'ambiguous':'new';
 }
}
function changeMappingHtml(){
 ensureChangeMatches();const old=costVersion(costTrip(db,costEditor.tripRef),costEditor.baseVersion).items;
 const included=costDraft.items.map((x,i)=>({x,i})).filter(({x})=>x.include);
 const unchanged=included.filter(({x})=>{const original=old.find(o=>o.id===x.originId);return original&&sameCostContent(x,original);});
 const review=included.filter(({x})=>{const original=old.find(o=>o.id===x.originId);return !original||!sameCostContent(x,original)||x.matchMethod==='manual'||!x.matchConfirmed;});
 const unresolved=included.filter(({x})=>!x.originId||!x.matchConfirmed).length;
 return `<h4>自动识别变更</h4><p class="note">${unchanged.length}条未变更明细已自动匹配，无需逐项勾选。下面仅列出新增、修改或有歧义的明细；完整新增、修改、删除对比见下方差异区。</p>${unresolved?`<p class="banner">有${unresolved}条对应关系无法确定，请选择原明细或标为新增。</p>`:''}${review.length?`<details ${unresolved?'open':''}><summary>${unresolved?'处理有歧义的对应关系':'调整变化明细的对应关系（可选）'} · ${review.length}条</summary><table><tr><th>新表变化明细</th><th>系统识别／可调整</th></tr>${review.map(({x,i})=>`<tr><td>${esc(x.category+' / '+x.name)} · ¥${money(x.amount)}</td><td><select aria-label="第${i+1}条对应关系" onchange="setChangeMatch(${i},this.value)"><option value="">请选择对应关系</option><option value="new" ${x.originId==='new'?'selected':''}>新增明细</option>${old.map(o=>`<option value="${esc(o.id)}" ${x.originId===o.id?'selected':''}>${esc(o.category+' / '+o.name)} · ¥${money(o.amount)}</option>`).join('')}</select></td></tr>`).join('')}</table></details>`:'<p class="note">未发现新增或修改的明细；如有删除，将在差异区显示。</p>'}`;
}
function setChangeMatch(i,value){costDraft.items[i].originId=value;costDraft.items[i].matchConfirmed=!!value;costDraft.items[i].matchMethod='manual';costDraft.confirmed=false;costEditor.mappingAck=false;renderCostRows();}
function confirmChangeMatch(i,value){costDraft.items[i].matchConfirmed=value;costDraft.confirmed=false;costEditor.mappingAck=false;renderCostRows();}

function mappingError(){
 ensureChangeMatches();const items=costDraft.items.filter(x=>x.include),ids=items.filter(x=>x.originId&&x.originId!=='new').map(x=>x.originId);
 if(items.some(x=>!x.originId||!x.matchConfirmed))return '请处理无法确定的新旧明细对应关系';

 ensureChangeMatches();const old=costVersion(costTrip(db,costEditor.tripRef),costEditor.baseVersion).items;

async function saveCostChange(submit){
 if(costActionBusy||!costEditor)return;
 const feedback=document.getElementById('changeFeedback');const fail=message=>{if(feedback)feedback.textContent=message;toast(message);};
 if(!costDraft.confirmed)return fail('请先核对并确认成本明细');
 const match=mappingError();if(match)return fail(match);
 if(costEditor.mode==='upload'&&!costEditor.mappingAck)return fail('请确认新旧对应关系及新增、删除差异');
 if(submit&&!costEditor.reason.trim())return fail('提交前请填写变更原因');
 const trip=costTrip(db,costEditor.tripRef),items=changeProposedItems();
 if(submit&&!costDiff(costVersion(trip,costEditor.baseVersion).items,items).length)return fail('成本明细没有变化，无需提交审批');
 if(submit&&!costReviewer(trip))return fail('本归属尚未配置成本审核主管，请联系配置人员');
 const savingEditor=costEditor;
 costActionBusy=true;
 try{
  let attachmentKey=costDraft.attachmentKey;
  if(costDraft.file){attachmentKey='change:'+costEditor.id+':'+costUid();await tripAttachment('readwrite',s=>s.put(costDraft.file,attachmentKey));}
  if(costEditor!==savingEditor)return;

  await costMutate(data=>{
   if(costEditor!==savingEditor)throw Error('已退出编辑，本次变更未提交');
   const t=costTrip(data,costEditor.tripRef);if(t.costVersion!==costEditor.baseVersion)throw Error('有效版本已变化，请重新发起变更');
   const pending=pendingCostChange(data,costEditor.tripRef);if(pending)throw Error('本团已有待审成本变更，请查看原申请');
   let c=data.costChanges.find(x=>x.id===costEditor.id);
   if(c&&(!['draft','returned','withdrawn'].includes(c.status)||c.creator!==activeRole))throw Error('申请状态已变化或无修改权限');
   if(!c){c={id:costEditor.id,tripRef:costEditor.tripRef,creator:activeRole,history:[]};data.costChanges.push(c);}
   Object.assign(c,{status:submit?'pending':'draft',baseVersion:costEditor.baseVersion,items:costClone(items),reason:costEditor.reason.trim(),file:costDraft.filename,sheet:costDraft.sheet,attachmentKey,reviewer:costReviewer(t),updatedAt:costTime()});
   if(submit)c.submittedAt=costTime();
   costRecord(c,submit?'提交主管审核':'保存草稿',c.reason);costAudit(data,c.id+' '+(submit?'成本变更待审':'保存成本草稿'));
  });
  selectedCostChange=costEditor.id;costEditor=null;costDraft=emptyCostDraft();render();toast(submit?'成本变更已提交，原有效版本继续生效':'草稿已保存');
 }catch(error){fail(error.message);diagnostic('成本变更','失败','提交',error.message);}finally{costActionBusy=false;}
}

async function withdrawCostChange(){
 if(costActionBusy)return;costActionBusy=true;
 try{await costMutate(data=>{const c=data.costChanges.find(x=>x.id===selectedCostChange);if(!c||c.status!=='pending'||c.creator!==activeRole)throw Error('申请已处理或无撤回权限');c.status='withdrawn';c.updatedAt=costTime();costRecord(c,'撤回成本变更');costAudit(data,c.id+' 已撤回，原成本继续有效');});render();toast('已撤回，可修改后重新提交');}catch(e){toast(e.message);}finally{costActionBusy=false;}

async function reviewCostChange(result){
 if(costActionBusy)return;
 const opinion=document.getElementById('costReviewOpinion')?.value.trim()||'',ack=document.getElementById('costReviewAck')?.checked,signature=document.getElementById('costReviewRisk')?.value;
 if(result!=='approved'&&!opinion)return toast('请填写退回或拒绝原因');
 costActionBusy=true;
 try{await costMutate(data=>{
  const c=data.costChanges.find(x=>x.id===selectedCostChange);if(!c||c.status!=='pending'||c.reviewer!==activeRole)throw Error('申请已处理或当前角色不是对应审核主管');
  const t=costTrip(data,c.tripRef);if(t.costVersion!==c.baseVersion)throw Error('有效成本版本已变化，请退回重新核对');
  const risks=changeRisks(data,c);
  if(result==='approved'&&costRiskSignature(risks)!==signature){db=data;throw Error('最新付款占用已变化，请重新查看并确认风险后通过');}
  if(result==='approved'&&risks.length&&!ack)throw Error('请勾选确认最新付款占用风险');
  c.status=result;c.updatedAt=costTime();c.reviewRisk=costClone(risks);c.opinion=opinion;c.reviewedBy=activeRole;
  if(result==='approved'){
   t.costVersion++;c.approvedVersion=t.costVersion;
   t.costVersions.push({number:t.costVersion,items:costClone(c.items),total:aggregateCostItems(c.items).total,file:c.file,attachmentKey:c.attachmentKey,actor:activeRole,at:costTime(),changeId:c.id});
   t.costItems=costClone(c.items);t.budget=aggregateCostItems(c.items).total;t.file=c.file;t.costConfirmedAt=new Date().toISOString();
  }
  costRecord(c,costChangeStatuses[result],opinion);costAudit(data,c.id+' '+costChangeStatuses[result]);
 });render();toast(result==='approved'?'成本变更已通过，新版本生效':'成本变更'+costChangeStatuses[result]);
 }catch(e){if(e.message.includes('占用已变化'))render();toast(e.message);}finally{costActionBusy=false;}
}

 if(t.costConfirmed){const el=document.getElementById('savedCosts');const v=costVersion(t,t.costVersion);

  el.insertAdjacentHTML('afterbegin',`<div class="actions"><button type="button" onclick="openCostWorkspace('${esc(tripReference(t))}')">成本变更／版本记录</button><span class="tag">有效版本 V${t.costVersion}</span>${pendingCostChange(db,tripReference(t))?'<span class="tag">成本变更待审，旧版继续生效</span>':''}</div>`);
 }

const baseRender=render;
render=function(){
 costMigrate(db);
 if(page==='成本变更'){
  document.getElementById('title').textContent=page;
  document.getElementById('app').innerHTML=costWorkspaceHtml();

 }else{

   if(panel){const table=panel.querySelector('table');if(table){table.rows[0].insertCell().textContent='成本版本';db.trips.forEach((t,i)=>{const cell=table.rows[i+1]?.insertCell();if(cell)cell.innerHTML=t.costConfirmed?`<button type="button" class="alt" onclick="openCostWorkspace('${esc(tripReference(t))}')">变更／审核 · V${t.costVersion}</button>`:'首次成本未确认';});}}
  }

   }
  }
 }
 // Add a durable navigation entry to the existing sidebar.
 document.getElementById('nav').innerHTML=['概览','团档案','成本变更','申请付款','审批与付款','待办与记录'].map(x=>`<button class="${x===page?'active':''}" onclick="go('${x}')">${x}</button>`).join('');
 const role=document.getElementById('role');
 role.onchange=function(){if(costEditor)discardCostEditor();activeRole=this.value;db=costReadLatest();render();};
 for(const name of ['主管 / 黄庆','主管 / 魏星鑫','主管 / 贺文峰'])if(![...role.options].some(o=>o.value===name))role.add(new Option(name,name));
};
const baseGo=go;
go=function(next){
 if(costEditor&&page==='成本变更'&&next!==page)discardCostEditor();
 if(page==='成本变更'&&next==='团档案')costDraft=emptyCostDraft();
 db=costReadLatest();baseGo(next);
};
function paymentRiskSignature(check){return JSON.stringify([check.risk,check.version,check.costId,check.used,check.limit,check.pendingId,check.pendingAmount]);}
checkPayment=function(a,data=db){
 const t=costTrip(data,a.tripUid||a.trip),messages=[],item=t?.costItems?.find(x=>x.id===a.costId),ref=t?tripReference(t):a.trip;
 const pending=t?pendingCostChange(data,ref):null,proposed=pending?.items.find(x=>x.id===a.costId),used=costLineUsage(data,ref,a.costId,a.id),amount=Number(a.amount)||0;
 let risk=false;
 if(!t?.costConfirmed){risk=true;messages.push('该团尚无已确认成本，无法核对有效额度。');}
 else if(!item){risk=true;messages.push(proposed?'新增待审成本明细：'+proposed.category+' / '+proposed.name+'，尚无已生效预算依据。':'未匹配当前有效成本明细，请主管核对依据。');}
 else{
  const cumulative=Math.round((used+amount)*100)/100;risk=cumulative>Number(item.amount);
  messages.push('对应 '+item.category+' / '+(item.name||item.category)+'；有效成本 ¥'+money(item.amount)+'；其他已付及有效审批占用 ¥'+money(used)+'；本次 ¥'+money(amount)+'；累计 ¥'+money(cumulative)+'。');
  messages.push(risk?'超过有效成本 ¥'+money(cumulative-item.amount)+'，仅提示风险，由主管判断。':'累计金额未超过有效成本，仍需主管审核。');
 }
 if(pending)messages.push('成本变更 '+pending.id+' 待审'+(proposed?'，该明细拟定金额 ¥'+money(proposed.amount):item?'，待审版本拟删除该明细':'')+'；以有效 V'+t.costVersion+' 为准，付款通过不代表成本变更通过。');
 return {risk,messages,version:t?.costVersion||null,source:item?.source||'',costId:a.costId,used,limit:item?Number(item.amount):null,pendingId:pending?.id||null,pendingAmount:proposed?.amount??null,time:new Date().toISOString(),engine:'有效成本及占用核对'};
};
paymentCostOptions=function(){
 const t=getTrip(document.getElementById('trip').value),el=document.getElementById('costItem');
 const ref=t?tripReference(t):'',pending=pendingCostChange(db,ref),existing=t?.costItems||[];
 el.innerHTML='<option value="">新增成本／未匹配</option>'+existing.map(x=>`<option value="${esc(x.id)}">有效 V${t.costVersion} · ${esc(x.category+' / '+(x.name||x.category))} · ¥${money(x.amount)}</option>`).join('')+(pending?.items||[]).filter(x=>!existing.some(o=>o.id===x.id)).map(x=>`<option value="${esc(x.id)}">待审新增 · ${esc(x.category+' / '+x.name)} · ¥${money(x.amount)}</option>`).join('');paymentCostPreview();
};
function paymentSnapshot(data,t,a){
 a.costVersion=t.costVersion||null;a.costSnapshot={version:t.costVersion||null,items:costClone(t.costItems||[]),at:new Date().toISOString()};a.check=checkPayment(a,data);
}
submitApp=async function(event){
 event.preventDefault();if(costActionBusy)return;
 const read=id=>document.getElementById(id),form=event.currentTarget;
 if(!activeRole.startsWith('操作'))return toast('请切换到操作角色');
 if(form.reportValidity&&!form.reportValidity())return;
 if(!read('basis').files[0]&&!read('demoBasis').checked)return toast('请上传付款依据或选择演示账单');
 if(read('advance').value==='是'&&!read('cancel').value)return toast('请填写最晚取消时间');
 const input={id:'FK-'+costUid(),tripRef:read('trip').value,note:read('note').value,amount:+read('amount').value,vendor:read('vendor').value,basis:read('basis').files[0]?.name||'演示账单.png',costId:read('costItem').value,costName:read('costItem').selectedOptions[0].text,advance:read('advance').value,cancel:read('cancel').value};
 costActionBusy=true;
 try{await costMutate(data=>{
  const t=costTrip(data,input.tripRef);if(!t)throw Error('请选择团档案');
  const a={...input,trip:t.id,tripUid:t.uid,stage:0,history:['操作提交申请'],creator:activeRole,reviewer:costReviewer(t)};
  if(!Number.isFinite(a.amount)||a.amount<=0)throw Error('付款金额必须为正数');
  paymentSnapshot(data,t,a);a.history.push('提交时有效成本 '+(a.costVersion?'V'+a.costVersion:'未确认')+'；'+a.check.messages.join('；'));data.apps.push(a);costAudit(data,'提交付款 '+a.id);data.todos.unshift(a.id+' 待主管审核（模拟通知）');
 });selected=input.id;go('审批与付款');toast('付款申请已提交；成本风险交由主管判断');}catch(e){toast(e.message);}finally{costActionBusy=false;}
};
approve=async function(id){
 if(costActionBusy)return;
 const opinion=document.getElementById('opinion')?.value.trim()||'',ack=document.getElementById('riskack')?.checked,signature=document.getElementById('paymentReviewRisk')?.value;
 costActionBusy=true;
 try{await costMutate(data=>{
  const a=data.apps.find(x=>x.id===id),expected=a?['主管','财务','总经理'][a.stage]:null;
  if(!a||a.special||!expected||!activeRole.startsWith(expected)||(a.stage===0&&a.reviewer&&activeRole!==a.reviewer))throw Error('当前角色无审批权限或申请已处理');
  const check=checkPayment(a,data);
  if(a.stage===0){
   if(paymentRiskSignature(check)!==signature){db=data;throw Error('付款风险已变化，请重新查看后确认');}
   if(check.risk&&(!ack||!opinion))throw Error('超额或无成本依据的付款，须确认风险并填写主管风险处理意见');
   a.supervisorRisk=costClone(check);a.riskOpinion=opinion;
  }
  a.history.push(activeRole+' 同意：'+(opinion||'无补充意见'));a.stage++;costAudit(data,a.id+' 审批通过，进入 '+statuses[a.stage]);
 });render();toast('付款审批已通过本节点');}catch(e){if(e.message.includes('风险已变化'))render();toast(e.message);}finally{costActionBusy=false;}
};
// Refresh submitted basis on re-submission, preserving the previous attempt in history.
resubmit=async function(event,id){
 event.preventDefault();if(costActionBusy||!activeRole.startsWith('操作'))return;
 const note=document.getElementById('editnote').value,amount=+document.getElementById('editamount').value;
 if(!note.trim()||!Number.isFinite(amount)||amount<=0)return toast('请填写用途和有效付款金额');
 costActionBusy=true;
 try{await costMutate(data=>{const a=data.apps.find(x=>x.id===id);if(!a||!['退回修改','已撤回'].includes(a.special))throw Error('申请状态已变化');a.attempts??=[];a.attempts.push({costSnapshot:costClone(a.costSnapshot||null),check:costClone(a.check||null),amount:a.amount,note:a.note});a.note=note;a.amount=amount;a.special=null;a.stage=0;delete a.supervisorRisk;delete a.riskOpinion;paymentSnapshot(data,costTrip(data,a.tripUid||a.trip),a);a.history.push('操作修改后重新提交至主管');costAudit(data,a.id+' 重新提交');});render();}catch(e){toast(e.message);}finally{costActionBusy=false;}
};
// Prevent stale-tab overwrites for the existing synchronous payment transitions.
const originalReject=reject,originalWithdraw=withdraw,originalPay=pay;
reject=function(id,status){db=costReadLatest();const a=db.apps.find(x=>x.id===id);if(!a||a.special||a.stage>2||!activeRole.startsWith(['主管','财务','总经理'][a.stage])||(a.stage===0&&a.reviewer&&activeRole!==a.reviewer))return toast('无审核权限或状态已变化');originalReject(id,status);};
withdraw=function(id){db=costReadLatest();const a=db.apps.find(x=>x.id===id);if(!a||!activeRole.startsWith('操作')||(a.creator&&a.creator!==activeRole))return toast('仅提报人可撤回');originalWithdraw(id);};
pay=function(event,id){db=costReadLatest();originalPay(event,id);};
window.addEventListener('storage',event=>{
 if(event.key!==KEY)return;
 try{db=costReadLatest();if(!costEditor&&page==='成本变更')render();}catch{}
});
const changeBaseCost=changeCost,changeBaseDelete=deleteCostRow,changeBaseAdd=addCostRow;
changeCost=function(index,key,value){if(costEditor)costEditor.mappingAck=false;changeBaseCost(index,key,value);};
deleteCostRow=function(index){if(costEditor)costEditor.mappingAck=false;changeBaseDelete(index);};

</script><script>render();</script><script>// Keep native values and change handlers as the single source of truth.
(() => {
 let count=0;
 function enhance(select){
  if(select.dataset.searchable)return;
  select.dataset.searchable='true';
  const box=document.createElement('span'),input=document.createElement('input'),arrow=document.createElement('button'),list=document.createElement('span');
  box.className='search-select';input.type='text';input.autocomplete='off';input.setAttribute('role','combobox');input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-expanded','false');
  list.id='select-options-'+(++count);list.setAttribute('role','listbox');list.hidden=true;input.setAttribute('aria-controls',list.id);
  const label=select.closest('label');input.setAttribute('aria-label',(label?.firstChild?.textContent||'请选择').trim());
  arrow.type='button';arrow.className='select-arrow';arrow.textContent='⌄';arrow.setAttribute('aria-label','展开选项');arrow.tabIndex=-1;
  select.before(box);box.append(input,arrow,list);select.classList.add('native-search-select');select.tabIndex=-1;
  const text=()=>select.selectedOptions[0]?.textContent||'';
  function close(){list.hidden=true;input.value=text();input.setAttribute('aria-expanded','false');}
  function sync(){input.disabled=select.disabled;arrow.disabled=select.disabled;input.value=text();input.setAttribute('aria-required',String(select.required));if(select.disabled)close();}
  function open(query=''){
   if(select.disabled)return;
   list.replaceChildren();
   Array.from(select.options).filter(o=>!o.disabled&&o.textContent.toLowerCase().includes(query.trim().toLowerCase())).forEach(o=>{
    const button=document.createElement('button');button.type='button';button.setAttribute('role','option');button.setAttribute('aria-selected',String(o.selected));button.textContent=(o.parentElement.tagName==='OPTGROUP'?o.parentElement.label+' · ':'')+o.textContent;
    button.onmousedown=e=>e.preventDefault();button.onclick=e=>{e.preventDefault();select.value=o.value;select.dispatchEvent(new Event('change',{bubbles:true}));close();input.focus();};list.append(button);
   });
   if(!list.children.length){const empty=document.createElement('span');empty.className='empty';empty.textContent='无匹配选项';list.append(empty);}
   list.hidden=false;input.setAttribute('aria-expanded','true');
  }
  input.addEventListener('focus',()=>open());input.addEventListener('click',()=>open());input.addEventListener('input',()=>open(input.value));
  input.addEventListener('keydown',e=>{if(e.key==='Escape'){close();e.preventDefault();}if(e.key==='ArrowDown'){if(list.hidden)open();list.querySelector('button')?.focus();e.preventDefault();}if(e.key==='Enter'){if(!list.hidden){list.querySelector('button')?.click();e.preventDefault();}}});
  list.addEventListener('keydown',e=>{const buttons=[...list.querySelectorAll('button')],i=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus();e.preventDefault();}if(e.key==='Escape'){close();input.focus();close();}});
  box.addEventListener('focusout',()=>setTimeout(()=>{if(!box.contains(document.activeElement))close();},0));
  arrow.onclick=e=>{e.preventDefault();if(list.hidden){input.focus();open();}else close();};
  select.addEventListener('change',sync);select.addEventListener('invalid',()=>{input.focus();input.setCustomValidity('请从下拉选项中选择');input.reportValidity();input.setCustomValidity('');});
  new MutationObserver(sync).observe(select,{childList:true,subtree:true,attributes:true});sync();
 }
 const scan=()=>document.querySelectorAll('select:not([data-searchable])').forEach(enhance);
 new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});scan();
})();
