function v35AccountSave(data,input){
 stAssert(v35Finance()||v35GM(),'无账户维护确认权限');stAssert(input.name?.trim()&&input.holder?.trim()&&input.reason?.trim()&&/^\d{4}-\d{2}-\d{2}$/.test(input.date)&&input.opening!==''&&Number.isFinite(+input.opening),'请补齐账户名称、持有人、期初日期余额和说明');
 if(input.type==='银行')stAssert(input.bank?.trim(),'银行账户须填写银行名称');if(['银行','支付宝','微信'].includes(input.type))stAssert(input.number?.trim(),'请填写支付账号');
 let a=rcAccount(data,input.id),before=a&&costClone(a);if(a){stAssert(a.currency===input.currency,'已有账户不能直接改币种');const oldOpening=a.configOpening??rcBalance(data,a.id),delta=bzR(+input.opening-oldOpening);if(a.id==='bank')data.balance=bzR(data.balance+delta);else a.balance=bzR(a.balance+delta);}else{a={id:'AC-'+costUid(),currency:input.currency,balance:+input.opening};data.receiptAccounts.push(a);}
 Object.assign(a,{name:input.name,type:input.type,holder:input.holder,bank:input.bank,number:input.number,configOpening:+input.opening,openingDate:input.date,active:input.active});delete a.company;
 data.v35.accountVersions??=[];data.v35.accountVersions.push({id:a.id,before,after:costClone(a),reason:input.reason,actor:activeRole,confirmedBy:activeRole,at:costTime()});costAudit(data,a.id+' 公司账户及期初保存确认：'+input.reason);return a.id;
}
function v35SaveAccount(e){e.preventDefault();const d=v35AccountDraft||{},input={id:d.id,name:payVal('v35-ac-name'),type:payVal('v35-ac-type'),holder:payVal('v35-ac-holder'),bank:payVal('v35-ac-bank'),number:payVal('v35-ac-number'),currency:payVal('v35-ac-currency'),date:payVal('v35-ac-date'),opening:payVal('v35-ac-opening'),reason:payVal('v35-ac-reason'),active:payVal('v35-ac-active')==='yes'};return bzRun(data=>{v35AccountSave(data,input);v35AccountDraft=null;},'公司账户及期初已确认');}
function v35ExpenseSelect(id){const a=stApp(db,id);if(!a)return;const old=[...db.v35.allocationPlans].reverse().find(p=>p.sourceId===id&&p.status==='approved'),month=a.period?.slice(0,7)||stMonth(),amount=a.amountCNY??a.amount,rule=[...db.biz.allocationRules].reverse().find(r=>r.from<=month&&(!r.to||r.to>=month)&&(r.category==='*'||r.category===a.fee));v35ExpenseDraft=old?{...costClone(old),reason:''}:{sourceId:id,amount,from:month,to:month,mode:'single',dep:a.owner?.split(':').slice(1).join(':')||'',rows:costClone(rule?.rows||[]),months:[{month,cents:payCents(amount)}],reason:''};render();}
function v35ExpenseMonths(){const d=v35ExpenseDraft;if(!d||!v35Month(d.from)||!v35Month(d.to)||d.from>d.to)return;d.months=bzSchedule(d.amount,d.from,d.to);render();}
function v35AllocationMatrix(input){const months=input.months||[],total=payCents(input.amount);stAssert(months.length&&months.reduce((n,m)=>n+Number(m.cents),0)===total,'各月分摊合计必须等于待分摊总额');const rows=input.mode==='single'?[{dep:input.dep,percent:100}]:input.rows;stAssert(rows?.length&&rows.every(r=>BZ_DEPS.includes(r.dep)&&Number(r.percent)>=0)&&Math.abs(rows.reduce((n,r)=>n+Number(r.percent),0)-100)<0.000001,'承担部门有效且比例合计必须为100%');stAssert(new Set(rows.map(r=>r.dep)).size===rows.length,'承担部门不能重复');const result=[];for(const m of months){let used=0;rows.forEach((r,i)=>{const c=i===rows.length-1?m.cents-used:Math.round(m.cents*Number(r.percent)/100);used+=c;result.push({month:m.month,dep:r.dep,amount:c/100,percent:Number(r.percent)});});}return result;}
function v35AllocationSave(data,input){
 stAssert(v35Finance()||v35GM(),'仅财务或总经理可设置分摊');const a=stApp(data,input.sourceId);stAssert(a&&a.stage>=3&&!a.special&&['管销付款','员工报销'].includes(a.paymentType)&&!paymentIsBusiness(a),'请选择已批准的管销费用，不重复分摊团成本');stAssert(input.reason?.trim(),'请填写分摊依据／变更原因');stAssert(payCents(input.amount)===payCents(a.amountCNY??a.amount),'待分摊总额应与原费用一致');const matrix=v35AllocationMatrix(input);for(const p of data.v35.allocationPlans.filter(p=>p.sourceId===input.sourceId&&p.status==='approved'))p.status='superseded';const row={...costClone(input),id:'FT-'+costUid(),matrix,status:'approved',actor:activeRole,confirmedBy:activeRole,at:costTime()};data.v35.allocationPlans.push(row);costAudit(data,row.id+' 确认费用归属／分摊，不产生资金流水');return row.id;
}
function v35ExpensePage(){if(!v35Finance()&&!v35GM())return '<section class="panel">仅财务或总经理可维护费用分摊。</section>';const d=v35ExpenseDraft,apps=db.apps.filter(a=>a.stage>=3&&!a.special&&['管销付款','员工报销'].includes(a.paymentType)&&!paymentIsBusiness(a));let preview='',error='';if(d)try{preview=bzTable(['月份','承担部门','比例','归属金额'],v35AllocationMatrix(d).map(r=>[esc(r.month),esc(r.dep),r.percent+'%',money(r.amount)]));}catch(e){error=e.message;}

preview}<label>分摊依据／变更原因 *<textarea oninput="v35ExpenseDraft.reason=this.value">${esc(d.reason)}</textarea></label><p class="field-note">请核对各月、各部门金额及尾差；确认只更新经营费用归属，不再次增加现金支出。</p><button onclick="bzRun(data=>{v35AllocationSave(data,structuredClone(v35ExpenseDraft));v35ExpenseDraft=null})">确认分摊</button><button class="alt" onclick="v35ExpenseDraft=null;render()">取消</button></section>`:''}<section class="panel"><h3>常用公共费用比例</h3><p>默认配置用于带出；具体费用仍需核对分摊预览并确认。</p>${v35DefaultAllocationPage()}</section><div id="bz-error" role="alert"></div>`;
}

const v35OldExpenseFor=bzExpenseFor;

function v36InvoiceMatrix(sources,tickets){let remaining=sources.map(s=>payCents(s.amount));return tickets.map((t,idx)=>{let need=payCents(t.amount),parts=idx===tickets.length-1?[...remaining]:remaining.map(n=>Math.floor(need*n/remaining.reduce((a,b)=>a+b,0)));let rest=need-parts.reduce((a,b)=>a+b,0);for(let i=0;rest>0;i=(i+1)%parts.length)if(parts[i]<remaining[i]){parts[i]++;rest--;}remaining=remaining.map((n,i)=>n-parts[i]);return {...t,allocations:sources.map((s,i)=>({key:v36SourceKey(s),cents:parts[i]}))};});}
function v36InvoiceCreate(data,input){
 v36Init(data);stAssert(v36CanInvoice(),'当前角色无开票申请权限');if(input.requestKey){const found=data.v36.invoices.find(r=>r.requestKey===input.requestKey);if(found){stAssert(found.creator===activeRole,'请求编号已被其他角色使用');return found.id;}}
 stAssert(COMPANY_OPTIONS.includes(input.company)&&input.title?.trim()&&['企业','个人'].includes(input.buyerType)&&['普通发票','专用发票'].includes(input.invoiceType),'请补齐开票主体、购买方、抬头和发票类型');stAssert(input.buyerType!=='企业'||input.taxId?.trim(),'企业抬头须填写税号');const choices=v36InvoiceSources(data),sources=input.sources||[],tickets=input.tickets||[];stAssert(sources.length&&new Set(sources.map(v36SourceKey)).size===sources.length,'至少关联一笔业务，业务不可重复');for(const s of sources){const found=choices.find(x=>v36SourceKey(x)===v36SourceKey(s));stAssert(found&&v35Money(s.amount)&&+s.amount>0,'请选择授权业务并填写有效金额');stAssert(!found.company||found.company===input.company,'合并业务须属于同一开票主体');stAssert(payCents(s.amount)<=payCents(v36InvoiceAvailable(data,found)),'开票金额超过业务可申请额度，请刷新核对');}
 stAssert(tickets.length&&tickets.every(t=>V36_SUBJECTS.includes(t.subject)&&v35Money(t.amount)&&+t.amount>0&&(t.subject!=='其他'||t.note?.trim())),'每张票须填写有效金额与科目，其他科目须说明');const sum=rows=>rows.reduce((n,r)=>n+payCents(r.amount),0),total=sum(sources);stAssert(total===sum(tickets),'业务分配合计须等于每张票的金额合计');const matrix=tickets.every(t=>t.allocations)?costClone(tickets):v36InvoiceMatrix(sources,tickets),keys=sources.map(v36SourceKey);
 for(const t of matrix)stAssert(t.allocations.length===keys.length&&new Set(t.allocations.map(a=>a.key)).size===keys.length&&t.allocations.every(a=>keys.includes(a.key)&&Number.isSafeInteger(a.cents)&&a.cents>=0)&&t.allocations.reduce((n,a)=>n+a.cents,0)===payCents(t.amount),'每张票业务分配合计须等于票面申请金额');for(const s of sources)stAssert(matrix.reduce((n,t)=>n+(t.allocations.find(a=>a.key===v36SourceKey(s))?.cents||0),0)===payCents(s.amount),'每笔业务在各票上的分配合计不一致');
 const id='KP-'+costUid();data.v36.invoices.push({id,requestKey:input.requestKey||costUid(),company:input.company,buyerType:input.buyerType,title:input.title.trim(),taxId:input.taxId?.trim()||'',invoiceType:input.invoiceType,email:input.email||'',note:input.note||'',sources:costClone(sources),tickets:matrix.map(t=>({...t,id:'TICKET-'+costUid(),amount:+t.amount})),total:total/100,status:'pending',creator:activeRole,at:costTime(),history:[{at:costTime(),actor:activeRole,text:'提交申请新票'}]});costAudit(data,id+' 申请新票');return id;
}
function v36InvoiceVoid(data,input){v36Init(data);const r=data.v36.invoices.find(r=>r.id===input.invoiceId);stAssert(v36CanInvoice()&&r&&v36InvoiceCanRead(data,r),'无原申请查看／作废申请权限');stAssert(input.reason?.trim(),'作废原票须填写原因');const ids=input.ticketIds||[];stAssert(ids.length&&new Set(ids).size===ids.length&&ids.every(id=>r.tickets.some(t=>t.id===id)&&!v36TicketReserved(data,r.id,id)),'请选择未作废且无待处理作废申请的完整票');const id='ZF-'+costUid();data.v36.voids.push({id,invoiceId:r.id,ticketIds:[...ids],amount:r.tickets.filter(t=>ids.includes(t.id)).reduce((n,t)=>n+payCents(t.amount),0)/100,reason:input.reason,status:'pending',creator:activeRole,at:costTime(),history:[{at:costTime(),actor:activeRole,text:'提交作废原票（含未开票撤销）'}]});r.history.push({at:costTime(),actor:activeRole,text:'申请作废 '+id+'；暂停所选票开具'});costAudit(data,id+' 申请作废原票');return id;}

earMatrix()">`,`<input aria-label="第${i+1}张补充说明" value="${esc(t.note||'')}" oninput="v36InvoiceDraft.tickets[${i}].note=this.value">`,`<button type="button" class="alt" onclick="v36InvoiceDraft.tickets.splice(${i},1);v36InvoiceClearMatrix();render()">移除</button>`]))}<button type="button" class="alt" onclick="v36InvoiceDraft.tickets.push({subject:V36_SUBJECTS[0],amount:'',note:''});v36InvoiceClearMatrix();render()">增加一张票</button> <button type="button" class="alt" onclick="v36InvoicePreview()">核对各票业务分配</button>${d.tickets.every(t=>t.allocations)?`<h4>各票业务分配（可调整）</h4>${bzTable(['计划票',...d.sources.map(s=>s.label)],d.tickets.map((t,i)=>[esc((i+1)+' · '+t.subject)+'<small>¥'+money(t.amount)+'</small>',...t.allocations.map((a,j)=>`<input aria-label="第${i+1}张对第${j+1}笔业务分配" type="number" min="0" step="0.01" value="${a.cents/100}" oninput="v36InvoiceDraft.tickets[${i}].allocations[${j}].cents=payCents(this.value)">`)]))}`:''}</section><label class="wide">补充开票资料／说明<textarea oninput="v36InvoiceDraft.note=this.value">${esc(d.note)}</textarea></label><div class="actions wide"><button ${v36InvoiceBusy?'disabled':''}>提交申请新票</button><button type="button" class="alt" onclick="v36InvoiceOpen()">返回列表</button></div><div id="v36-invoice-error" class="wide risk" role="alert"></div></form></section>`;}

function v36InvoiceDetail(r){if(!r||!v36InvoiceCanRead(db,r))return '<section class="panel">无该申请查看权限。</section>';const pending=db.v36.voids.filter(v=>v.invoiceId===r.id&&v.status==='pending');return `<section class="panel"><h3>${esc(r.id)} · ${r.status==='pending'?'待财务处理':'已完成'}</h3><p>${esc(r.company+' · '+r.title+' · '+r.invoiceType)}</p><p>${esc(r.buyerType+' · 税号 '+(r.taxId||'—')+' · '+r.email)}</p><p>申请总额 ¥${money(r.total)} · ${esc(r.creator)}</p>${pending.length?'<p class="su-alert">存在待处理作废申请，暂停对应票开具。作废完成后才释放额度。</p>':''}${bzTable(['计划票／科目','金额','对应业务分配','状态'],r.tickets.map((t,i)=>[esc((i+1)+' · '+t.subject)+'<small>'+esc(t.note||'')+'</small>','¥'+money(t.amount),t.allocations.map(a=>esc(r.sources.find(s=>v36SourceKey(s)===a.key)?.label||a.key)+'：¥'+money(a.cents/100)).join('<br>'),v36TicketVoided(db,r.id,t.id)?'作废已完成':v36TicketReserved(db,r.id,t.id)?'作废处理中':r.status==='completed'?'新票申请已完成':'待财务处理']))}<p>${esc(r.note)}</p><p class="field-note">实际发票资料在外部管理；系统保留申请、分配和处理记录。</p>${v35Finance()&&r.status==='pending'?`<button onclick="bzRun(d=>v36InvoiceComplete(d,'new',${emArg(r.id)}),'新票申请已完成')">标记新票申请已完成</button>`:''}<button class="alt" onclick="v36InvoiceOpen('void',${emArg(r.id)})">申请作废原票</button><button class="alt" onclick="v36InvoiceOpen()">返回列表</button><details><summary>处理记录</summary>${r.history.map(h=>'<p>'+esc(h.at+' · '+h.actor+' · '+h.text)+'</p>').join('')}</details></section>`;}

function v36InvoicePage(){if(!v36CanInvoice())return '<section class="panel">当前角色无此权限。</section>';v36Init(db);const head=`<div class="em-page-heading"><div><p class="em-eyebrow">CUSTOMER INVOICES</p><h3>客户开票申请</h3><p>新票与原票作废统一跟进</p></div></div><section class="panel"><div class="actions"><button onclick="v36InvoiceOpen('new')">申请新票</button><button class="alt" onclick="v36InvoiceOpen('void')">申请作废原票</button><button class="alt" onclick="v36InvoiceOpen()">申请记录</button></div></section>`;if(v36InvoiceMode==='new'&&v36InvoiceDraft)return head+v36InvoiceNewPage();if(v36InvoiceMode==='void')return head+v36InvoiceVoidPage();if(v36InvoiceMode==='detail')return head+v36InvoiceDetail(db.v36.invoices.find(r=>r.id===v36InvoiceId));const rows=db.v36.invoices.filter(r=>v36InvoiceCanRead(db,r));return head+`<section class="panel"><h3>新票申请记录</h3>${bzTable(['申请单／抬头','主体／类型','金额／张数','状态','操作'],rows.map(r=>[esc(r.id)+'<small>'+esc(r.title)+'</small>',esc(r.company)+'<small>'+esc(r.invoiceType)+'</small>','¥'+money(r.total)+' / '+r.tickets.length+'张',r.status==='pending'?'待财务处理':'已完成',`<button class="alt" onclick="v36InvoiceOpen('detail',${emArg(r.id)})">查看／处理</button>`]))}${rows.length?'':'<p class="em-empty">暂无开票申请，可从上方申请新票。</p>'}</section><section class="panel"><h3>作废原票申请记录</h3>${bzTable(['申请单／原申请','张数／金额','原因','状态','操作'],db.v36.voids.filter(v=>rows.some(r=>r.id===v.invoiceId)).map(v=>[esc(v.id)+'<small>'+esc(v.invoiceId)+'</small>',v.ticketIds.length+'张 / ¥'+money(v.amount),esc(v.reason),v.status==='pending'?'待财务处理，额度未释放':'已完成，额度已释放',v35Finance()&&v.status==='pending'?`<button onclick="bzRun(d=>v36InvoiceComplete(d,'void',${emArg(v.id)}),'作废申请已完成，原业务额度已释放')">标记已完成</button>`:esc(v.completedBy||v.creator)]))}</section>`;}
