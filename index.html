</style><aside><h1>行界 · 财务</h1><small>FINANCE WORKSPACE</small><nav id="nav"></nav><div class="note">收付申请新版 · v2.1<br>演示数据仅保存在当前浏览器</div></aside><main><div class="top"><div><span class="muted">行界旅业 / 财务协同</span><h2 id="title"></h2></div><label>当前演示角色<select id="role" onchange="activeRole=this.value;render()"><option>操作 / 江婧婕</option><option>销售 / 示例销售员</option><option>主管 / 刘婷茹</option><option>财务 / 杜川黔</option><option>总经理 / 刘婷茹</option></select></label></div><div class="banner">模拟环境：角色切换用于流程走查，不是真实登录。成本表在本浏览器解析，付款采用规则核对；尚未接入AI模型、真实付款及飞书。</div><div id="app"></div></main><div id="toast" role="status"></div>
<script>
const KEY='xingjie-finance-rules-v2',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{};db??={trips:[],apps:[],logs:[],balance:100000,todos:[]};let page='概览',activeRole='操作 / 江婧婕',selected=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function log(t){db.logs.unshift({t,time:new Date().toLocaleString('zh-CN')});save()}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3000)}function go(p){page=p;render()}const money=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2});const statuses=['主管审核','财务审核','总经理审核','待付款','付款完成'];function state(a){return a.special||statuses[a.stage]}function getTrip(id){return db.trips.find(t=>t.id===id||t.uid===id)}function table(){return db.apps.length?`<table><tr><th>申请单 / 团号</th><th>用途 / 供应商</th><th>金额</th><th>当前状态</th><th></th></tr>${db.apps.map(a=>`<tr><td>${esc(a.id)}<div class="note">${esc(a.trip)}</div></td><td>${esc(a.note)}<div class="note">${esc(a.vendor)}</div></td><td>¥${money(a.amount)}</td><td><span class="tag">${state(a)}</span></td><td><button class="alt" onclick="selected='${a.id}';go('审批与付款')">查看</button></td></tr>`).join('')}</table>`:'<div class="empty">还没有付款申请。先创建一笔，体验完整审批流程。</div>'}
function render(){document.getElementById('title').textContent=page;document.getElementById('nav').innerHTML=['概览','团档案','申请付款','审批与付款','待办与记录'].map(x=>`<button class="${x===page?'active':''}" onclick="go('${x}')">${x}</button>`).join('');let html='';
if(page==='概览')html=`<div class="cards">${[['已建团',db.trips.length],['审批中',db.apps.filter(a=>a.stage<3&&!a.special).length],['待付款',db.apps.filter(a=>a.stage===3&&!a.special).length],['模拟账户余额','¥'+money(db.balance)]].map(([k,v])=>`<div class="card"><span class="muted">${k}</span><div class="num">${v}</div></div>`).join('')}</div><div class="panel"><h3>从一笔付款开始走查</h3><p class="muted">建团 → 操作提报 → 主管审核 → 财务审核 → 总经理审核 → 财务执行</p><div class="actions"><button onclick="go('团档案')">新建业务团档</button><button class="alt" onclick="go('申请付款')">发起付款申请</button><button class="alt" onclick="seedApp()">载入虚构测试团档</button></div></div><div class="panel"><h3>最近付款申请</h3>${table()}</div>`;
if(page==='团档案')html=`<div class="panel"><h3>新建团档案</h3>${tripForm()}</div><div class="panel"><h3>团档案</h3><div id="savedCosts"></div><table><tr><th>团号</th><th>归属 / 目的地</th><th>已确认成本</th><th>成本附件 / 清单</th></tr>${db.trips.map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(t.dep)} / ${esc(t.dest)}</td><td>${t.costConfirmed?'¥'+money(t.budget):'待导入核对'}</td><td>${esc(t.file)}<br><button type="button" class="alt" onclick="showTripCosts('${t.id}')">查看成本清单</button></td></tr>`).join('')}</table></div>`;
if(page==='申请付款')html=`<div class="panel"><h3>团相关付款申请</h3>${!activeRole.startsWith('操作')?'<p class="risk">请切换到操作角色填写申请。</p>':`<form onsubmit="submitApp(event)" class="grid"><label>财务方向<input disabled value="付款"></label><label>关联方式<input disabled value="关联旅游团"></label><label class="wide">团号<select id="trip" required onchange="paymentCostOptions()">${db.trips.map(t=>`<option value="${esc(tripReference(t))}">${esc(t.id)}</option>`).join('')}</select></label><label>费用类别<input disabled value="定制团 · 从档案带出"></label><label class="wide">对应成本明细<select id="costItem" onchange="paymentCostPreview()"></select><div id="costHint" class="note"></div></label><label>用途 / 备注<textarea id="note" required placeholder="如：酒店30%预付款"></textarea></label><label>金额（人民币）<input id="amount" oninput="paymentCostPreview()" type="number" min="0.01" step="0.01" required></label><label>供应商<select id="vendor"><option>示例酒店 · 已准入</option><option>示例车队 · 已准入</option></select></label><label>对方收款方式<select disabled><option>银行转账</option></select></label><label>对方收款信息<input disabled value="供应商测试账户 · 尾号0001"><div class="note">模拟账号，不可用于真实付款。</div></label><label class="wide">付款依据<input type="file" id="basis"><span class="note"><input id="demoBasis" type="checkbox" style="width:auto"> 使用演示账单（模拟附件）</span></label><label class="risk">是否未收款先垫款<select id="advance" onchange="document.getElementById('cancelwrap').hidden=this.value!=='是'"><option>否</option><option>是</option></select></label><label id="cancelwrap" hidden class="risk">最晚取消时间<input type="datetime-local" id="cancel"></label><div id="paymentCheck" class="wide"></div><div class="wide"><button>提交付款审批</button></div></form>`}</div>`;
if(page==='审批与付款'){let a=db.apps.find(x=>x.id===selected);html=`<div class="panel"><h3>申请列表</h3>${table()}</div>`;if(a){let expected=['主管','财务','总经理','财务'][a.stage],can=activeRole.startsWith(expected)&&!a.special&&(!(a.stage===0&&a.reviewer)||activeRole===a.reviewer),spent=db.apps.filter(x=>sameTrip(x,a)&&x.stage===4).reduce((s,x)=>s+x.amount,0),check=checkPayment(a),risk=check.risk;html+=`<div class="panel"><div class="panelhead"><h3>${esc(a.id)}</h3><span class="tag">${state(a)}</span></div><div class="steps">${statuses.map((x,i)=>`<span class="step ${i===a.stage?'now':''}">${i+1} ${x}</span>`).join('')}</div><p>${esc(a.note)} · ${esc(a.trip)} · ¥${money(a.amount)}</p><p class="muted">成本明细：${esc(a.costName||'未关联')}　供应商：${esc(a.vendor)}　依据：${esc(a.basis)}</p>${checkPanel(check,a.check)}${a.stage<3&&!a.special?`<p>当前需要：<b>${expected}</b>处理。当前角色：${activeRole}</p>${can?`<label>审核意见<input id="opinion" placeholder="退回、拒绝时填写原因"></label>${risk&&a.stage===0?'<label><input id="riskack" type="checkbox" style="width:auto"> 已查看并确认本次成本风险</label>':''}<div class="actions"><button onclick="approve('${a.id}',${risk})">同意</button><button class="alt" onclick="reject('${a.id}','退回修改')">退回修改</button><button class="bad" onclick="reject('${a.id}','已拒绝')">拒绝申请</button></div>`:''}${activeRole.startsWith('操作')?`<div class="actions"><button class="alt" onclick="withdraw('${a.id}')">撤回申请</button></div>`:''}`:''}${a.stage===3&&!a.special?can?`<h3>财务付款执行</h3><form onsubmit="pay(event,'${a.id}')" class="grid"><label>结算方式<input disabled value="真实账户支付（模拟）"></label><label>公司付款账户<select id="account"><option>测试公司银行账户</option></select></label><label>实际付款日期<input type="date" id="paydate" required></label><label>付款水单<input type="file" id="slip"><span class="note"><input type="checkbox" id="mockslip" style="width:auto"> 使用演示水单（模拟附件）</span></label><label class="risk wide">跨月分摊设置<select disabled><option>本次团成本不做跨月分摊</option></select></label><div><button>确认付款完成（模拟）</button></div></form>`:'<p class="muted">全部审批通过，请切换财务角色执行付款。</p>':''}${a.stage===4?`<p class="tag">付款完成 · ${esc(a.account)} · ${esc(a.paydate)}</p><p>水单文件：${esc(a.slip)}（仅保存文件名）</p>`:''}${['退回修改','已撤回'].includes(a.special)&&activeRole.startsWith('操作')?`<form onsubmit="resubmit(event,'${a.id}')"><label>修改用途<textarea id="editnote" required>${esc(a.note)}</textarea></label><label>修改金额<input id="editamount" type="number" min="0.01" step="0.01" required value="${a.amount}"></label><div class="actions"><button>保留单号，重新提交首节点</button></div></form>`:''}<h3>申请轨迹</h3>${a.history.map(x=>`<div class="log">${esc(x)}</div>`).join('')}</div>`}}

  for (const [id,visible] of [['foreignSource',category==='RJ'],['tripPlatform',['COTA','OVERSEAS'].includes(category)],['tripProduct',['COTA','OVERSEAS'].includes(category)],['tripOrder',['COTA','OVERSEAS'].includes(category)]]) {
    const field = tripField(id);
    field.closest('label').hidden = !visible;
    field.disabled = !visible;

function tripBaseCode(category,destCode,date,platform,product) {
  if (!Object.hasOwn(TRIP_CATEGORIES,category) || !destCode || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  if (category==='OVERSEAS' && (!Object.hasOwn(OVERSEAS_PLATFORMS,platform)||!Object.hasOwn(OVERSEAS_PRODUCTS,product))) return '';
  if (category==='COTA' && (!Object.hasOwn(TRIP_PLATFORMS,platform)||!Object.hasOwn(TRIP_PRODUCTS,product))) return '';
  const components = category==='OVERSEAS'?[platform,product,destCode]:category==='COTA'?[category,platform,product]:[category,destCode];
  return [...components,date.replaceAll('-','')].join('-');
}
function nextTripCode(base,trips) {
  const used = new Set(trips.map(t=>t.id));
  if (!used.has(base)) return base;
  let index=1;
  while (used.has(base+'-'+String(index).padStart(2,'0'))) index++;
  return base+'-'+String(index).padStart(2,'0');
}
function currentTripBase() {
  return tripBaseCode(tripField('tripCategory').value,chosenDestination()?.code,tripField('date').value,tripField('tripPlatform').value,tripField('tripProduct').value);
}
function updateTripPreview() {
  const base=currentTripBase();
  tripField('tripPreview').textContent=base?nextTripCode(base,db.trips):'填完编号所需字段后显示';
}

async function tripAttachment(mode, action) {
  const dbHandle=await new Promise((resolve,reject)=>{
    let expired=false;
    const timer=setTimeout(()=>{expired=true;reject(new Error('成本附件存储连接超时，请关闭其他原型页面后重试'));},10000);
    const request=indexedDB.open('xingjie-trip-files',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('files');
    request.onsuccess=()=>{clearTimeout(timer);if(expired){request.result.close();return;}request.result.onversionchange=()=>request.result.close();resolve(request.result);};
    request.onerror=()=>{clearTimeout(timer);reject(request.error);};
    request.onblocked=()=>{clearTimeout(timer);expired=true;reject(new Error('成本附件存储被其他页面占用，请关闭其他原型页面后重试'));};
  });
  try {
    return await new Promise((resolve,reject)=>{
      const transaction=dbHandle.transaction('files',mode);
      const timer=setTimeout(()=>transaction.abort(),10000);
      const request=action(transaction.objectStore('files'));
      transaction.oncomplete=()=>{clearTimeout(timer);resolve(request.result);};
      transaction.onabort=()=>{clearTimeout(timer);reject(transaction.error||new Error('附件保存超时或已中止'));};
    });
  } finally { dbHandle.close(); }
}
async function downloadTripAttachment(uid) {
  try {
    const file=await tripAttachment('readonly',store=>store.get(uid));
    if (!file) return toast('当前浏览器没有该成本原文件');
    const url=URL.createObjectURL(file);
    const link=document.createElement('a');
    link.href=url;
    link.download=file.name;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  } catch { toast('成本原文件读取失败'); }
}

  const owner=tripField('tripOwner').value;
  const record={
    uid:typeof crypto.randomUUID==='function'?crypto.randomUUID():'trip-'+Date.now()+'-'+Math.random().toString(36).slice(2), dep:owner.slice(owner.indexOf(':')+1), owner, category,
    dest:destination.name, destinationId:destination.key, destinationScope:tripField('destScope').value,
    destinationCode:destination.code, departureDate:date,
    sales:tripField('tripSales').value, operatorA:tripField('tripOperatorA').value, operatorB:tripField('tripOperatorB').value,
    budget:costTotal(), file:costDraft.filename, costConfirmed:true, costVersion:1,
    costItems:structuredClone(costDraft.items), costSheet:costDraft.sheet, costConfirmedAt:new Date().toISOString()
  };
  if (category==='RJ') record.foreignSource=tripField('foreignSource').value;
  record.name=tripField('tripName')?.value.trim()||record.dest;
  record.archiveKind='single';
  if (['COTA','OVERSEAS'].includes(category)) {
    record.externalOrder=tripField('tripOrder').value.trim();
    record.platform=tripField('tripPlatform').value;
    record.product=tripField('tripProduct').value;
  }
  const attachment=costDraft.file;
  const button=tripField('tripSave');
  tripSaving=true;
  button.disabled=true;
  button.textContent='保存中…';
  let storedFile=false;
  try {
    tripFeedback('正在保存成本附件，请稍候…','保存附件',false);
    diagnostic('建团保存','进行中','保存附件');
    await tripAttachment('readwrite',store=>store.put(attachment,record.uid));
    storedFile=true;
    const commit=()=>{
      const latest=JSON.parse(localStorage.getItem(KEY)) || db;
      if(record.externalOrder&&latest.trips.some(t=>t.owner===record.owner&&t.platform===record.platform&&t.externalOrder===record.externalOrder))throw new Error('该平台订单已有团档，请查找并复用');
      record.id=nextTripCode(base,latest.trips);
      const updated={...latest,trips:[...latest.trips,record],
        logs:[{t:'建立团档案 '+record.id,time:new Date().toLocaleString('zh-CN')},...latest.logs]};
      localStorage.setItem(KEY,JSON.stringify(updated));
      db=updated;
    };
    if (navigator.locks) await navigator.locks.request(KEY+'-business-write',{signal:AbortSignal.timeout(10000)},commit);
    else commit();
  } catch (error) {
    diagnostic('建团保存','失败','本地保存',error.name+': '+error.message);
    if (storedFile) await tripAttachment('readwrite',store=>store.delete(record.uid)).catch(()=>{});
    tripFeedback('保存失败：'+error.message+'。填写内容已保留，可在「待办与记录」导出诊断日志。','本地保存',false);
    return;
  } finally {
    tripSaving=false;
    button.disabled=false;
    button.textContent='保存并生成团号';
  }
  costDraft=emptyCostDraft();
  render();
  if (page==='团档案') showTripCosts(record.id);
  diagnostic('建团保存','成功','完成',record.id);
  tripFeedback('建团成功 · 团号：'+record.id+' · 成本合计 ¥'+money(record.budget),'完成',false);
  document.getElementById('tripFeedback')?.scrollIntoView({block:'center',behavior:'smooth'});
}

function tripFeedback(message,stage,record=true){
 const el=document.getElementById('tripFeedback');
 if(el){el.hidden=false;el.className='wide banner';el.textContent=message;}
 if(record)diagnostic('建团保存','未通过',stage,message);
 toast(message);
}

function groundCostSection(rows) {

  if (start < 0) return null;

  const header = rows.findIndex((r, i) => i > start && i < end && /[項项]目/.test(r.cells[1]) && /[價价]格|金[額额]/.test(r.cells[6]));

let cells=costDraft.rows[costDraft.header]?.cells||[],find=re=>cells.findIndex(v=>re.test(v));costDraft.mapping={category:find(/分类|类别|project/i),name:find(/明细|服务内容|项目名称|费用名称/),amount:find(/采购金额|成本金额|成本合计|total|金额|合计|总价/i)};if(costDraft.mapping.name<0){let idx=find(/项目/);costDraft.mapping.name=idx>=0?idx:0}if(costDraft.mapping.category===costDraft.mapping.name)costDraft.mapping.name++;costDraft.mapping.unit=find(/单价/);costDraft.mapping.qty=find(/数量|间\/位/);costDraft.mapping.times=find(/夜\/次|天数|day\/time/i)}

function matchCostText(value){return String(value??'').trim().replace(/\s+/g,'').toLowerCase();}
function sameCostContent(a,b){return matchCostText(a.name)===matchCostText(b.name)&&matchCostText(a.category)===matchCostText(b.category)&&Math.round(Number(a.amount)*100)===Math.round(Number(b.amount)*100);}
function ensureChangeMatches(){
 if(!costEditor)return;
 const old=costVersion(costTrip(db,costEditor.tripRef),costEditor.baseVersion)?.items||[];
 const incoming=costDraft.items.filter(x=>x.include);
 if(costEditor.mode==='online'){
  for(const x of incoming)if(x.originId===undefined){x.originId='new';x.matchConfirmed=true;}
  return;
 }
 const used=new Set(incoming.filter(x=>x.originId&&x.originId!=='new').map(x=>x.originId));
 // Unique one-to-one matches: full content first, then identity fields. Never use Excel row positions.
 const criteria=[(a,b)=>sameCostContent(a,b),(a,b)=>matchCostText(a.name)===matchCostText(b.name)&&matchCostText(a.category)===matchCostText(b.category),(a,b)=>!!matchCostText(a.name)&&matchCostText(a.name)===matchCostText(b.name)];
 for(const matches of criteria){
  const fresh=incoming.filter(x=>x.originId===undefined),available=old.filter(o=>!used.has(o.id));
  for(const x of fresh){
   const options=available.filter(o=>!used.has(o.id)&&matches(x,o));
   if(options.length===1&&fresh.filter(n=>n.originId===undefined&&matches(n,options[0])).length===1){x.originId=options[0].id;x.matchConfirmed=true;x.matchMethod='auto';used.add(x.originId);}
  }
 }
 for(const x of incoming){
  if(x.originId!==undefined)continue;
  const possible=old.filter(o=>!used.has(o.id)&&(matchCostText(o.name)===matchCostText(x.name)||(matchCostText(o.category)===matchCostText(x.category)&&Number(o.amount)===Number(x.amount))));
  x.originId=possible.length?'':'new';x.matchConfirmed=!possible.length;x.matchMethod=possible.length?'ambiguous':'new';
 }
}
function changeMappingHtml(){

}
function setChangeMatch(i,value){costDraft.items[i].originId=value;costDraft.items[i].matchConfirmed=!!value;costDraft.items[i].matchMethod='manual';costDraft.confirmed=false;costEditor.mappingAck=false;renderCostRows();}

async function reviewCostChange(result){

 if(result!=='approved'&&!opinion)return toast('请填写退回或拒绝原因');
 costActionBusy=true;
 try{await costMutate(data=>{
  const c=data.costChanges.find(x=>x.id===selectedCostChange);if(!c||c.status!=='pending'||c.reviewer!==activeRole)throw Error('申请已处理或当前角色不是对应审核主管');
  const t=costTrip(data,c.tripRef);if(t.costVersion!==c.baseVersion)throw Error('有效成本版本已变化，请退回重新核对');
  const risks=changeRisks(data,c);
  if(result==='approved'&&costRiskSignature(risks)!==signature){db=data;throw Error('最新付款占用已变化，请重新查看并确认风险后通过');}
  if(result==='approved'&&risks.length&&!ack)throw Error('请勾选确认最新付款占用风险');
  c.status=result;c.updatedAt=costTime();c.reviewRisk=costClone(risks);c.opinion=opinion;c.reviewedBy=activeRole;
  if(result==='approved'){
   t.costVersion++;c.approvedVersion=t.costVersion;
   t.costVersions.push({number:t.costVersion,items:costClone(c.items),total:aggregateCostItems(c.items).total,file:c.file,attachmentKey:c.attachmentKey,actor:activeRole,at:costTime(),changeId:c.id});
   t.costItems=costClone(c.items);t.budget=aggregateCostItems(c.items).total;t.file=c.file;t.costConfirmedAt=new Date().toISOString();
  }
  costRecord(c,costChangeStatuses[result],opinion);costAudit(data,c.id+' '+costChangeStatuses[result]);
 });render();toast(result==='approved'?'成本变更已通过，新版本生效':'成本变更'+costChangeStatuses[result]);
 }catch(e){if(e.message.includes('占用已变化'))render();toast(e.message);}finally{costActionBusy=false;}
}

function paymentRiskSignature(check){return JSON.stringify([check.risk,check.version,check.costId,check.used,check.limit,check.pendingId,check.pendingAmount]);}
checkPayment=function(a,data=db){
 const t=costTrip(data,a.tripUid||a.trip),messages=[],item=t?.costItems?.find(x=>x.id===a.costId),ref=t?tripReference(t):a.trip;
 const pending=t?pendingCostChange(data,ref):null,proposed=pending?.items.find(x=>x.id===a.costId),used=costLineUsage(data,ref,a.costId,a.id),amount=Number(a.amount)||0;
 let risk=false;
 if(!t?.costConfirmed){risk=true;messages.push('该团尚无已确认成本，无法核对有效额度。');}
 else if(!item){risk=true;messages.push(proposed?'新增待审成本明细：'+proposed.category+' / '+proposed.name+'，尚无已生效预算依据。':'未匹配当前有效成本明细，请主管核对依据。');}
 else{
  const cumulative=Math.round((used+amount)*100)/100;risk=cumulative>Number(item.amount);
  messages.push('对应 '+item.category+' / '+(item.name||item.category)+'；有效成本 ¥'+money(item.amount)+'；其他已付及有效审批占用 ¥'+money(used)+'；本次 ¥'+money(amount)+'；累计 ¥'+money(cumulative)+'。');
  messages.push(risk?'超过有效成本 ¥'+money(cumulative-item.amount)+'，仅提示风险，由主管判断。':'累计金额未超过有效成本，仍需主管审核。');
 }
 if(pending)messages.push('成本变更 '+pending.id+' 待审'+(proposed?'，该明细拟定金额 ¥'+money(proposed.amount):item?'，待审版本拟删除该明细':'')+'；以有效 V'+t.costVersion+' 为准，付款通过不代表成本变更通过。');
 return {risk,messages,version:t?.costVersion||null,source:item?.source||'',costId:a.costId,used,limit:item?Number(item.amount):null,pendingId:pending?.id||null,pendingAmount:proposed?.amount??null,time:new Date().toISOString(),engine:'有效成本及占用核对'};
};

paymentValidate=function(d,data){
 const fee=d.fee.split('|').at(-1),transfer=d.type==='资金往来'&&fee==='内部资金调拨',legacy={...d,due:'not-applicable',company:d.company||'选填',recipient:'由收款方式校验',channel:d.channel||'方式待选',payee:d.payee||'由条件字段校验',month:'not-applicable'};
 // Base validation's monthly special case is obsolete; validate overseas archive as a per-order business.
 const maskedData={...data,trips:data.trips.map(t=>({...t,category:t.category==='OVERSEAS'?'COTA':t.category}))};
 let errors;
 if(d.type==='业务付款'&&d.business==='OVERSEAS'){
  const dummyPlatform=Object.keys(TRIP_PLATFORMS)[0],dummyProduct=Object.keys(TRIP_PRODUCTS)[0];
  const t=costTrip(data,d.tripRef);legacy.business='COTA';legacy.platform=dummyPlatform;legacy.product=dummyProduct;legacy.orderNo=t?.externalOrder||'待校验';
  maskedData.trips=maskedData.trips.map(x=>x.uid===t?.uid?{...x,platform:dummyPlatform,product:dummyProduct}:x);
  errors=inheritedValidate(legacy,maskedData);
  if(!OVERSEAS_PLATFORMS[d.platform]||!OVERSEAS_PRODUCTS[d.product])errors.push('请选择海外平台及业务项目');
  if(t&&!payArchiveMatches(t,d))errors.push('团档与当前业务条件不一致');
 }else{legacy.orderNo=d.type==='业务付款'?costTrip(data,d.tripRef)?.externalOrder||d.orderNo:d.orderNo;errors=inheritedValidate(legacy,data);}
 if(d.type==='员工薪酬'&&fee==='业务提成'&&data.settlements?.some(x=>x.id===d.originalRef&&['confirmed','locked'].includes(x.status)))errors=errors.filter(x=>x!=='提成须关联已有业务或月度档案');
 if(d.company&&!COMPANY_OPTIONS.includes(d.company))errors.push('请选择有效公司主体或留空');
 if(d.type==='业务付款'){
  const t=costTrip(data,d.tripRef);if(t?.archiveKind==='monthly')errors.push('付款必须关联独立团档，不能使用月度汇总档案');

  if(d.channel==='二维码收款'&&!d.qrName)errors.push('请上传收款二维码图片');
 }
 return [...new Set(errors)];
};

function settlementValidate(d,data,confirm=false){
 const errors=[];if(!OWNER_ENTRIES.some(([v])=>v===d.owner)||!OVERSEAS_PLATFORMS[d.platform]||d.product!=='RJT'||!/^\d{4}-(0[1-9]|1[0-2])$/.test(d.month))errors.push('请选择归属、海外平台、入境团项目和结算所属月份');
 if(!d.reference.trim())errors.push('请填写平台结算单／收款核对编号');
 if(!['CNY','USD','EUR','JPY','HKD'].includes(d.currency))errors.push('请选择有效结算币种');
 const old=data.settlements.find(x=>x.id===d.id);if(old?.status==='locked')errors.push('该记录已锁定，须走调整流程，不能直接修改');
 if(old&&old.version!==d.version)errors.push('核对记录已被其他页面更新，请重新打开');
 if(confirm){
  if(!d.receivedDate)errors.push('请填写实际收款日期');
  if(!Number.isFinite(+d.net)||+d.net<=0||!Number.isFinite(+d.deductions)||+d.deductions<0)errors.push('实收须大于0，扣款合计不可为负数');
  if(!Object.keys(d.selected).length)errors.push('请点选本次结算收入对应的团档');
  const candidates=new Set(settlementCandidate(data,d).map(tripReference));
  for(const [ref,amount]of Object.entries(d.selected))if(!candidates.has(ref)||amount===''||!Number.isFinite(+amount)||+amount<=0)errors.push('请核对所选团档范围，并为每个团填写正数归属金额');
  if(settlementTotals(d).difference!==0)errors.push('归属金额减扣款须等于实收，请核对平台结算单');
  if(+d.deductions>0&&!d.reason.trim())errors.push('存在平台扣款时请说明佣金／手续费／退款等构成');
  if(data.settlements.some(x=>x.id!==d.id&&['confirmed','locked'].includes(x.status)&&x.owner===d.owner&&x.platform===d.platform&&x.reference.trim()===d.reference.trim()))errors.push('该平台结算编号已有已确认记录，请勿重复计入');
 }
 return [...new Set(errors)];
}

  }else if(['收到借款','收到投资款'].includes(d.transferType)&&!d.originalRef.trim())e.push('请填写相关依据说明');

function rcEffects(data,r){if(r?.status!=='confirmed')return {};const out={[r.accountId]:rcCents(r.amount)};

function rcApply(data,before,after){const a=rcEffects(data,before),b=rcEffects(data,after);for(const id of new Set([...Object.keys(a),...Object.keys(b)])){const delta=(b[id]||0)-(a[id]||0);if(!delta)continue;if(id==='bank')data.balance=(rcCents(data.balance)+delta)/100;else{const account=rcAccount(data,id);if(!account)throw Error('账户不存在，请刷新');account.balance=(rcCents(account.balance)+delta)/100;}}

function rcCommit(data,d,action){
 rcMigrate(data);if(!rcCreate())throw Error('当前角色无收款登记权限');const old=data.receipts.find(r=>r.id===d.id),before=old&&costClone(old);
 if(old&&old.version!==d.version)throw Error('记录已被其他页面更新，请重新打开');
 if(action==='draft'&&old&&!['draft','returned'].includes(old.status))throw Error('当前记录不能保存为草稿');
 if(action==='correct'){if(!rcFinance()||old?.status!=='confirmed')throw Error('仅财务可更正已确认记录');if(!d.changeReason.trim())throw Error('请填写更正原因');if(old.type!==d.type)throw Error('更正不切换收款类型；请按业务原因另行处理');}
 else if(old&&(!['draft','returned'].includes(old.status)||old.creator!==activeRole))throw Error('记录状态已变化或无编辑权限');
 if(old?.status==='confirmed'){const refunds=data.apps.filter(a=>a.originalRef===old.id&&a.fee==='客户退款'&&!a.special);for(const ref of new Set(refunds.map(a=>a.tripUid))){const used=refunds.filter(a=>a.tripUid===ref).reduce((n,a)=>n+rcCents(a.amountCNY??a.amount),0),assigned=d.allocations.filter(a=>a.ref===ref).reduce((n,a)=>n+rcCents(a.amount),0);if(assigned<used)throw Error('该收款已有客户退款占用，请先处理关联退款再更正分配');}}
 if(old?.status==='confirmed'&&old.type==='客户预存款'&&rcFundingUsed(data,old.id)&&(old.walletId!==d.walletId||rcCents(old.amount)!==rcCents(d.amount)))throw Error('该充值已被消费，请先处理相应抵扣再调整充值');
 const confirmed=action==='correct'||action==='submit'&&rcFinance();
 if(action!=='draft'){const errors=rcValidate(d,data,confirmed);if(errors.length)throw Error(errors.join('；'));}
 const next=rcSnapshot(d,data);next.creator=old?.creator||activeRole;next.createdAt=old?.createdAt||costTime();next.status=confirmed?'confirmed':action==='draft'?'draft':'pending';next.version=(old?.version||0)+1;
 next.history=costClone(old?.history||[]);next.history.push({time:costTime(),actor:activeRole,action:action==='correct'?'更正已确认收款':action==='draft'?'保存草稿':confirmed?'登记并确认到账':'提交财务确认',reason:d.changeReason||d.reviewNote||'',before:before?{...before,history:undefined}:null});
 if(confirmed){next.confirmedBy=old?.confirmedBy||activeRole;next.confirmedAt=old?.confirmedAt||costTime();}
 if(old)Object.assign(old,next);else data.receipts.unshift(next);rcApply(data,before,next);rcFlagCommission(data,next);costAudit(data,next.id+' '+next.history.at(-1).action);return next.id;

function rcFlagCommission(data,r){const ids=new Set([...(r.allocations||[]).map(a=>a.ref),...(r.history.at(-1)?.before?.allocations||[]).map(a=>a.ref)]);r.commissionReview=[...(data.commissionBatches||[])].filter(b=>(b.tripRefs||[]).some(ref=>ids.has(ref))).map(b=>b.id);}
function rcAct(data,id,version,action,reason){rcMigrate(data);const r=data.receipts.find(r=>r.id===id);if(!rcFinance()||!r)throw Error('仅财务可处理该收款');if(r.version!==version)throw Error('记录已更新，请刷新后重试');const before=costClone(r);
 if(action==='confirm'){if(r.status!=='pending')throw Error('申请已处理，不能重复确认');r.reviewNote=reason;const e=rcValidate(r,data,true);if(e.length)throw Error(e.join('；'));r.status='confirmed';r.confirmedBy=activeRole;r.confirmedAt=costTime();}
 else if(action==='return'){if(r.status!=='pending'||!reason.trim())throw Error('请填写退回原因，且只可退回待确认记录');r.status='returned';}
 else if(action==='cancel'){if(r.status!=='confirmed'||!reason.trim())throw Error('请填写撤销原因，且只可撤销已确认记录');if(r.type==='客户预存款'&&rcFundingUsed(data,r.id))throw Error('该充值已消费，请先处理对应抵扣或退款');if(data.apps.some(a=>a.originalRef===id&&!a.special))throw Error('该收款已关联客户退款或提成申请，请先处理关联记录');r.status='cancelled';}

function rcOffset(data,walletId,tripRef,amount,reason){rcMigrate(data);if(!rcFinance())throw Error('请切换财务角色执行抵扣');const w=data.customerWallets.find(w=>w.id===walletId),t=costTrip(data,tripRef);if(!w||!t||t.archiveKind==='monthly')throw Error('请选择钱包和已有独立团档');if(w.currency!==(t.currency||'CNY'))throw Error('钱包与团账币种须一致');if(!Number.isFinite(+amount)||+amount<=0||rcCents(amount)>rcCents(rcWalletBalance(data,w.id)))throw Error('抵扣金额无效或钱包余额不足');if(!reason.trim())throw Error('请填写抵扣说明');
 let remaining=rcCents(amount),funding=[];for(const r of data.receipts.filter(r=>r.status==='confirmed'&&r.walletId===w.id).slice().reverse()){const used=data.receiptOffsets.filter(o=>o.status==='active').flatMap(o=>o.funding||[]).filter(f=>f.receiptId===r.id).reduce((n,f)=>n+rcCents(f.amount),0),take=Math.min(remaining,Math.max(0,rcCents(r.amount)-used));if(take){funding.push({receiptId:r.id,amount:take/100});remaining-=take;}}

async function rcSave(e,action){e?.preventDefault();if(receiptBusy||receiptUploadBusy)return toast('正在处理，请稍候');receiptBusy=true;try{if(action!=='draft')for(const a of receiptDraft.attachments)if(!await tripAttachment('readonly',s=>s.get(a.key)))throw Error('到账凭证缺失，请重新上传');const d=costClone(receiptDraft);let id;await costMutate(data=>{id=rcCommit(data,d,action);});receiptSelected=id;receiptMode='detail';rcReleaseUrls();render();toast(action==='draft'?'收款草稿已保存':action==='correct'?'收款已更正，历史已保留':rcFinance()?'确认到账成功':'已提交，等待财务确认');}catch(e){rcError(e);}finally{receiptBusy=false;}}

async function rcAction(id,version,action){if(receiptBusy)return;receiptBusy=true;try{const reason=payVal('r-action-reason');if(action==='confirm'){const r=db.receipts.find(r=>r.id===id);for(const a of r?.attachments||[])if(!await tripAttachment('readonly',s=>s.get(a.key)))throw Error('到账凭证缺失，请退回重新上传');}await costMutate(data=>rcAct(data,id,version,action,reason));render();toast({confirm:'确认到账成功',return:'已退回修改',cancel:'已撤销并回退对应影响'}[action]);}catch(e){rcError(e);}finally{receiptBusy=false;}}

 return `<div class="panel"><div class="panelhead"><div><h3>${esc(r.id)}</h3><span class="tag">${RECEIPT_STATES[r.status]}</span> <span class="tag">${rcAllocationState(r)}</span></div><button class="alt" onclick="rcList()">返回收款记录</button></div><p><b>${esc(r.type)} · ${esc(r.currency||rcCurrency(r,db))} ${money(r.amount||0)}</b></p><p>付款方：${esc(r.payer)} · 实际到账：${esc(r.date)} · 归属：${esc(r.owner||'见分配明细')}</p><p>收款账户：${esc(r.accountName)} · 公司主体：${esc(r.company)} · 币种：${esc(r.currency)}</p>${r.platform?'<p>平台：'+esc(({...TRIP_PLATFORMS,...OVERSEAS_PLATFORMS})[r.platform])+' · 业务项目：'+esc((OVERSEAS_PLATFORMS[r.platform]?OVERSEAS_PRODUCTS:TRIP_PRODUCTS)[r.product])+' · 结算所属月份 '+esc(r.month)+'</p>':''}${r.transferType?'<p>往来类别：'+esc(r.transferType)+' · 对象：'+esc(r.counterparty)+' · 依据／原记录：'+esc(r.originalRef)+'</p>':''}${r.walletId?'<p>客户钱包：'+esc(db.customerWallets.find(w=>w.id===r.walletId)?.name)+'</p>':''}<p>备注／退款原因：${esc(r.note||r.refundReason||'—')}</p><p class="note">提报：${esc(r.creator)} · ${esc(r.createdAt)}<br>财务确认：${esc(r.confirmedBy||'尚未确认')} · ${esc(r.confirmedAt||'')}</p>

function rcEnsureWallet(data,customerId,name,currency='CNY'){
 rcMigrate(data);if(!rcCreate())throw Error('当前角色无钱包维护权限');name=String(name||'').trim();if(!name&&!customerId)throw Error('请先选择已有客户，或填写新客户名称');if(name&&customerId)throw Error('已有客户和新客户名称只需填写一项，请清空另一项');if(currency!=='CNY')throw Error('当前原型仅支持人民币钱包');
 let c=name?data.receiptCustomers.find(c=>c.name===name):data.receiptCustomers.find(c=>c.id===customerId);if(!c&&name){c={id:'KH-'+costUid(),name};data.receiptCustomers.push(c);}if(!c)throw Error('客户不存在，请重新选择');
 const existing=data.customerWallets.find(w=>w.customerId===c.id&&w.currency===currency);if(existing)return {walletId:existing.id,customerId:c.id,reused:true,name:existing.name};
 const w={id:'YC-'+costUid(),name:c.name+' · 预存钱包',customerId:c.id,currency,opening:0,balance:0};data.customerWallets.push(w);costAudit(data,'建立客户空钱包 '+c.name);return {walletId:w.id,customerId:c.id,reused:false,name:w.name};
}

async function rcSeedFixtures(){if(!rcFinance())return;try{await costMutate(data=>{rcMigrate(data);if(!data.trips.length)throw Error('请先在概览载入虚构测试团档');if(data.apps.some(a=>a.id==='DEMO-PAID-REFUND'))throw Error('虚构测试资料已载入，无需重复');const t=data.trips[0],ref=tripReference(t);data.apps.push({id:'DEMO-PAID-REFUND',tripUid:ref,trip:t.id,owner:t.owner,stage:4,paymentType:'业务付款',fee:'住宿',vendor:'虚构演示酒店',amount:1000,amountCNY:1000,currency:'CNY',rate:1,creator:'操作 / 江婧婕',note:'虚构已付酒店款（仅退款测试）',paydate:'2026-09-01',history:['载入虚构测试资料'],basis:'虚构演示',account:'模拟公司银行账户'});data.paymentReceipts.push({id:'DEMO-PAY-REC',applicationId:'DEMO-PAID-REFUND',amount:1000,source:'bank',date:'2026-09-01',internal:false,debitApplied:true});data.balance=rcAmount(data.balance-1000);costAudit(data,'载入虚构已付款1000元用于退款测试，模拟余额同步减少');});render();toast('已载入虚构已付款1000元，可测试供应商退款');}catch(e){rcError(e);}}

(() => {
 let count=0;
 function enhance(select){
  if(select.dataset.searchable)return;
  select.dataset.searchable='true';
  const box=document.createElement('span'),input=document.createElement('input'),arrow=document.createElement('button'),list=document.createElement('span');
  box.className='search-select';input.type='text';input.autocomplete='off';input.setAttribute('role','combobox');input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-expanded','false');
  list.id='select-options-'+(++count);list.setAttribute('role','listbox');list.hidden=true;input.setAttribute('aria-controls',list.id);
  const label=select.closest('label');input.setAttribute('aria-label',(label?.firstChild?.textContent||'请选择').trim());
  arrow.type='button';arrow.className='select-arrow';arrow.textContent='⌄';arrow.setAttribute('aria-label','展开选项');arrow.tabIndex=-1;
  select.before(box);box.append(input,arrow,list);select.classList.add('native-search-select');select.tabIndex=-1;
  const text=()=>select.selectedOptions[0]?.textContent||'';
  function close(){list.hidden=true;input.value=text();input.setAttribute('aria-expanded','false');}
  function sync(){input.disabled=select.disabled;arrow.disabled=select.disabled;input.value=text();input.setAttribute('aria-required',String(select.required));if(select.disabled)close();}
  function open(query=''){
   if(select.disabled)return;
   list.replaceChildren();
   Array.from(select.options).filter(o=>!o.disabled&&o.textContent.toLowerCase().includes(query.trim().toLowerCase())).forEach(o=>{
    const button=document.createElement('button');button.type='button';button.setAttribute('role','option');button.setAttribute('aria-selected',String(o.selected));button.textContent=(o.parentElement.tagName==='OPTGROUP'?o.parentElement.label+' · ':'')+o.textContent;
    button.onmousedown=e=>e.preventDefault();button.onclick=e=>{e.preventDefault();select.value=o.value;select.dispatchEvent(new Event('change',{bubbles:true}));close();input.focus();};list.append(button);
   });
   if(!list.children.length){const empty=document.createElement('span');empty.className='empty';empty.textContent='无匹配选项';list.append(empty);}
   list.hidden=false;input.setAttribute('aria-expanded','true');
  }
  input.addEventListener('focus',()=>open());input.addEventListener('click',()=>open());input.addEventListener('input',()=>open(input.value));
  input.addEventListener('keydown',e=>{if(e.key==='Escape'){close();e.preventDefault();}if(e.key==='ArrowDown'){if(list.hidden)open();list.querySelector('button')?.focus();e.preventDefault();}if(e.key==='Enter'){if(!list.hidden){list.querySelector('button')?.click();e.preventDefault();}}});
  list.addEventListener('keydown',e=>{const buttons=[...list.querySelectorAll('button')],i=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus();e.preventDefault();}if(e.key==='Escape'){close();input.focus();close();}});
  box.addEventListener('focusout',()=>setTimeout(()=>{if(!box.contains(document.activeElement))close();},0));
  arrow.onclick=e=>{e.preventDefault();if(list.hidden){input.focus();open();}else close();};
  select.addEventListener('change',sync);select.addEventListener('invalid',()=>{input.focus();input.setCustomValidity('请从下拉选项中选择');input.reportValidity();input.setCustomValidity('');});
  new MutationObserver(sync).observe(select,{childList:true,subtree:true,attributes:true});sync();
 }
 const scan=()=>document.querySelectorAll('select:not([data-searchable])').forEach(enhance);
 new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});scan();
})();
