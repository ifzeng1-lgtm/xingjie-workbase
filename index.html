function cfRoute(data,a){const t=costTrip(data,a.tripUid||a.trip),dep=t?.dep||a.owner?.split(':').slice(1).join(':')||'总经办',rules=cfData(data).records.filter(r=>r.active&&r.group==='审批流程'&&r.matter==='付款申请'&&r.dep===dep&&(!r.project||r.project===t?.project)&&(!r.business||r.business===a.business));return rules.sort((x,y)=>Number(!!y.project)+Number(!!y.business)-Number(!!x.project)-Number(!!x.business))[0];}
function cfSnapshotRoute(data,a){const r=cfRoute(data,a);if(!r)return;a.configFlow={id:r.id,version:r.rev,index:0,nodes:costClone(r.nodes)};a.stage=['主管','财务','总经理'].indexOf(r.nodes[0].role);a.reviewer=r.nodes[0].role+' / '+r.nodes[0].person;}
const cfPriorMutate=costMutate;costMutate=action=>cfPriorMutate(data=>{cfInit(data);const ids=new Set(data.apps.map(x=>x.id));const r=action(data);for(const a of data.apps)if(!ids.has(a.id)&&a.schema===3&&!a.id.startsWith('DEMO')&&!a.id.startsWith('ST-DEMO'))cfSnapshotRoute(data,a);return r;});
function cfCurrentActor(data,a){const n=a.configFlow?.nodes[a.configFlow.index];if(!n||a.stage>=3)return '';const original=n.role+' / '+n.person,date=emDay();const d=cfData(data).records.find(r=>r.group==='临时代办'&&r.active&&r.person===n.person&&r.from<=date&&r.to>=date);return d?n.role+' / '+d.delegate:original;}
function cfPaymentAct(data,id,pass,note,ack,signature){const a=data.apps.find(x=>x.id===id);stAssert(a?.configFlow&&!a.special&&a.stage<3&&cfCurrentActor(data,a)===activeRole,'不是当前指定审核人，或申请已处理');if(pass===true){const check=checkPayment(a,data);if(a.configFlow.index===0){stAssert(signature===paymentRiskSignature(check),'付款风险已变化，请刷新');stAssert(!check.risk||ack&&note?.trim(),'风险付款须勾选确认并填写处理意见');a.supervisorRisk=costClone(check);a.riskOpinion=note;}a.configFlow.index++;if(a.configFlow.index>=a.configFlow.nodes.length)a.stage=3;else{const n=a.configFlow.nodes[a.configFlow.index];a.stage=['主管','财务','总经理'].indexOf(n.role);a.reviewer=n.role+' / '+n.person;}}else{stAssert(note?.trim(),'退回／拒绝须填写意见');a.special=pass===false?'退回修改':pass;}a.history.push(costTime()+' · '+activeRole+' '+(pass===true?'同意':a.special)+'：'+(note||''));costAudit(data,id+' 按配置流程处理');}
const cfPriorApprove=approve;approve=function(id){const a=db.apps.find(x=>x.id===id);if(!a?.configFlow)return cfPriorApprove(id);return bzRun(d=>cfPaymentAct(d,id,true,payVal('opinion'),!!payRead('riskack')?.checked,payVal('paymentReviewRisk')));};
const cfPriorReject=reject;reject=function(id,status){const a=db.apps.find(x=>x.id===id);if(!a?.configFlow)return cfPriorReject(id,status);return bzRun(d=>cfPaymentAct(d,id,status,payVal('opinion')));};
const cfPriorPaymentDetail=newPaymentDetail;newPaymentDetail=function(a){let html=cfPriorPaymentDetail(a);if(!a.configFlow)return html;const actor=cfCurrentActor(db,a),check=checkPayment(a,db);html=html.replace(/<div class="steps">[\s\S]*?<\/div>/,'');html=html.replace(/<label>审核意见[\s\S]*?<\/div>/,'');if(a.stage<3&&!a.special){html+=`<section class="panel"><h3>审批流程 V${a.configFlow.version}</h3><div class="steps">${a.configFlow.nodes.map((n,i)=>`<span class="step ${i===a.configFlow.index?'now':''}">${esc(n.person)} · ${esc(n.role)}</span>`).join('')}</div><p>当前待 ${esc(actor)}</p>${actor===activeRole?`<input id="paymentReviewRisk" type="hidden" value="${esc(paymentRiskSignature(check))}"><label>审核意见<textarea id="opinion"></textarea></label>${a.configFlow.index===0&&check.risk?'<label class="st-check"><input type="checkbox" id="riskack">已核对付款风险</label>':''}<button onclick="approve(${emArg(a.id)})">同意</button><button class="alt" onclick="reject(${emArg(a.id)},'退回修改')">退回</button><button class="bad" onclick="reject(${emArg(a.id)},'已拒绝')">拒绝</button>`:''}</section>`;}return html;};
const cfPriorTasks=emTasks;emTasks=function(data=db){const all=cfPriorTasks(data),map=new Map(all.map(x=>[x.key,x]));for(const a of data.apps.filter(a=>a.configFlow)){const key='payment:'+a.id,actor=cfCurrentActor(data,a),mine=actor===activeRole&&!a.special&&a.stage<3;let t=map.get(key);if(!t&&mine)t={kind:'payment',id:a.id,key,title:a.note||'付款申请',ref:stRef(data,a),record:a,creator:a.creator,amount:a.amountCNY??a.amount};if(t){t.action=mine||a.special==='退回修改'&&a.creator===activeRole;t.status=a.special||(a.stage<3?'待'+actor.split(' / ')[1]+'核对':state(a));t.done=['已拒绝','已撤回'].includes(a.special)||a.stage===4;t.version=a.configFlow.index+':'+a.history.length;t.signature=JSON.stringify([t.status,t.version,t.amount]);map.set(key,t);}}return [...map.values()].sort((a,b)=>Number(b.action)-Number(a.action));};
/* Complete account metadata, readable differences and focused accounting tabs. */
const cfPriorBody=bzConfigBody;bzConfigBody=function(){let html=cfPriorBody();if(gmConfig()&&bzTab==='账户与期初')html=html.replace('<button>提交账户配置</button>',`${bzSelect('cf-account-type','账户类型',[['银行','银行'],['支付宝','支付宝'],['微信','微信'],['其他','其他']],'银行')}${bzText('cf-account-bank','开户行（银行账户填写）')}${bzText('cf-account-number','账号')}<button>提交账户配置</button>`);if(gmConfig()&&bzTab==='费用与分摊'){const cut=html.indexOf('<h3>公共费用部门比例</h3>');if(cut>=0)html=cfTab==='公共费用分摊'?html.slice(cut):html.slice(0,cut);}return html;};
const cfPriorSubmitConfig=bzSubmitConfig;bzSubmitConfig=function(data,kind,v,reason,expected){if(kind==='account')v={...v,type:payVal('cf-account-type')||v.type||'银行',bank:payVal('cf-account-bank')||v.bank||'',number:payVal('cf-account-number')||v.number||''};return cfPriorSubmitConfig(data,kind,v,reason,expected);};
const cfPriorConfirmAccount=bzConfirmConfig;bzConfirmConfig=function(data,id,version){const c=data.biz.changes.find(x=>x.id===id),r=cfPriorConfirmAccount(data,id,version);if(c?.kind==='account')Object.assign(rcAccount(data,c.value.id),{type:c.value.type,bank:c.value.bank,number:c.value.number});return r;};
cfDisplay=function(v){if(v===undefined||v===null)return '—';if(Array.isArray(v))return v.map(x=>typeof x==='object'?(x.role+'／'+x.person):x).join('；');if(typeof v==='object')return Object.entries(v).filter(([k])=>!['qr','id','rev'].includes(k)).map(([k,x])=>k+'：'+cfDisplay(x)).join('；');if(String(v).startsWith('data:image'))return '二维码图片';return String(v);};
const cfPriorApplyConfig=bzApplyConfig;bzApplyConfig=function(data){cfPriorApplyConfig(data);if(!data.biz?.configWorkspace)return;const rules=data.biz.configWorkspace.records.filter(r=>r.group==='提成规则'&&r.active&&r.from<=stMonth()).sort((a,b)=>b.from.localeCompare(a.from));if(rules[0])for(const k of ['sales','operatorA','operatorB'])data.biz.defaults[k]=+rules[0][k];};
const cfPriorValidateMore=cfValidate;cfValidate=function(data,r){cfPriorValidateMore(data,r);if(r.group==='审批流程')for(const n of r.nodes)stAssert(data.biz.people.some(p=>p.active&&p.name===n.person&&p.role===n.role),'审核人员须具备所选节点角色');if(r.group==='临时代办'){const roles=data.biz.people.filter(p=>p.active&&p.name===r.person).map(p=>p.role);stAssert(data.biz.people.some(p=>p.active&&p.name===r.delegate&&roles.includes(p.role)),'代办人须具备相应角色');}};
function cfFindWorkflow(data,matter,t){return cfData(data).records.filter(r=>r.active&&r.group==='审批流程'&&r.matter===matter&&r.dep===t.dep&&(!r.project||r.project===t.project)&&(!r.business||r.business===t.category)).sort((x,y)=>Number(!!y.project)+Number(!!y.business)-Number(!!x.project)-Number(!!x.business))[0];}
function cfStampOther(data,record,matter){const t=costTrip(data,record.tripRef);if(!t)return;const r=cfFindWorkflow(data,matter,t);if(!r)return;record.configFlow={id:r.id,version:r.rev,nodes:costClone(r.nodes)};const manager=r.nodes.find(n=>n.role==='主管');if(manager)record[matter==='提成'?'supervisor':'reviewer']='主管 / '+manager.person;if(matter==='经营核对'){const fin=r.nodes.find(n=>n.role==='财务');if(fin)record.financeReviewer='财务 / '+fin.person;}}
const cfMutatePayment=costMutate;costMutate=action=>cfMutatePayment(data=>{const costs=new Map(data.costChanges.map(x=>[x.id,x.status])),reviews=new Set(data.biz.reviews.map(x=>x.id)),sheets=new Set(data.commissionSheets.map(x=>x.id)),payments=new Map(data.apps.map(a=>[a.id,{special:a.special,flow:a.configFlow?costClone(a.configFlow):null}]));const result=action(data);for(const c of data.costChanges)if(c.status==='pending'&&costs.get(c.id)!=='pending')cfStampOther(data,c,'成本变更');for(const r of data.biz.reviews)if(!reviews.has(r.id))cfStampOther(data,r,'经营核对');for(const s of data.commissionSheets)if(!sheets.has(s.id))cfStampOther(data,s,'提成');for(const a of data.apps){const old=payments.get(a.id);if(old?.special&&!a.special&&old.flow){a.configFlow={...old.flow,index:0};const n=a.configFlow.nodes[0];a.stage=['主管','财务','总经理'].indexOf(n.role);a.reviewer=n.role+' / '+n.person;}}return result;});
const cfPriorActReview=bzActReview;bzActReview=function(data,id,v,action,input){const r=data.biz.reviews.find(x=>x.id===id);if(r?.financeReviewer&&r.status==='finance')stAssert(activeRole===r.financeReviewer,'请指定财务核定');return cfPriorActReview(data,id,v,action,input);};
</script><script>render();</script><script>// Keep native values and change handlers as the single source of truth.
(() => {
 let count=0;
 function enhance(select){
  if(select.dataset.searchable)return;
  select.dataset.searchable='true';
  const box=document.createElement('span'),input=document.createElement('input'),arrow=document.createElement('button'),list=document.createElement('span');
  box.className='search-select';input.type='text';input.autocomplete='off';input.setAttribute('role','combobox');input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-expanded','false');
  list.id='select-options-'+(++count);list.setAttribute('role','listbox');list.hidden=true;input.setAttribute('aria-controls',list.id);
  const label=select.closest('label');input.setAttribute('aria-label',(label?.firstChild?.textContent||'请选择').trim());
  arrow.type='button';arrow.className='select-arrow';arrow.textContent='⌄';arrow.setAttribute('aria-label','展开选项');arrow.tabIndex=-1;
  select.before(box);box.append(input,arrow,list);select.classList.add('native-search-select');select.tabIndex=-1;
  const text=()=>select.selectedOptions[0]?.textContent||'';
  function close(){list.hidden=true;input.value=text();input.setAttribute('aria-expanded','false');}
  function sync(){input.disabled=select.disabled;arrow.disabled=select.disabled;input.value=text();input.setAttribute('aria-required',String(select.required));if(select.disabled)close();}
  function open(query=''){
   if(select.disabled)return;
   list.replaceChildren();
   Array.from(select.options).filter(o=>!o.disabled&&o.textContent.toLowerCase().includes(query.trim().toLowerCase())).forEach(o=>{
    const button=document.createElement('button');button.type='button';button.setAttribute('role','option');button.setAttribute('aria-selected',String(o.selected));button.textContent=(o.parentElement.tagName==='OPTGROUP'?o.parentElement.label+' · ':'')+o.textContent;
    button.onmousedown=e=>e.preventDefault();button.onclick=e=>{e.preventDefault();select.value=o.value;select.dispatchEvent(new Event('change',{bubbles:true}));close();input.focus();};list.append(button);
   });
   if(!list.children.length){const empty=document.createElement('span');empty.className='empty';empty.textContent='无匹配选项';list.append(empty);}
   list.hidden=false;input.setAttribute('aria-expanded','true');
  }
  input.addEventListener('focus',()=>open());input.addEventListener('click',()=>open());input.addEventListener('input',()=>open(input.value));
  input.addEventListener('keydown',e=>{if(e.key==='Escape'){close();e.preventDefault();}if(e.key==='ArrowDown'){if(list.hidden)open();list.querySelector('button')?.focus();e.preventDefault();}if(e.key==='Enter'){if(!list.hidden){list.querySelector('button')?.click();e.preventDefault();}}});
  list.addEventListener('keydown',e=>{const buttons=[...list.querySelectorAll('button')],i=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus();e.preventDefault();}if(e.key==='Escape'){close();input.focus();close();}});
  box.addEventListener('focusout',()=>setTimeout(()=>{if(!box.contains(document.activeElement))close();},0));
  arrow.onclick=e=>{e.preventDefault();if(list.hidden){input.focus();open();}else close();};
  select.addEventListener('change',sync);select.addEventListener('invalid',()=>{input.focus();input.setCustomValidity('请从下拉选项中选择');input.reportValidity();input.setCustomValidity('');});
  new MutationObserver(sync).observe(select,{childList:true,subtree:true,attributes:true});sync();
 }
 const scan=()=>document.querySelectorAll('select:not([data-searchable])').forEach(enhance);
 new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});scan();
})();
</script></html>
