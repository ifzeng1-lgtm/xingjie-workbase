s:8px;padding:12px}.cost-category strong{font-size:18px} </style><aside><h1>行界 · 财务</h1><small>FINANCE WORKSPACE</small><nav id="nav"></nav><div class="note">最小闭环原型 · v0.3<br>演示数据仅保存在当前浏览器</div></aside><main><div class="top"><div><span class="muted">行界旅业 / 财务协同</span><h2 id="title"></h2></div><label>当前演示角色<select id="role" onchange="activeRole=this.value;render()"><option>操作 / 江婧婕</option><option>销售 / 示例销售员</option><option>主管 / 刘婷茹</option><option>财务 / 杜川黔</option><option>总经理 / 刘婷茹</option></select></label></div><div class="banner">模拟环境：角色切换用于流程走查，不是真实登录。成本表在本浏览器解析，付款采用规则核对；尚未接入AI模型、真实付款及飞书。</div><div id="app"></div></main><div id="toast" role="status"></div>
<script>
const KEY='xingjie-demo-v1',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{};db??={trips:[{id:'DZ-XJ-20261101',dep:'综合定制部',dest:'新疆',budget:20000,file:'示例成本报价表.xlsx'}],apps:[],logs:[],balance:100000,todos:[]};let page='概览',activeRole='操作 / 江婧婕',selected=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function log(t){db.logs.unshift({t,time:new Date().toLocaleString('zh-CN')});save()}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3000)}function go(p){page=p;render()}const money=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2});const statuses=['主管审核','财务审核','总经理审核','待付款','付款完成'];function state(a){return a.special||statuses[a.stage]}function getTrip(id){return db.trips.find(t=>t.id===id||t.uid===id)}function table(){return db.apps.length?`<table><tr><th>申请单 / 团号</th><th>用途 / 供应商</th><th>金额</th><th>当前状态</th><th></th></tr>${db.apps.map(a=>`<tr><td>${esc(a.id)}<div class="note">${esc(a.trip)}</div></td><td>${esc(a.note)}<div class="note">${esc(a.vendor)}</div></td><td>¥${money(a.amount)}</td><td><span class="tag">${state(a)}</span></td><td><button class="alt" onclick="selected='${a.id}';go('审批与付款')">查看</button></td></tr>`).join('')}</table>`:'<div class="empty">还没有付款申请。先创建一笔，体验完整审批流程。</div>'}
function render(){document.getElementById('title').textContent=page;document.getElementById('nav').innerHTML=['概览','团档案','申请付款','审批与付款','待办与记录'].map(x=>`<button class="${x===page?'active':''}" onclick="go('${x}')">${x}</button>`).join('');let html='';
if(page==='概览')html=`<div class="cards">${[['已建团',db.trips.length],['审批中',db.apps.filter(a=>a.stage<3&&!a.special).length],['待付款',db.apps.filter(a=>a.stage===3&&!a.special).length],['模拟账户余额','¥'+money(db.balance)]].map(([k,v])=>`<div class="card"><span class="muted">${k}</span><div class="num">${v}</div></div>`).join('')}</div><div class="panel"><h3>从一笔付款开始走查</h3><p class="muted">建团 → 操作提报 → 主管审核 → 财务审核 → 总经理审核 → 财务执行</p><div class="actions"><button onclick="go('团档案')">新建旅游团</button><button class="alt" onclick="go('申请付款')">使用示例团申请付款</button><button class="alt" onclick="seedApp()">载入一笔演示申请</button></div></div><div class="panel"><h3>最近付款申请</h3>${table()}</div>`;
if(page==='团档案')html=`<div class="panel"><h3>新建团档案</h3>${tripForm()}</div><div class="panel"><h3>团档案</h3><div id="savedCosts"></div><table><tr><th>团号</th><th>归属 / 目的地</th><th>已确认成本</th><th>成本附件 / 清单</th></tr>${db.trips.map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(t.dep)} / ${esc(t.dest)}</td><td>${t.costConfirmed?'¥'+money(t.budget):'待导入核对'}</td><td>${esc(t.file)}<br><button type="button" class="alt" onclick="showTripCosts('${t.id}')">查看成本清单</button></td></tr>`).join('')}</table></div>`;
if(page==='申请付款')html=`<div class="panel"><h3>团相关付款申请</h3>${!activeRole.startsWith('操作')?'<p class="risk">请切换到操作角色填写申请。</p>':`<form onsubmit="submitApp(event)" class="grid"><label>财务方向<input disabled value="付款"></label><label>关联方式<input disabled value="关联旅游团"></label><label class="wide">团号<select id="trip" required onchange="paymentCostOptions()">${db.trips.map(t=>`<option value="${esc(tripReference(t))}">${esc(t.id)}</option>`).join('')}</select></label><label>费用类别<input disabled value="定制团 · 从档案带出"></label><label class="wide">对应成本明细<select id="costItem" onchange="paymentCostPreview()"></select><div id="costHint" class="note"></div></label><label>用途 / 备注<textarea id="note" required placeholder="如：酒店30%预付款"></textarea></label><label>金额（人民币）<input id="amount" oninput="paymentCostPreview()" type="number" min="0.01" step="0.01" required></label><label>供应商<select id="vendor"><option>示例酒店 · 已准入</option><option>示例车队 · 已准入</option></select></label><label>对方收款方式<select disabled><option>银行转账</option></select></label><label>对方收款信息<input disabled value="供应商测试账户 · 尾号0001"><div class="note">模拟账号，不可用于真实付款。</div></label><label class="wide">付款依据<input type="file" id="basis"><span class="note"><input id="demoBasis" type="checkbox" style="width:auto"> 使用演示账单（模拟附件）</span></label><label class="risk">是否未收款先垫款<select id="advance" onchange="document.getElementById('cancelwrap').hidden=this.value!=='是'"><option>否</option><option>是</option></select></label><label id="cancelwrap" hidden class="risk">最晚取消时间<input type="datetime-local" id="cancel"></label><div id="paymentCheck" class="wide"></div><div class="wide"><button>提交付款审批</button></div></form>`}</div>`;
if(page==='审批与付款'){let a=db.apps.find(x=>x.id===selected);html=`<div class="panel"><h3>申请列表</h3>${table()}</div>`;if(a){let expected=['主管','财务','总经理','财务'][a.stage],can=activeRole.startsWith(expected)&&!a.special,spent=db.apps.filter(x=>sameTrip(x,a)&&x.stage===4).reduce((s,x)=>s+x.amount,0),check=checkPayment(a),risk=check.risk;html+=`<div class="panel"><div class="panelhead"><h3>${esc(a.id)}</h3><span class="tag">${state(a)}</span></div><div class="steps">${statuses.map((x,i)=>`<span class="step ${i===a.stage?'now':''}">${i+1} ${x}</span>`).join('')}</div><p>${esc(a.note)} · ${esc(a.trip)} · ¥${money(a.amount)}</p><p class="muted">成本明细：${esc(a.costName||'未关联')}　供应商：${esc(a.vendor)}　依据：${esc(a.basis)}</p>${checkPanel(check,a.check)}${a.stage<3&&!a.special?`<p>当前需要：<b>${expected}</b>处理。当前角色：${activeRole}</p>${can?`<label>审核意见<input id="opinion" placeholder="退回、拒绝时填写原因"></label>${risk&&a.stage===0?'<label><input id="riskack" type="checkbox" style="width:auto"> 已查看并确认本次成本风险</label>':''}<div class="actions"><button onclick="approve('${a.id}',${risk})">同意</button><button class="alt" onclick="reject('${a.id}','退回修改')">退回修改</button><button class="bad" onclick="reject('${a.id}','已拒绝')">拒绝申请</button></div>`:''}${activeRole.startsWith('操作')?`<div class="actions"><button class="alt" onclick="withdraw('${a.id}')">撤回申请</button></div>`:''}`:''}${a.stage===3&&!a.special?can?`<h3>财务付款执行</h3><form onsubmit="pay(event,'${a.id}')" class="grid"><label>结算方式<input disabled value="真实账户支付（模拟）"></label><label>公司付款账户<select id="account"><option>测试公司银行账户</option></select></label><label>实际付款日期<input type="date" id="paydate" required></label><label>付款水单<input type="file" id="slip"><span class="note"><input type="checkbox" id="mockslip" style="width:auto"> 使用演示水单（模拟附件）</span></label><label class="risk wide">跨月分摊设置<select disabled><option>本次团成本不做跨月分摊</option></select></label><div><button>确认付款完成（模拟）</button></div></form>`:'<p class="muted">全部审批通过，请切换财务角色执行付款。</p>':''}${a.stage===4?`<p class="tag">付款完成 · ${esc(a.account)} · ${esc(a.paydate)}</p><p>水单文件：${esc(a.slip)}（仅保存文件名）</p>`:''}${['退回修改','已撤回'].includes(a.special)&&activeRole.startsWith('操作')?`<form onsubmit="resubmit(event,'${a.id}')"><label>修改用途<textarea id="editnote" required>${esc(a.note)}</textarea></label><label>修改金额<input id="editamount" type="number" min="0.01" step="0.01" required value="${a.amount}"></label><div class="actions"><button>保留单号，重新提交首节点</button></div></form>`:''}<h3>申请轨迹</h3>${a.history.map(x=>`<div class="log">${esc(x)}</div>`).join('')}</div>`}}
if(page==='待办与记录')html=`<div class="panel"><h3>模拟通知记录及追票提醒</h3><p class="muted">仅模拟工作台通知，未连接飞书。追票上传和核验的实际功能在后续迭代。</p>${db.todos.map(t=>`<div class="log">${esc(t)}</div>`).join('')||'<div class="empty">暂无待办</div>'}</div><div class="panel"><h3>诊断日志</h3><button type="button" class="alt" onclick="exportDiagnostics()">导出诊断日志</button><div>${diagnosticRows()}</div></div><div class="panel"><h3>操作记录</h3>${db.logs.map(l=>`<div class="log"><small class="muted">${esc(l.time)}</small><p>${esc(l.t)}</p></div>`).join('')}</div><button class="bad" onclick="if(confirm('清空本浏览器模拟数据？')){localStorage.removeItem(KEY);location.reload()}">重置演示数据</button>`;document.getElementById('app').innerHTML=html;if(page==='团档案'&&canCreateTrip()){updateDestinations();updateTripCategory();renderImport()}if(page==='申请付款'&&activeRole.startsWith('操作'))paymentCostOptions();}

    field.closest('label').hidden = !visible;
    field.disabled = !visible;
    field.required = visible;
    if (!visible) field.value='';
  }
  updateTripPreview();
}
function tripBaseCode(category,destCode,date,platform,product) {
  if (!Object.hasOwn(TRIP_CATEGORIES,category) || !destCode || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  if (category==='COTA' && (!Object.hasOwn(TRIP_PLATFORMS,platform)||!Object.hasOwn(TRIP_PRODUCTS,product))) return '';
  const components = category==='COTA'?[category,platform,product]:[category,destCode];
  return [...components,date.replaceAll('-','')].join('-');
}
function nextTripCode(base,trips) {
  const used = new Set(trips.map(t=>t.id));
  if (!used.has(base)) return base;
  let index=1;
  while (used.has(base+'-'+String(index).padStart(2,'0'))) index++;
  return base+'-'+String(index).padStart(2,'0');
}
function currentTripBase() {
  return tripBaseCode(tripField('tripCategory').value,chosenDestination()?.code,tripField('date').value,tripField('tripPlatform').value,tripField('tripProduct').value);
}
function updateTripPreview() {
  const base=currentTripBase();
  tripField('tripPreview').textContent=base?nextTripCode(base,db.trips):'填完编号所需字段后显示';
}

async function tripAttachment(mode, action) {
  const dbHandle=await new Promise((resolve,reject)=>{
    let expired=false;
    const timer=setTimeout(()=>{expired=true;reject(new Error('成本附件存储连接超时，请关闭其他原型页面后重试'));},10000);
    const request=indexedDB.open('xingjie-trip-files',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('files');
    request.onsuccess=()=>{clearTimeout(timer);if(expired){request.result.close();return;}request.result.onversionchange=()=>request.result.close();resolve(request.result);};
    request.onerror=()=>{clearTimeout(timer);reject(request.error);};
    request.onblocked=()=>{clearTimeout(timer);expired=true;reject(new Error('成本附件存储被其他页面占用，请关闭其他原型页面后重试'));};
  });
  try {
    return await new Promise((resolve,reject)=>{
      const transaction=dbHandle.transaction('files',mode);
      const timer=setTimeout(()=>transaction.abort(),10000);
      const request=action(transaction.objectStore('files'));
      transaction.oncomplete=()=>{clearTimeout(timer);resolve(request.result);};
      transaction.onabort=()=>{clearTimeout(timer);reject(transaction.error||new Error('附件保存超时或已中止'));};
    });
  } finally { dbHandle.close(); }
}
async function downloadTripAttachment(uid) {
  try {
    const file=await tripAttachment('readonly',store=>store.get(uid));
    if (!file) return toast('当前浏览器没有该成本原文件');
    const url=URL.createObjectURL(file);
    const link=document.createElement('a');
    link.href=url;
    link.download=file.name;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  } catch { toast('成本原文件读取失败'); }
}

    tripFeedback('请补齐或修正：'+names.join('、'),'字段校验');

    destinationCode:destination.code, departureDate:date,
    sales:tripField('tripSales').value, operatorA:tripField('tripOperatorA').value, operatorB:tripField('tripOperatorB').value,
    budget:costTotal(), file:costDraft.filename, costConfirmed:true, costVersion:1,

  const button=tripField('tripSave');

function paymentCostPreview(){let trip=document.getElementById('trip');if(!trip)return;let selected=getTrip(trip.value);let a={trip:selected?.id,tripUid:selected?.uid,costId:document.getElementById('costItem').value,amount:+document.getElementById('amount').value||0},check=checkPayment(a);document.getElementById('costHint').textContent='分次付款每次填本次实际金额；系统同时核对同明细已付及审批中金额。';document.getElementById('paymentCheck').innerHTML=checkPanel(check)}
function checkPayment(a){let t=getTrip(a.tripUid||a.trip),messages=[],item=t?.costItems?.find(x=>x.id===a.costId),v=t?.costVersion||null,used=0,risk=false;if(!t?.costConfirmed){risk=true;messages.push('无法判断：该团尚无已确认成本清单，不能按原手填预算判定通过。')}else if(!item){risk=true;messages.push('新增成本／未匹配：本次申请未关联已确认成本明细。')}else{used=db.apps.filter(x=>x.id!==a.id&&(typeof sameTrip==='function'?sameTrip(x,a):x.trip===a.trip)&&x.costId===a.costId&&!x.special).reduce((n,x)=>n+Number(x.amount),0);let cumulative=Math.round((used+a.amount)*100)/100;risk=cumulative>item.amount;messages.push('对应 '+item.category+' / '+item.name+'；成本额度 ¥'+money(item.amount)+'；其他已付及审批中 ¥'+money(used)+'；本次 ¥'+money(a.amount)+'；累计 ¥'+money(cumulative)+'。');messages.push(risk?'超出该明细成本额度 ¥'+money(cumulative-item.amount)+'，需主管确认风险。':'金额在该明细成本额度内，仍需主管审核。')}return {risk,messages,version:v,source:item?.source||'',time:new Date().toISOString(),engine:'规则核对（未接AI）'}}
function checkPanel(c,submitted){return `<div class="banner"><b>付款辅助检查 · ${c.risk?'需主管确认风险':'金额规则核对完成'}</b><p>${c.messages.map(esc).join('<br>')}</p><div class="note">依据：${c.version?'已确认成本 V'+c.version+' · '+esc(c.source||'无匹配明细'):'无已确认成本版本'}。当前为表格解析＋金额规则核对，未接AI模型；不判断服务范围、价格合理性或付款依据真伪，不自动批准。${submitted?' 提交检查时间：'+esc(new Date(submitted.time).toLocaleString('zh-CN')):''}</div>${submitted&&submitted.messages.join()!==c.messages.join()?`<details><summary>查看提交时检查快照</summary>${submitted.messages.map(esc).join('<br>')}</details>`:''}</div>`}

function costWarningHtml(){return costDraft.warnings.map((warning,index)=>{
 if(typeof warning==='string')return '';
 if(warning.dismissed)return '';
 const item=costDraft.items.find(x=>x.id===warning.itemId);
 if(item&&(!item.include||String(item.amount??'').trim()!==''&&Number.isFinite(Number(item.amount))&&Number(item.amount)>=0))return '';
 if(!item&&warning.hadItem)return '';
 if(item)warning.hadItem=true;
 return `<div class="banner">${esc(warning.message)} <button type="button" class="alt" onclick="dismissCostWarning(${index})">忽略此行</button></div>`;
}).join('');}
function dismissCostWarning(index){costDraft.warnings[index].dismissed=true;document.getElementById('costWarnings').innerHTML=costWarningHtml();}

function aggregateCostItems(items){
 const categories=new Map();let totalCents=0;
 for(const item of items){const cents=Math.round((Number(item.amount)||0)*100);totalCents+=cents;const category=String(item.category||'未分类').trim()||'未分类';categories.set(category,(categories.get(category)||0)+cents);}
 return {total:totalCents/100,categories:[...categories].map(([name,cents])=>({name,amount:cents/100,share:totalCents?cents/totalCents:0}))};
}
function costSummaryHtml(items){
 const summary=aggregateCostItems(items);
 return `<section class="cost-overview"><div class="cost-grand"><span>行程总成本</span><strong>¥${money(summary.total)}</strong><small>按当前计入明细汇总</small></div><div class="cost-categories">${summary.categories.map(x=>`<div class="cost-category"><span>${esc(x.name)}</span><strong>¥${money(x.amount)}</strong><small>占总成本 ${(x.share*100).toFixed(1)}%</small></div>`).join('')||'<p class="muted">暂无计入明细</p>'}</div></section>`;
}
</script><script>render();</script><script>// Keep native values and change handlers as the single source of truth.
(() => {
 let count=0;
 function enhance(select){
  if(select.dataset.searchable)return;
  select.dataset.searchable='true';
  const box=document.createElement('span'),input=document.createElement('input'),arrow=document.createElement('button'),list=document.createElement('span');
  box.className='search-select';input.type='text';input.autocomplete='off';input.setAttribute('role','combobox');input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-expanded','false');
  list.id='select-options-'+(++count);list.setAttribute('role','listbox');list.hidden=true;input.setAttribute('aria-controls',list.id);
  const label=select.closest('label');input.setAttribute('aria-label',(label?.firstChild?.textContent||'请选择').trim());
  arrow.type='button';arrow.className='select-arrow';arrow.textContent='⌄';arrow.setAttribute('aria-label','展开选项');arrow.tabIndex=-1;
  select.before(box);box.append(input,arrow,list);select.classList.add('native-search-select');select.tabIndex=-1;
  const text=()=>select.selectedOptions[0]?.textContent||'';
  function close(){list.hidden=true;input.value=text();input.setAttribute('aria-expanded','false');}
  function sync(){input.disabled=select.disabled;arrow.disabled=select.disabled;input.value=text();input.setAttribute('aria-required',String(select.required));if(select.disabled)close();}
  function open(query=''){
   if(select.disabled)return;
   list.replaceChildren();
   Array.from(select.options).filter(o=>!o.disabled&&o.textContent.toLowerCase().includes(query.trim().toLowerCase())).forEach(o=>{
    const button=document.createElement('button');button.type='button';button.setAttribute('role','option');button.setAttribute('aria-selected',String(o.selected));button.textContent=(o.parentElement.tagName==='OPTGROUP'?o.parentElement.label+' · ':'')+o.textContent;
    button.onmousedown=e=>e.preventDefault();button.onclick=e=>{e.preventDefault();select.value=o.value;select.dispatchEvent(new Event('change',{bubbles:true}));close();input.focus();};list.append(button);
   });
   if(!list.children.length){const empty=document.createElement('span');empty.className='empty';empty.textContent='无匹配选项';list.append(empty);}
   list.hidden=false;input.setAttribute('aria-expanded','true');
  }
  input.addEventListener('focus',()=>open());input.addEventListener('click',()=>open());input.addEventListener('input',()=>open(input.value));
  input.addEventListener('keydown',e=>{if(e.key==='Escape'){close();e.preventDefault();}if(e.key==='ArrowDown'){if(list.hidden)open();list.querySelector('button')?.focus();e.preventDefault();}if(e.key==='Enter'){if(!list.hidden){list.querySelector('button')?.click();e.preventDefault();}}});
  list.addEventListener('keydown',e=>{const buttons=[...list.querySelectorAll('button')],i=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus();e.preventDefault();}if(e.key==='Escape'){close();input.focus();close();}});
  box.addEventListener('focusout',()=>setTimeout(()=>{if(!box.contains(document.activeElement))close();},0));
  arrow.onclick=e=>{e.preventDefault();if(list.hidden){input.focus();open();}else close();};
  select.addEventListener('change',sync);select.addEventListener('invalid',()=>{input.focus();input.setCustomValidity('请从下拉选项中选择');input.reportValidity();input.setCustomValidity('');});
  new MutationObserver(sync).observe(select,{childList:true,subtree:true,attributes:true});sync();
 }
 const scan=()=>document.querySelectorAll('select:not([data-searchable])').forEach(enhance);
 new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});scan();
})();
</script></html>
